function person(name,role,pay){return{name,role,pay,age:25+~~(Math.random()*30),quality:65+~~(Math.random()*27),reliability:65+~~(Math.random()*27),years:0,morale:75,skill:1}}
function tenant(name,owner,type,rent,health,since,anchor=false){return{name,owner,type,rent,health,since,anchor,rel:72+~~(Math.random()*18),leaseEnd:since+5+~~(Math.random()*5),cam:Math.round(rent*.18),deposit:rent*2,escalator:.03,age:32+~~(Math.random()*24),history:[`${since}: ${name} opened`],sales:rent*7,compat:0,construction:0,utility:"tenant",reviews:null}}
function property(name,year=1985){return{name,yearBought:year,condition:70,reputation:62,parking:66,roof:64,sign:58,security:55,lights:70,crime:18,marketing:0,stores:[tenant("Lakeview Grocery","Robert Hayes","Grocery",7200,96,1981,true),tenant("Tony's Pizza","Tony Marino","Pizza",2850,82,1984),tenant("Cut & Curl","Linda Carter","Hair Salon",1800,73,1982),null,tenant("Quick Wash","Ray Patel","Laundromat",2200,69,1979),tenant("Hometown Insurance","Susan Miller","Insurance",1950,78,1983),null,tenant("Lakeview Pharmacy","Frank Wilson","Pharmacy",3100,87,1980)],issues:[],leads:[],snapshots:[],history:[`${year}: Acquired ${name}`],manager:null}}
function base(){return{v:3,year:1985,month:1,week:1,cash:175000,debt:640000,rate:.095,insurance:1450,tax:18400,economy:70,population:26500,traffic:65,competition:30,roadwork:0,weather:"Clear,in",inbox:[{from:"Bank",text:"Welcome. Your first commercial mortgage payment is due this month."}],staff:[person("Earl Thompson","Maintenance Tech",2850)],contractors:{hvac:null,roof:null,snow:null,security:null,cleaning:null,landscape:null},properties:[property("Lakeview Plaza")],active:0,history:["Jan 1985 — Began your commercial real-estate career."],achievements:[],career:{rent:0,tenants:8,disasters:0,employeesRetired:0,propertiesBought:1},technology:["Landline telephone","Paper rent ledger"],broker:null,memories:[],opened:false,lastAnnual:null}}
function P(){return G.properties[G.active]}function money(n){return"$"+Math.round(n).toLocaleString()}function mn(){return new Date(2000,G.month-1).toLocaleString("en",{month:"short"})}function stamp(){return mn()+" "+G.year}function rand(a){return a[~~(Math.random()*a.length)]}
function migrate(){if(!G.properties){let old=G,pp=property("Lakeview Plaza");pp.stores=old.stores||pp.stores;["condition","reputation","parking","roof","sign","security","nightLights"].forEach(k=>{if(old[k]!=null)pp[k==="nightLights"?"lights":k]=old[k]});pp.history=old.history||pp.history;pp.issues=old.issues||[];pp.leads=old.leads||[];G={...base(),...old,v:3,properties:[pp],active:0,debt:old.mortgage||old.debt||640000,staff:old.staff||base().staff,history:old.history||[]}}G.contractors=G.contractors||base().contractors;Object.keys(base().contractors).forEach(k=>G.contractors[k]??=null);G.career=G.career||base().career;G.achievements=G.achievements||[];G.technology=G.technology||[];G.memories=G.memories||[];G.opened=G.opened??true;G.properties.forEach(pp=>{pp.snapshots??=[];pp.history??=[];pp.issues??=[];pp.leads??=[];pp.security??=55;pp.lights??=70;pp.crime??=18;pp.marketing??=0;pp.stores.forEach(t=>{if(t){t.rel??=t.relationship||70;t.age??=40;t.history??=[];t.cam??=Math.round(t.rent*.18);t.sales??=t.rent*7;t.construction??=0}})})}
function propValue(pp=P()){let noi=pp.stores.filter(Boolean).reduce((a,t)=>a+t.rent+t.cam,0)*12-90000;return Math.max(300000,Math.round(noi/.085+pp.condition*1800+pp.reputation*900))}
function render(){migrate();let pp=P();d.textContent=`W${G.week} ${mn()} ${G.year}`;c.textContent=money(G.cash);pname.textContent=pp.name;sign.textContent=pp.name.toUpperCase();mall.className="mall"+(night?" night":"");weather.textContent=(G.weather==="Snow"?"❄️":G.weather==="Rain"?"🌧️":G.weather==="Storm"?"⛈️":"☀️")+" "+G.weather;decor.textContent=G.month===10?"🎃 👻 🍂 🎃":G.month===12?"🎄 ✨ 🎁 🎄":G.month===7?"☀️ 🎈 ☀️":"";office.textContent=`OFFICE: ${pp.manager?pp.manager:"You"} · ${G.technology.slice(-1)[0]||"Paper files"}`;
stores.innerHTML=pp.stores.map((t,i)=>t?`<div class="store ${t.anchor?'anchor':''} ${t.temporary?'temp':''} ${t.construction>0?'construction':''}" onclick="openTenant(${i})"><div class=awning>${t.temporary?'🎪 ':''}${t.name}${t.anchor?' ★':''}</div><div class=window></div><div class=door></div></div>`:`<div class="store vacant" onclick="vacant(${i})"><div class=awning>FOR LEASE · ${101+i}</div><div class=window></div><div class=door></div></div>`).join("");
let occ=pp.stores.filter(Boolean).length,boost=pp.marketing/250+(pp.stores.some(t=>t&&t.anchor)?0.1:-.08);parking.innerHTML=Array.from({length:24},(_,i)=>Math.random()<Math.min(.92,occ/12+boost+G.traffic/250)?`<div class="${i%9===0?'truck':'car'}"></div>`:"<div></div>").join("");side.innerHTML=tabHTML()}
function tabHTML(){let pp=P();if(tab==="desk")return`<div class=card><h3>Manager Desk</h3>Condition ${pp.condition.toFixed(0)} · Reputation ${pp.reputation.toFixed(0)} · Occupancy ${Math.round(pp.stores.filter(Boolean).length/pp.stores.length*100)}%<br><small>Town population ${G.population.toLocaleString()} · Traffic ${G.traffic} · Economy ${G.economy}</small></div><div class=card><h3>📥 Inbox</h3>${G.inbox.length?G.inbox.slice(0,9).map((x,i)=>`<div class=log><b>${x.from}</b>: ${x.text}<div class=row><button onclick="handle(${i})">Handle</button></div></div>`).join(""):"Inbox clear."}</div><div class=card><h3>Today's Management</h3><button onclick=walkProperty()>Walk Property</button> <button onclick=tenantRound()>Tenant Round</button> <button onclick=officeUpgrade()>Upgrade Office</button> <button onclick=randomDecision()>Management Decision</button></div>${G.lastAnnual?`<div class=card><h3>📊 Last Annual Review</h3>${G.lastAnnual}</div>`:""}`;
if(tab==="tenants")return`<div class=card><h3>Tenant Roster</h3>${pp.stores.map((t,i)=>t?`<div class=log><b>${t.name}</b> — ${t.owner}, ${t.age}<br><small>Health ${t.health.toFixed(0)} · Relationship ${t.rel} · Est. sales ${money(t.sales)}/mo</small><br><span class=pill>${t.type}</span>${t.anchor?'<span class=pill>ANCHOR</span>':''}<button onclick="openTenant(${i})">Open</button></div>`:"").join("")}</div>`;
if(tab==="leasing")return`<div class=card><h3>Broker & Prospects</h3>Broker: ${G.broker||"Self-managed"}<div class=row><button onclick=hireBroker()>Hire Broker</button><button onclick=generateLead()>Find Prospect</button></div>${pp.leads.map((x,i)=>`<div class=log><b>${x.name}</b><br>${x.type} · Experience ${x.exp}% · Cash ${money(x.cash)}<br>Offer ${money(x.rent)}/mo · TI ${money(x.ti)}<br><button onclick="interview(${i})">Interview / LOI</button></div>`).join("")}</div><div class=card><h3>Redevelopment</h3><button onclick=subdivideAnchor()>Subdivide Vacant Anchor</button> <button onclick=buildout()>Start Buildout</button> <button onclick=market()>Center Marketing</button></div>`;
if(tab==="ops")return`<div class=card><h3>Employees</h3>${G.staff.map((x,i)=>`<div class=log>${x.name}, ${x.age} — <b>${x.role}</b><br><small>${money(x.pay)}/mo · Skill ${x.skill} · Morale ${x.morale} · ${x.years} yrs</small><br><button onclick="employee(${i})">Manage</button></div>`).join("")}<button onclick=hireStaff()>Hire</button></div><div class=card><h3>Work Orders</h3>${pp.issues.map((x,i)=>`<div class=log>${x.text}<br>${money(x.cost)} · ${x.category}<br><button onclick="assign(${i})">Assign</button></div>`).join("")||"None open."}</div><div class=card><h3>Contractors / Deliveries</h3><button onclick=contractors()>Contractor List</button> <button onclick=deliveryIssue()>Simulate Delivery</button></div>`;
if(tab==="town")return`<div class=card><h3>🗺️ Town Map</h3><div class=map>${G.properties.map((x,i)=>`<div class=property onclick="switchProp(${i})"><b>${x.name}</b><br>${Math.round(x.stores.filter(Boolean).length/x.stores.length*100)}% occupied<br>${money(propValue(x))}</div>`).join("")}<div class=property onclick=acquire()>🏷️ Property For Sale</div><div class=property onclick=develop()>🏗️ Development Site</div></div></div><div class=card><h3>Town Conditions</h3>Population ${G.population.toLocaleString()} · Road traffic ${G.traffic}<br>Competition ${G.competition} · Roadwork ${G.roadwork?"ACTIVE":"None"}<br><button onclick=government()>Local Government / Zoning</button></div>`;
if(tab==="money")return`<div class=card><h3>Finance</h3>Cash ${money(G.cash)}<br>Debt ${money(G.debt)} @ ${(G.rate*100).toFixed(1)}%<br>Annual tax ${money(G.tax)} · Insurance ${money(G.insurance)}/mo<br>Current center value ${money(propValue())}<div class=row><button onclick=refi()>Refinance</button><button onclick=credit()>Credit Line</button><button onclick=sale()>Sale Offer</button></div></div><div class=card><h3>Portfolio</h3>${G.properties.map(x=>`${x.name}: ${money(propValue(x))}<br>`).join("")}</div>`;
if(tab==="archive")return`<div class=card><h3>🕰️ Property Archive</h3><button onclick=snapshot()>Take Snapshot</button>${pp.snapshots.slice().reverse().map((x,i)=>`<div class=archiveShot><b>${x.date}</b> · ${money(x.value)}<br>${x.occ}% occupied<br><small>${x.tenants}</small><br><button onclick="viewSnapshot(${pp.snapshots.length-1-i})">Walk Through</button></div>`).join("")||"<p class=muted>No snapshots yet.</p>"}</div><div class=card><h3>History</h3>${pp.history.slice(-35).reverse().map(x=>`<div class=log>${x}</div>`).join("")}</div>`;
return`<div class=card><h3>🏆 Career & Legacy</h3>Career rent collected: ${money(G.career.rent)}<br>Properties bought: ${G.career.propertiesBought}<br>Disasters survived: ${G.career.disasters}<br>Employees retired: ${G.career.employeesRetired}<br>Years in business: ${G.year-1985}<br><button onclick=hallOfFame()>Hall of Fame</button><h3>Achievements</h3>${G.achievements.map(x=>`<span class=pill>🏆 ${x}</span>`).join("")||"None yet."}</div><div class=card><h3>Technology Timeline</h3>${G.technology.map(x=>`<div class=log>${x}</div>`).join("")}</div>`}
function openTenant(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>${t.name}${t.anchor?" ★":""}</h2><p><b>${t.owner}</b>, age ${t.age} · ${t.type}</p><p>Rent ${money(t.rent)} + CAM ${money(t.cam)} · Lease ends ${t.leaseEnd}<br>Health ${t.health.toFixed(0)} · Relationship ${t.rel} · Sales ${money(t.sales)}/mo<br>Buildout ${t.construction>0?t.construction+" weeks remaining":"complete"} · Utilities ${t.utility}</p><p>${talkText(t)}</p><button onclick="talk(${i})">Talk</button> <button onclick="renew(${i})">Renew</button> <button onclick="succession(${i})">Succession</button> <button onclick="legal(${i})">Lease/Legal</button> <button onclick="reviews(${i})">Reviews</button> <button onclick=closeModal()>Close</button>`}
function talkText(t){return t.health<40?`"${t.owner}: Business is struggling. I need some help."`:t.age>60?`"${t.owner}: I've been thinking about what happens when I retire."`:t.rel>85?`"${t.owner}: I really like being here. What can we do next?"`:`"${t.owner}: More traffic would help us."`}
function talk(i){let t=P().stores[i];t.rel=Math.min(100,t.rel+5);t.history.push(`${stamp()}: Owner meeting`);P().history.push(`${stamp()} — Met with ${t.owner}.`);closeModal();render()}
function renew(i){let t=P().stores[i];if(t.rel+t.health+P().condition>185){t.rent=Math.round(t.rent*1.06);t.cam=Math.round(t.rent*.18);t.leaseEnd+=5;t.history.push(`${stamp()}: Lease renewed`);alert("Renewal signed.")}else alert("Tenant wants concessions or improvements.");render()}
function succession(i){let t=P().stores[i];if(t.age<58)return alert("No immediate retirement plan.");let child=rand(FIRST)+" "+t.owner.split(" ").pop();t.history.push(`${stamp()}: ${child} entered succession plan`);if(Math.random()<.5){t.owner=child;t.age=28+~~(Math.random()*15);P().history.push(`${stamp()} — ${t.name} passed to the next generation.`);achievement("Second-generation tenant")}alert(`Succession discussion: ${child}`);render()}
function legal(i){let t=P().stores[i];let issues=["unauthorized signage","late rent","exclusivity concern","abandoned storage","lease-use violation"];alert(`Lease review: ${Math.random()<.35?rand(issues)+" requires follow-up":"No material violations found."}`)}
function reviews(i){let t=P().stores[i];if(G.year<1998)return alert("Online consumer reviews are not part of this era yet.");t.reviews=t.reviews||+(2.8+Math.random()*2).toFixed(1);alert(`${t.name}: ${t.reviews} / 5 online rating.`)}
function vacant(i){modal.style.display="flex";modalbox.innerHTML=`<h2>Vacant Suite ${101+i}</h2><button onclick="generateLead();closeModal()">Market</button> <button onclick="popUp(${i})">Seek Seasonal Pop-Up</button> <button onclick=closeModal()>Close</button>`}
function generateLead(){if(!P().stores.some(x=>!x))return alert("No vacancy.");let type=rand(TYPES),owner=rand(FIRST)+" "+rand(LAST);P().leads.push({name:owner.split(" ")[0]+"'s "+type,owner,type,rent:1700+~~(Math.random()*3000),ti:4000+~~(Math.random()*40000),exp:35+~~(Math.random()*64),cash:25000+~~(Math.random()*160000),plan:rand(["family-run concept","experienced operator","first-time entrepreneur","regional expansion","franchise location"])});render()}
function interview(i){let x=P().leads[i],idx=P().stores.findIndex(v=>!v);modal.style.display="flex";modalbox.innerHTML=`<h2>Prospective Tenant Interview</h2><p><b>${x.owner}</b> proposes ${x.name}, a ${x.plan}.</p><p>Experience ${x.exp}% · Available capital ${money(x.cash)}<br>LOI: ${money(x.rent)}/mo, ${money(x.ti)} TI, 5-year term.</p><button onclick="accept(${i},${idx})">Accept LOI</button> <button onclick="counter(${i})">Counter Rent +8%</button> <button onclick=closeModal()>Hold</button>`}
function accept(i,idx){let x=P().leads[i];if(G.cash<x.ti)return alert("Not enough cash for TI.");G.cash-=x.ti;let t=tenant(x.name,x.owner,x.type,x.rent,Math.min(95,x.exp*.7+x.cash/10000),G.year);t.construction=2+~~(Math.random()*7);P().stores[idx]=t;P().leads.splice(i,1);P().history.push(`${stamp()} — Signed ${x.name}; buildout began.`);G.career.tenants++;closeModal();render()}
function counter(i){let x=P().leads[i];if(Math.random()<x.exp/120+.25){x.rent=Math.round(x.rent*1.08);alert("Counter accepted.")}else{P().leads.splice(i,1);alert("Prospect walked.")}render()}
function popUp(i){let opts=G.month>=7&&G.month<=10?["Halloween Superstore", "Costume Warehouse"]:G.month>=10||G.month<=1?["Holiday Wonderland","Christmas Outlet"]:["Tax Prep Pop-Up","Furniture Clearance"];let name=rand(opts),t=tenant(name,"Regional Leasing Rep","Seasonal",3200,82,G.year);t.temporary=true;t.end=G.year*12+G.month+3;t.construction=1;P().stores[i]=t;P().history.push(`${stamp()} — ${name} signed a temporary lease.`);closeModal();render()}
function subdivideAnchor(){let i=P().stores.findIndex(t=>!t);if(i<0)return alert("Need vacant space first.");if(G.cash<85000)return alert("Need $85,000.");G.cash-=85000;P().stores.push(null,null);P().condition=Math.min(100,P().condition+4);P().history.push(`${stamp()} — Major space was subdivided for smaller tenants.`);render()}
function buildout(){let i=P().stores.findIndex(t=>t&&t.construction===0);if(i<0)return alert("No suitable tenant.");if(G.cash<30000)return alert("Need $30,000.");G.cash-=30000;P().stores[i].construction=5;P().history.push(`${stamp()} — Renovation started for ${P().stores[i].name}.`);render()}
function market(){if(G.cash<6000)return alert("Need $6,000.");G.cash-=6000;P().marketing=Math.min(100,P().marketing+30);P().reputation=Math.min(100,P().reputation+3);render()}
function hireBroker(){G.broker=G.broker?"Premier Commercial Realty":"Premier Commercial Realty";alert("Broker hired. Leasing leads will be somewhat stronger.");render()}
function hireStaff(){let roles=[["Property Manager",4100],["Maintenance Tech",3000],["Groundskeeper",2450],["Leasing Manager",4300]];modal.style.display="flex";modalbox.innerHTML="<h2>Hire Staff</h2>"+roles.map((x,i)=>`<button onclick="doHire('${x[0]}',${x[1]})">${x[0]} ${money(x[1])}/mo</button>`).join(" ")+"<br><br><button onclick=closeModal()>Close</button>"}
function doHire(role,pay){let x=person(rand(FIRST)+" "+rand(LAST),role,pay);G.staff.push(x);G.history.push(`${stamp()} — Hired ${x.name}, ${role}.`);if(role==="Property Manager"&&!P().manager)P().manager=x.name;closeModal();render()}
function employee(i){let x=G.staff[i];modal.style.display="flex";modalbox.innerHTML=`<h2>${x.name}</h2><p>${x.role} · age ${x.age}<br>Skill ${x.skill} · Morale ${x.morale} · Quality ${x.quality} · Reliability ${x.reliability}</p><button onclick="raiseEmp(${i})">Give 8% Raise</button> <button onclick="trainEmp(${i})">Training $1,500</button> <button onclick="promoteEmp(${i})">Promote</button> <button onclick=closeModal()>Close</button>`}
function raiseEmp(i){let x=G.staff[i];x.pay=Math.round(x.pay*1.08);x.morale=Math.min(100,x.morale+12);render();employee(i)}
function trainEmp(i){if(G.cash<1500)return alert("Need $1,500.");G.cash-=1500;let x=G.staff[i];x.skill++;x.quality=Math.min(100,x.quality+5);render();employee(i)}
function promoteEmp(i){let x=G.staff[i];if(x.role==="Maintenance Tech"&&x.skill>=3){x.role="Property Manager";x.pay=Math.round(x.pay*1.3);P().manager=x.name;alert("Promoted to Property Manager.")}else alert("More experience/training is needed for promotion.");render()}
function contractors(){modal.style.display="flex";modalbox.innerHTML="<h2>Contractors</h2>"+Object.keys(CONTRACTORS).map(k=>`<button onclick="chooseContractor('${k}')">${k.toUpperCase()}</button>`).join(" ")+"<br><br><button onclick=closeModal()>Close</button>"}
function chooseContractor(k){modalbox.innerHTML=`<h2>${k}</h2>`+CONTRACTORS[k].map((x,i)=>`<div class=card>${x[0]} · Q${x[1]} R${x[2]} · ${x[3]}x cost <button onclick="setContractor('${k}',${i})">Select</button></div>`).join("")}
function setContractor(k,i){let x=CONTRACTORS[k][i];G.contractors[k]={name:x[0],quality:x[1],reliability:x[2],factor:x[3]};closeModal();render()}
function addIssue(text,cost,cat){P().issues.push({text,cost,category:cat||"maintenance"})}
function assign(i){let x=P().issues[i],tech=G.staff.find(e=>e.role==="Maintenance Tech"),con=G.contractors[x.category];modal.style.display="flex";modalbox.innerHTML=`<h2>Assign Work</h2>${tech?`<button onclick="finishIssue(${i},'staff')">${tech.name}</button>`:""} ${con?`<button onclick="finishIssue(${i},'contract')">${con.name}</button>`:""} <button onclick="finishIssue(${i},'emergency')">Emergency Vendor</button>`}
function finishIssue(i,m){let x=P().issues[i],cost=x.cost,q=68,r=70;if(m==="staff"){let e=G.staff.find(z=>z.role==="Maintenance Tech");cost*=.45;q=e.quality;r=e.reliability}if(m==="contract"){let z=G.contractors[x.category];cost*=z.factor;q=z.quality;r=z.reliability}if(m==="emergency")cost*=1.35;if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;if(Math.random()*100<(q+r)/2){P().issues.splice(i,1);P().condition=Math.min(100,P().condition+2)}else{x.cost=Math.round(x.cost*1.15);alert("Repair failed; issue remains.")}closeModal();render()}
function deliveryIssue(){G.inbox.push({from:"Back Lot",text:rand(["A grocery delivery truck is blocking two tenants.","Tony says another tenant filled the dumpster.","A delivery damaged a bollard.","A truck arrived before permitted delivery hours."])});render()}
function walkProperty(){if(Math.random()<.55){let e=rand([["Pothole found near entrance.",3200,"landscape"],["Roof drain appears clogged.",1800,"roof"],["Rear security light is out.",900,"security"],["Dumpster enclosure gate is broken.",1400,"cleaning"]]);addIssue(...e);alert("You found a new work item.")}else alert("Property walk completed. No major issues found.");render()}
function tenantRound(){P().stores.filter(Boolean).forEach(t=>t.rel=Math.min(100,t.rel+1));P().reputation=Math.min(100,P().reputation+1);render()}
function officeUpgrade(){let cost=G.year<2000?8000:18000;if(G.cash<cost)return alert("Need "+money(cost));G.cash-=cost;P().condition=Math.min(100,P().condition+2);G.history.push(`${stamp()} — Upgraded the property-management office.`);render()}
function switchProp(i){G.active=i;render()}
function acquire(){let price=750000+~~(Math.random()*1100000),name=rand(["Riverside Shops","Pine Ridge Center","Market Square","Westgate Plaza"]);modal.style.display="flex";modalbox.innerHTML=`<h2>${name}</h2><p>Asking ${money(price)} · existing neighborhood center.</p><button onclick="buy('${name}',${price})">Buy with 20% down</button> <button onclick=closeModal()>Pass</button>`}
function buy(name,price){let down=price*.2;if(G.cash<down)return alert("Need "+money(down));G.cash-=down;G.debt+=price-down;let pp=property(name,G.year);pp.condition=50+~~(Math.random()*40);pp.reputation=45+~~(Math.random()*40);G.properties.push(pp);G.career.propertiesBought++;G.history.push(`${stamp()} — Acquired ${name}.`);closeModal();achievement("Portfolio owner");render()}
function develop(){let cost=1200000;if(G.cash<240000)return alert("Development requires $240,000 equity.");G.cash-=240000;G.debt+=960000;let pp=property("New Town Center",G.year);pp.stores=Array(10).fill(null);pp.condition=100;pp.reputation=50;G.properties.push(pp);G.career.propertiesBought++;G.history.push(`${stamp()} — Completed a ground-up retail development.`);achievement("Developer");render()}
function government(){let e=rand(["Road widening approved near your center.","A traffic signal is planned at the entrance.","A zoning hearing is scheduled for nearby apartments.","Property assessment increased.","Town approved a redevelopment incentive."]);G.inbox.push({from:"Town Hall",text:e});if(e.includes("apartments"))G.population+=800;if(e.includes("signal"))G.traffic+=5;if(e.includes("assessment"))G.tax=Math.round(G.tax*1.08);render()}
function refi(){let nr=Math.max(.05,.07+(70-G.economy)/1000+Math.random()*.02);if(nr<G.rate){G.rate=nr;G.cash-=4500;alert("Refinanced at "+(nr*100).toFixed(1)+"%.")}else alert("Current market terms are not better.");render()}
function credit(){G.cash+=50000;G.debt+=55000;render()}
function sale(){let offer=Math.round(propValue()*(.93+Math.random()*.15));alert(`Broker indicates ${P().name} could draw an offer near ${money(offer)}. No sale completed.`)}
function snapshot(){let pp=P(),occ=Math.round(pp.stores.filter(Boolean).length/pp.stores.length*100);pp.snapshots.push({date:stamp(),value:propValue(),occ,condition:Math.round(pp.condition),tenants:pp.stores.filter(Boolean).map(t=>t.name).join(", "),stores:pp.stores.map(t=>t?{name:t.name,type:t.type,anchor:t.anchor}:null)});pp.history.push(`${stamp()} — Property snapshot archived.`);render()}
function viewSnapshot(i){let x=P().snapshots[i];modal.style.display="flex";modalbox.innerHTML=`<h2>🕰️ ${P().name} — ${x.date}</h2><p>Value ${money(x.value)} · ${x.occ}% occupied · condition ${x.condition}%</p><div class=map>${x.stores.map((t,j)=>`<div class=property>${t?`${t.anchor?"★ ":""}${t.name}<br><small>${t.type}</small>`:`Suite ${101+j}<br>VACANT`}</div>`).join("")}</div><p><small>This is the archived tenant layout from that point in your property's history.</small></p><button onclick=closeModal()>Return to Present</button>`}
function handle(i){G.history.push(`${stamp()} — Handled ${G.inbox[i].from} item.`);G.inbox.splice(i,1);render()}
function reviewsEra(){if(G.year===1998&&!G.technology.includes("Email and basic website"))G.technology.push("Email and basic website");if(G.year===2008&&!G.technology.includes("Online reviews and digital listings"))G.technology.push("Online reviews and digital listings");if(G.year===2016&&!G.technology.includes("Online rent payments and cloud management"))G.technology.push("Online rent payments and cloud management");if(G.year===2024&&!G.technology.includes("Smart HVAC, cameras and EV charging"))G.technology.push("Smart HVAC, cameras and EV charging")}
function historicalTypes(){if(G.year>2005)P().stores.filter(t=>t&&t.type==="Video Rental").forEach(t=>t.health-=12);if(G.year>2010)P().stores.filter(t=>t&&["Bookstore","Travel Agency"].includes(t.type)).forEach(t=>t.health-=4)}
function compatibility(pp){pp.stores.filter(Boolean).forEach(t=>{let bonus=0;if(t.type==="Pizza"&&pp.stores.some(x=>x&&x.type==="Video Rental"))bonus+=2;if(pp.stores.some(x=>x&&x.anchor))bonus+=2;let same=pp.stores.filter(x=>x&&x.type===t.type).length;if(same>1)bonus-=same*2;t.compat=bonus;t.health=Math.max(3,Math.min(100,t.health+bonus/3))})}
function weeklyEvents(){let pp=P();if(Math.random()<.11){let e=rand([["HVAC compressor failed.",7600,"hvac"],["Roof leak reported.",4400,"roof"],["Parking light failed.",1100,"security"],["Dumpster enclosure overflowing.",1900,"cleaning"],["Pothole near entrance.",3300,"landscape"],["Vandalism behind the center.",2800,"security"]]);addIssue(...e)}if(Math.random()<.08){let t=rand(pp.stores.filter(Boolean));if(t)G.inbox.push({from:`Tenant: ${t.name}`,text:rand(["Requests better signage.","Complains about parking.","Wants to discuss expansion.","Reports a delivery conflict.","Wants a rent meeting."])})}if(Math.random()<pp.crime/600)addIssue("Break-in damage reported.",5200,"security")}
function weatherRoll(){let r=Math.random(),winter=[12,1,2].includes(G.month);G.weather=winter?(r<.32?"Snow":r<.48?"Cloudy":"Clear"):(r<.18?"Rain":r<.23?"Storm":"Clear");if(G.weather==="Snow"){let co=G.contractors.snow,cost=co?900*co.factor:1300;G.cash-=cost;if(!co)P().reputation=Math.max(0,P().reputation-1)}if(G.weather==="Storm"&&Math.random()<.18){addIssue("Storm damaged exterior property.",12000,"roof");G.career.disasters++}}
function advanceWeek(){G.week++;weeklyEvents();P().stores.filter(Boolean).forEach(t=>{if(t.construction>0)t.construction--});if(G.week>4){G.week=1;monthTick()}autoSave();render()}
function advanceMonth(){for(let z=0;z<speed;z++)monthTick();autoSave();render()}
function monthTick(){G.properties.forEach(pp=>{let rent=pp.stores.filter(t=>t&&t.construction===0).reduce((a,t)=>a+t.rent+t.cam,0);G.cash+=rent;G.career.rent+=rent;let mgr=pp.manager?1200:0;G.cash-=4500+mgr;pp.condition=Math.max(0,pp.condition-.22);let vacancies=pp.stores.filter(x=>!x).length;if(vacancies&&Math.random()<vacancies*.025){pp.condition=Math.max(0,pp.condition-.5);if(Math.random()<.25)pp.issues.push({text:"A vacant suite needs cleanup before showings.",cost:900,category:"cleaning"})}pp.roof=Math.max(0,pp.roof-.25);pp.parking=Math.max(0,pp.parking-.2);pp.marketing=Math.max(0,pp.marketing-4);compatibility(pp);pp.stores.forEach((t,i)=>{if(!t)return;t.sales=Math.max(5000,t.rent*(5+G.traffic/30+G.economy/40+t.compat/5)*(0.8+Math.random()*.4));t.health=Math.max(3,Math.min(100,t.health+(Math.random()*7-3.5)+(G.economy-50)/100-(G.competition/200)));if(t.health<14&&Math.random()<.1){pp.history.push(`${stamp()} — ${t.name} closed.`);pp.stores[i]=null}if(t.temporary&&G.year*12+G.month>=t.end){pp.history.push(`${stamp()} — ${t.name} seasonal lease ended.`);pp.stores[i]=null}})});
let payroll=G.staff.reduce((a,x)=>a+x.pay,0),interest=G.debt*G.rate/12,pay=Math.min(G.debt,3500+interest);G.cash-=payroll+G.insurance+pay+2300;G.debt=Math.max(0,G.debt-(pay-interest));G.month++;if(G.month>12){G.month=1;G.year++;G.population=Math.round(G.population*(.992+Math.random()*.025));G.traffic=Math.max(30,Math.min(100,G.traffic+~~(Math.random()*9)-4));G.economy=Math.max(30,Math.min(95,G.economy+~~(Math.random()*13)-6));G.competition=Math.max(10,Math.min(95,G.competition+~~(Math.random()*11)-4));annualReview();G.tax=Math.round(G.tax*1.025);G.staff.forEach((x,i)=>{x.age++;x.years++;x.morale=Math.max(30,x.morale-2);if(x.age>64&&Math.random()<.15){G.history.push(`${G.year} — ${x.name} retired after ${x.years} years.`);G.career.employeesRetired++;G.staff.splice(i,1)}});G.properties.forEach(pp=>pp.stores.filter(Boolean).forEach(t=>{t.age++;if(!t.temporary){t.rent=Math.round(t.rent*(1+t.escalator));t.cam=Math.round(t.rent*.18)}}));reviewsEra();historicalTypes();if(G.year%5===0)G.properties.forEach((_,i)=>{let a=G.active;G.active=i;snapshot();G.active=a});if(Math.random()<.2){G.roadwork=1;G.traffic=Math.max(25,G.traffic-8);G.inbox.push({from:"Town Hall",text:"Road construction will affect access this year."})}else G.roadwork=0}
weatherRoll();if(P().leads.length<2&&Math.random()<.28)generateLead();achievements();render()}
function achievement(x){if(!G.achievements.includes(x))G.achievements.push(x)}
function achievements(){if(G.properties.length>=3)achievement("Three-property portfolio");if(G.debt<=0)achievement("Debt free");if(G.year-1985>=25)achievement("25-year owner");if(G.year-1985>=50)achievement("50-year legacy");if(G.properties.some(p=>p.stores.every(Boolean)))achievement("100% occupancy");if(G.properties.reduce((a,p)=>a+propValue(p),0)>=10000000)achievement("$10M portfolio")}

function remember(title,text){if(!G.memories.some(x=>x.title===title&&x.date===stamp()))G.memories.push({title,date:stamp(),text})}
function openingScenario(){if(G.opened)return;G.opened=true;modal.style.display="flex";modalbox.innerHTML=`<h2>🏬 January 1985 — Welcome to Lakeview Plaza</h2><p>You just bought an aging neighborhood strip center with existing leases, an old roof, a tired parking lot and several owners eager to meet the new landlord.</p><p><b>Mortgage:</b> ${money(G.debt)}<br><b>Starting cash:</b> ${money(G.cash)}<br><b>Condition:</b> ${P().condition}%<br><b>Existing tenants:</b> ${P().stores.filter(Boolean).length}</p><p>Collect rent, fill vacancies, keep the building alive, and try not to make Tony mad.</p><button onclick="remember('The Lakeview Purchase','You took ownership of Lakeview Plaza and inherited its original tenants.');closeModal();render()">Take the Keys 🔑</button>`}
function randomDecision(){let q=rand([["Tony's Sidewalk Tables","Tony wants six tables outside the pizza shop."],["The Parking War","The grocery manager says restaurant customers are taking prime spaces."],["Unauthorized Paint Job","A tenant painted its storefront neon without approval."],["Kids Behind the Center","Teenagers are skateboarding behind the stores."]]);modal.style.display="flex";modalbox.innerHTML=`<h2>📞 ${q[0]}</h2><p>${q[1]}</p><button onclick="decisionResult('${q[0]}',0)">Approve / Fix</button> <button onclick="decisionResult('${q[0]}',1)">Push Back / Ignore</button>`}
function decisionResult(title,n){if(title.includes("Tony")){let t=P().stores.find(x=>x&&x.name.includes("Tony"));if(n===0){P().reputation+=2;t.health+=4;remember("Tony's Patio Experiment","You let Tony add sidewalk tables.")}else{G.cash+=1500;t.rel-=4}}else if(title.includes("Parking")){if(n===0){G.cash-=1200;P().reputation+=1;remember("The Parking War","You intervened in a tenant parking dispute.")}else P().reputation-=2}else if(title.includes("Paint")){if(n===0)P().condition+=1;else{P().reputation+=1;P().condition-=1}}else{if(n===0){G.cash-=2000;P().security+=4}else if(Math.random()<.4)addIssue("Skateboard damage behind the center.",1800,"maintenance")}closeModal();render()}
function annualReview(){let pp=P(),occ=Math.round(pp.stores.filter(Boolean).length/pp.stores.length*100),arr=pp.stores.filter(Boolean).slice().sort((a,b)=>b.sales-a.sales),best=arr[0];G.lastAnnual=`<b>${G.year-1} Results</b><br>Occupancy ${occ}% · Value ${money(propValue(pp))}<br>Debt ${money(G.debt)}<br>Best tenant: ${best?best.name:"None"}<br>Open work orders: ${pp.issues.length}`;G.inbox.push({from:"Annual Review",text:`Your ${G.year-1} year-end report is ready.`})}
function hallOfFame(){let all=[];G.properties.forEach(pp=>pp.stores.filter(Boolean).forEach(t=>all.push(t)));all.sort((a,b)=>a.since-b.since);let longest=all[0];modal.style.display="flex";modalbox.innerHTML=`<h2>🎖️ Hall of Fame</h2><p>Career: ${G.year-1985} years<br>Properties: ${G.properties.length}<br>Portfolio value: ${money(G.properties.reduce((a,p)=>a+propValue(p),0))}<br>Career rent: ${money(G.career.rent)}<br>Debt: ${money(G.debt)}<br>Longest current tenant: ${longest?longest.name+" since "+longest.since:"None"}<br>Employees retired: ${G.career.employeesRetired}<br>Disasters survived: ${G.career.disasters}</p><h3>Memories</h3>${G.memories.slice(-12).map(x=>`<div class=log><b>${x.title}</b> — ${x.date}</div>`).join("")}<button onclick=closeModal()>Back</button>`}
function autoSave(){try{localStorage.setItem("stripMallTycoonV31",JSON.stringify(G))}catch(e){}}

function save(){localStorage.setItem("stripMallTycoonV31",JSON.stringify(G));localStorage.setItem("stripMallTycoonV3",JSON.stringify(G));localStorage.setItem("stripMallTycoonV2",JSON.stringify(G));alert("Saved.")}
function load(){let s=localStorage.getItem("stripMallTycoonV31")||localStorage.getItem("stripMallTycoonV3")||localStorage.getItem("stripMallTycoonV2")||localStorage.getItem("stripMallTycoonV1");if(!s)return alert("No save found.");G=JSON.parse(s);migrate();render()}
function newGame(){if(!G||confirm("Start a new 1985 career?")){G=base();render();setTimeout(openingScenario,80)}}
function closeModal(){modal.style.display="none"}newGame();
</script></body></html>
