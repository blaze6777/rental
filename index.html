   if(suite!==null&&existing.suite==null)existing.suite=suite;
   return{wo:existing,duplicate:true};
 }

 if(wo){

   wo.legacyLinks=wo.legacyLinks||[];wo.history=wo.history||[];

 return{wo,duplicate:false};
}

function generateWeatherV14(){v14Init();let m=G.month||1,w=G.v14.weather,r=Math.random();if([12,1,2].includes(m)){w.temp=Math.round(8+Math.random()*35);w.condition=r<.32?"Snow":r<.52?"Freezing / Ice":r<.78?"Cloudy":"Clear";w.snow=w.condition==="Snow"?Math.round(1+Math.random()*8):0;w.rain=0}
 else if([3,4,5].includes(m)){w.temp=Math.round(38+Math.random()*38);w.condition=r<.38?"Rain":r<.48?"Thunderstorm":r<.75?"Cloudy":"Clear";w.rain=w.condition.includes("Rain")||w.condition==="Thunderstorm"?+(0.2+Math.random()*2.8).toFixed(1):0;w.snow=0}
 else if([6,7,8].includes(m)){w.temp=Math.round(67+Math.random()*32);w.condition=r<.18?"Thunderstorm":r<.35?"Hot / Humid":"Clear";w.rain=w.condition==="Thunderstorm"?+(0.4+Math.random()*2.2).toFixed(1):0;w.snow=0}
 else {w.temp=Math.round(38+Math.random()*38);w.condition=r<.25?"Rain":r<.55?"Windy":r<.75?"Cloudy":"Clear";w.rain=w.condition==="Rain"?+(0.2+Math.random()*1.8).toFixed(1):0;w.snow=0}

function syncExpansionAssetsV153(){
 if(!P().expansion?.phases)return;
 P().expansion.phases.filter(p=>p.status==="Completed"&&p.suites?.length).forEach((p,pi)=>{
   if(p.v153AssetsAdded)return;
   let roofName=`Expansion Roof — ${p.name} (${p.suites[0]}–${p.suites[p.suites.length-1]})`;
   if(G.roofSections&&!G.roofSections.some(r=>r.name===roofName))G.roofSections.push({name:roofName,age:0,life:24,condition:100,repairs:0,expansion:true,suites:p.suites.slice()});
   if(G.buildingWear&&!Object.values(G.buildingWear).some(x=>x&&x.expansionPhase===p.started)){
      let key="expansionRoof_"+pi+"_"+String(p.started).replace(/\W/g,"");
      G.buildingWear[key]={name:roofName,installed:G.year,life:24,cost:Math.round(p.total*.12),condition:100,repairs:0,deferred:0,history:[`${p.completed||stamp()}: New expansion roof placed in service.`],expansionPhase:p.started};
   }
   let needed=Math.max(1,Math.ceil(p.count/2));
   for(let n=0;n<needed;n++){
     let suite=p.suites[Math.min(n*2,p.suites.length-1)],label=`Expansion ${suite}${p.suites[n*2+1]?`–${p.suites[n*2+1]}`:""}`;
     if(G.rtus&&!G.rtus.some(r=>r.expansionPhase===p.started&&r.expansionIndex===n)){
       let maxid=G.rtus.reduce((m,r)=>Math.max(m,+r.id||0),0);
       G.rtus.push({id:maxid+1,tenant:label,age:0,life:18,condition:100,repairs:0,expansion:true,expansionPhase:p.started,expansionIndex:n});
     }
   }
   G.v153.expansionAssets.push({phase:p.name,suites:p.suites.slice(),roof:roofName,rtus:needed,year:G.year});
   p.v153AssetsAdded=true;
   addHistoryV14("Expansion assets placed in service",`${p.name}: new roof section and ${needed} HVAC unit(s) added to the property asset register.`,"Capital",true);
 });
}

function rentMonthTickV16(){
 v16Init();
 P().stores.forEach((t,i)=>{
  if(!t)return;
  let r=G.v16.rent[i];r.current=t.rent||r.current;
  const health=Math.max(0,Math.min(100,Number(t.health)||70));
  const sales=Math.max(1,Number(G.v15?.sales?.[i]?.monthly)||Number(t.sales)||r.current*7);
  const rentRatio=r.current/sales;
  // Healthy tenants should pay reliably. Severe trouble creates meaningful risk.
  let payChance=health>=75?.985:health>=60?.965:health>=45?.91:health>=30?.78:health>=15?.57:.37;
  if(rentRatio>.25)payChance-=.10;else if(rentRatio>.18)payChance-=.035;
  if(r.plan)payChance=Math.min(.99,payChance+.05);
  payChance=Math.max(.20,Math.min(.995,payChance));
  const pay=Math.random()<payChance;
  if(pay){
   // Current rent is always paid first; arrears only reduce on an actual extra payment.
   const arrearsPay=r.balance>0?Math.min(r.balance,Math.round(r.current*(health>=60?.65:health>=40?.35:.12))):0; const cam=Math.max(0,Number(t.cam)||0); const due=r.current+cam+arrearsPay; G.cash+=due;addLedger(`${t.name} rent & CAM payment`,due);
   r.balance=Math.max(0,r.balance-arrearsPay);
   r.daysLate=r.balance?Math.max(0,r.daysLate-(arrearsPay>0?15:0)):0;
   r.status=r.balance?(r.plan?"Payment Plan":"Past Due"):"Current";
   r.lastPayment=stamp();
   r.ledger.push(`${stamp()}: Received ${money(r.current)} current rent${cam?` plus ${money(cam)} CAM`:""}${arrearsPay?` plus ${money(arrearsPay)} arrears`:""}.`);
  }else{
   r.balance+=r.current;r.daysLate+=30;
   r.status=r.daysLate>=60?"Seriously Delinquent":r.daysLate>=30?"Past Due":"Late";
   r.ledger.push(`${stamp()}: Missed ${money(r.current)} rent; outstanding ${money(r.balance)}.`);
   G.phone.push({from:t.owner,text:`I need to talk about rent. I can't make the full ${money(r.current)} payment right now. Can we work something out?`,topic:"rent"});
  }
  if(r.daysLate>=60&&!r.notices.includes("60-day escalation")){
   r.notices.push("60-day escalation");
   G.phone.push({from:"Accounting",text:`${t.name} is now ${r.daysLate} days behind with ${money(r.balance)} outstanding. Review payment plan, formal default, or legal options.`,topic:"rent"});
  }
 });
}

function v171Init(){
 v17Init();G.v171=G.v171||{};let V=G.v171;
 if(!V.cleanedWorkOrders){
   // V16 imported thousands of repetitive legacy records from old saves. Keep real/user-created records,
   // collapse imported duplicates, and remove empty/noise records.
   let seen=new Set(),clean=[];
   (G.v16.workOrders||[]).forEach(w=>{
     if(!w||!w.title)return;
     let imported=(w.history||[]).some(h=>/Work order created/.test(h)) && /^WO-/.test(w.id||"");
     let key=(String(w.title).toLowerCase().replace(/\W+/g," ").trim()+"|"+String(w.trade||"").toLowerCase()+"|"+String(w.asset||"").toLowerCase());
     let noise=/legacy work order|open work order/i.test(w.title)&&!w.detail&&!w.asset;
     if(noise)return;
     if(imported&&seen.has(key))return;
     seen.add(key);clean.push(w);
   });
   // Safety cap for pathological migrated saves; retain newest meaningful records.
   G.v16.workOrders=clean.slice(0,250);
   V.cleanedWorkOrders=true;
   V.oldWOCount=(G.v16.workOrders||[]).length;
 }
 // Remove stale duplicate PM requests that were generated from vague mail notices.
 let seenPM=new Set();
 G.v161.requests=(G.v161.requests||[]).filter(r=>{
   if(!r)return false;
   let k=`${r.status}|${r.type}|${r.title}`;
   if(seenPM.has(k))return false;seenPM.add(k);return true;
 });
}
function meaningfulOpenWOsV171(){
 v171Init();let detailed=(G.v16.workOrders||[]).filter(w=>w.status!=="Closed");
 // legacy WOs only count if not already represented by a detailed WO
 let legacy=allOpenWorkOrders().filter(l=>!detailed.some(w=>{
   let a=(w.title||"").toLowerCase(),b=(l.title||l.summary||"").toLowerCase();
   return a&&b&&(a.includes(b)||b.includes(a));
 }));
 return {detailed,legacy,total:detailed.length+legacy.length}
}

// V20: non-destructive issue identity. Older overlapping records are grouped in the view;
// no historical work order is deleted or silently marked completed.
function v20Normalize(v){return String(v||"").toLowerCase().replace(/\b(work order|repair|reported|issue|the|at|in|for|suite)\b/g," ").replace(/[^a-z0-9]+/g," ").trim()}
function v20IssueKey(w){
 let title=v20Normalize(w.title||w.summary||w.issue);
 let asset=v20Normalize(w.asset||w.area||"");
 let tenant=P().stores.find(t=>t&&title.includes(v20Normalize(t.name)));
 let location=tenant?v20Normalize(tenant.name):asset;
 return (location||"property")+"|"+title;
}
function v20SameIssue(a,b){
 if(a.workOrderId&&a.workOrderId===b.id||b.workOrderId&&b.workOrderId===a.id)return true;
 let ka=v20IssueKey(a),kb=v20IssueKey(b);
 if(ka===kb)return true;
 let ta=v20Normalize(a.title||a.summary||a.issue),tb=v20Normalize(b.title||b.summary||b.issue);
 let aa=v20Normalize(a.asset||a.area),ab=v20Normalize(b.asset||b.area);
 return ta.length>10&&tb.length>10&&(ta.includes(tb)||tb.includes(ta))&&(!aa||!ab||aa===ab);
}
function v20FindOpenDuplicate(candidate){
 v16Init();return G.v16.workOrders.find(w=>w.status!=="Closed"&&v20SameIssue(w,candidate));
}
function v20UniqueOrders(){
 v16Init();let groups=[];
 for(let w of G.v16.workOrders){
  if(!w||!w.title)continue;
  let group=groups.find(g=>v20SameIssue(g.main,w));
  if(group){
   group.items.push(w);
   // Prefer an in-progress or scheduled order as the representative.
   let rank=x=>({"In Progress":8,"Scheduled":7,"Approved":6,"Awaiting Invoice":5,"Quotes Received":4,"Ready for Quotes":3,"Needs Review":2,"Closed":0}[x.status]??1);
   if(rank(w)>rank(group.main))group.main=w;
  }else groups.push({main:w,items:[w]});
 }
 return groups;
}

 v181Init();let w=G.v16.workOrders.find(x=>x.id===id);if(!w)return alert("Work order not found.");
 w.history=w.history||[];if(w.status==="Closed")return openDetailedWOV181(id);
 if(!w.diagnosis){w.diagnosis="Maintenance reviewed the reported issue.";w.scope=w.detail||w.title}
 let inHouse=(Number(w.estimate)||0)<=1800||["General","Cleaning / Waste","Landscaping"].includes(w.trade);
 if(inHouse){w.vendor="In-house maintenance";w.approvedQuote={vendor:w.vendor,amount:Math.max(75,Math.round((Number(w.estimate)||350)*.35)),days:1,quality:75,scope:w.scope}}
 else{
   if(!w.quotes?.length){let b=Math.max(250,Number(w.estimate)||1200);w.quotes=[{vendor:`${w.trade||"General"} Services`,amount:Math.round(b*.92),days:2,quality:78,scope:w.scope},{vendor:"Lakeview Property Contractors",amount:Math.round(b*1.06),days:1,quality:86,scope:w.scope}]}
   let q=w.quotes.slice().sort((a,b)=>(a.amount+(a.days||1)*75)-(b.amount+(b.days||1)*75))[0];w.approvedQuote=q;w.vendor=q.vendor;
 }
 w.status="In Progress";w.scheduled=stamp();w.progress=Math.max(Number(w.progress)||0,10);w.history.push(`${stamp()}: ${w.vendor} assigned and work started.`);
 autoSave();render();

function weatherOperationsTick(){let season=[12,1,2].includes(G.month)?"winter":[6,7,8].includes(G.month)?"summer":"mild";G.weatherOps.rain=Math.random()<.25?Math.round(Math.random()*3):0;G.weatherOps.heat=season==="summer"?80+Math.round(Math.random()*20):60;G.weatherOps.freeze=season==="winter"&&Math.random()<.3;G.weatherOps.storm=Math.random()<.05;if(G.weatherOps.rain>2&&P().roof<55&&Math.random()<.25)addWorkOrder({title:"Rain-related roof leak",detail:"Heavy rain exposed a roof leak.",cost:2400,cat:"roof",asset:"roof",created:stamp()});if(G.weatherOps.heat>95&&(G.rtus||[]).some(x=>x.condition<45)&&Math.random()<.2)addWorkOrder({title:"RTU failure during heat wave",detail:"High cooling load caused an aging rooftop unit to fail.",cost:4800,cat:"hvac",created:stamp()})}

function currentEra(){if(G.year<1992)return"1980s neighborhood retail";if(G.year<2000)return"1990s big-box expansion";if(G.year<2008)return"Early internet retail";if(G.year<2016)return"Recession & e-commerce shift";if(G.year<2021)return"Experiential/service retail";return"Modern mixed-use & convenience retail"}
function morningBriefHTML(){let open=allOpenWorkOrders().length,late=Object.entries(G.rentAccounts||{}).filter(([k,v])=>v.status!=="Current"&&v.balance>0),inv=(G.invoiceQueue||[]).filter(x=>x.status==="Needs Approval"),renew=P().stores.filter(Boolean).filter(t=>(t.leaseEnd-G.year)<=1),next=(G.calendar||[]).filter(x=>!x.done).slice(0,3);return`<div class=morningBrief><b>${G.weekday||"Monday"}, ${mn()} ${G.year} · ${String(G.managementMode?.hour||8).padStart(2,"0")}:${String(G.managementMode?.minute||4).padStart(2,"0")}</b><div class=briefRow>🏬 Occupancy <b>${Math.round(v246OccupiedStores()/P().stores.length*100)}%</b> · Cash <b>${money(G.cash)}</b></div><div class=briefRow>🔧 ${open} open maintenance job(s) · 💵 ${late.length} rent issue(s)</div><div class=briefRow>🧾 ${inv.length} invoice(s) need approval · 📄 ${renew.length} lease(s) in renewal window</div><div class=briefRow>🅿️ Parking demand ${G.parkingSim?.lastDemand||0}/${G.parkingSim?.capacity||82} spaces</div>${next.map(x=>`<div class=briefRow>📅 ${x.when||stamp()} — ${x.text}</div>`).join("")}<button onclick=startManagementDay()>Start / Continue Workday</button> <button onclick=openMorningBrief()>Open Full Brief</button></div>`}
function openMorningBrief(){modal.style.display="flex";let pm=G.managers.property?.name||"No property manager hired";modalbox.innerHTML=`<h2>☀️ Morning Brief — ${mn()} ${G.year}</h2>${morningBriefHTML()}<h3>Property Manager</h3><p>${pm}</p><h3>Today's priorities</h3>${pmTaskQueueHTML()}<button onclick=closeModal()>Start Day</button>`}

function pmTaskQueueHTML(){let pm=G.managers.property;if(!pm)return`<small>Hire a Property Manager to delegate routine operations.</small>`;if(!G.pmDailyTasks.length)generatePMTasks();return G.pmDailyTasks.slice(0,8).map((x,i)=>`<div class="log ${x.done?'taskDone':''}"><b>${x.priority}</b> ${x.text}<br><small>${x.status}</small>${!x.done?`<button onclick="pmDoTask(${i})">${x.ownerDecision?'Review':'Delegate'}</button>`:""}</div>`).join("")}
function generatePMTasks(){G.pmDailyTasks=[];allOpenWorkOrders().slice(0,4).forEach(w=>G.pmDailyTasks.push({priority:w.priority||"Routine",text:`Follow up: ${w.title}`,status:w.status||"Open",done:false,ownerDecision:(w.cost||0)>(G.approvalLimits.property||2500)}));let late=Object.entries(G.rentAccounts||{}).find(([k,v])=>v.balance>0);if(late)G.pmDailyTasks.push({priority:"Tenant",text:`Follow up on ${late[0]} rent account`,status:"Needs call",done:false});if((G.invoiceQueue||[]).some(x=>x.status==="Needs Approval"))G.pmDailyTasks.push({priority:"Finance",text:"Review vendor invoices",status:"Waiting",done:false,ownerDecision:true});if(!G.pmDailyTasks.length)G.pmDailyTasks.push({priority:"Routine",text:"Walk property and check tenant concerns",status:"Scheduled",done:false})}

function parkingSimulationHTML(){updateParkingDemand();let p=G.parkingSim,pct=Math.min(100,Math.round(p.lastDemand/p.capacity*100));return`<b>${p.lastDemand} / ${p.capacity} spaces estimated in use</b><div class=parkingGauge><span style="width:${pct}%"></span></div><small>Peak recorded ${p.peak} · ${pct>90?'OVER CAPACITY — tenant/customer complaints likely':pct>75?'Busy':'Adequate capacity'}</small>`}
function updateParkingDemand(){let hour=simHour||12,d=0;P().stores.filter(Boolean).forEach(t=>{let type=(t.type||"").toLowerCase(),base=type.includes("restaurant")||type.includes("pizza")?(hour>=17?18:8):type.includes("grocery")?14:type.includes("hair")?7:type.includes("laund")?8:type.includes("insurance")?5:6;d+=Math.round(base*(.65+Math.random()*.55))});if(G.parkingPolicy?.employeeRear)d=Math.max(0,d-6);G.parkingSim.capacity=P().parkingSpaces||82;G.parkingSim.lastDemand=d;G.parkingSim.peak=Math.max(G.parkingSim.peak||0,d)}
function vendorVisitHTML(){let visits=(G.vendorVisits||[]).filter(x=>x.status!=="Done");return visits.length?visits.map((x,i)=>`<div class=log>🚚 <b>${x.vendor}</b> — ${x.job}<br>${x.status} · ETA ${x.eta||"today"}<button onclick="advanceVendorVisit(${i})">Update</button></div>`).join(""):'<small>No vendor trucks currently scheduled/on site.</small>'}

function invoiceQueueHTML(){let q=(G.invoiceQueue||[]).filter(x=>x.status==="Needs Approval");return q.length?q.map((x,i)=>`<div class=log><b>${x.vendor}</b> — ${x.job}<br>Quote ${money(x.quoted)} · Invoice <b>${money(x.amount)}</b>${x.amount>x.quoted*1.05?' <span class=bad>OVER QUOTE</span>':''}<br><button onclick="invoiceAction(${G.invoiceQueue.indexOf(x)},'approve')">Approve</button> <button onclick="invoiceAction(${G.invoiceQueue.indexOf(x)},'question')">Question</button></div>`).join(""):'<small>No invoices waiting for approval.</small>'}

function ownerStatementHTML(){let r=G.monthlyReports.at(-1);if(!r)return`<small>Your first detailed owner statement will be produced at month end.</small>`;return`<div class=reportGrid><div class=reportBox>Rent billed<br><b>${money(r.rent)}</b></div><div class=reportBox>Operating expenses<br><b>${money(r.expenses)}</b></div><div class=reportBox>NOI<br><b>${money(r.noi)}</b></div><div class=reportBox>Occupancy<br><b>${r.occupancy}%</b></div></div><small>${r.date} · Maintenance ${money(r.maintenance)} · Utilities ${money(r.utilities)} · Cash ${money(r.cash)}</small><br><button onclick=openOwnerStatement()>Open Statement</button>`}

function createMonthlyOwnerStatement(){let rent=P().stores.filter(Boolean).reduce((a,t)=>a+(t.rent||0)+(t.cam||0),0),utilities=(G.utilities.electric||0)+(G.utilities.gas||0)+(G.utilities.water||0),payroll=G.staff.reduce((a,e)=>a+(e.pay||0),0)+(G.managers.property?.pay||0)+(G.managers.leasing?.pay||0),maintenance=(G.invoiceQueue||[]).filter(x=>x.status==="Paid"&&x.date===stamp()).reduce((a,x)=>a+x.amount,0),other=4500,expenses=utilities+payroll+maintenance+other;G.monthlyReports.push({date:stamp(),rent,utilities,payroll,maintenance,other,expenses,noi:rent-expenses,cash:G.cash,occupancy:Math.round(v246OccupiedStores()/P().stores.length*100)});if(G.monthlyReports.length>36)G.monthlyReports.shift()}
function capitalForecastHTML(){buildCapitalForecast();return G.capitalForecast.slice(0,8).map(x=>`<div class="log ${x.years<=2?'capitalRisk':''}"><b>${x.asset}</b> · ${x.years<=0?'Due now':`~${x.years} yr`}<br>${Math.round(x.condition)}% condition · reserve target ${money(x.cost)}</div>`).join("")}

function managementModeHTML(){let m=G.managementMode;if(!m.active)return`<p>Run an actual workday at Lakeview instead of simply advancing time.</p>${G.lastDaySummary?`<small>Last day: ${G.lastDaySummary}</small><br>`:""}<button onclick=startManagementDay()>Start Management Day</button> <button onclick=weeklyStaffMeeting()>Weekly Staff Meeting</button>`;return`<div class=mgmtDay><div class=mgmtClock>${fmtDayTime()}</div><b>${m.day} at Lakeview Plaza</b><div class=deskCount><div>☎️<br>${G.phone.length}<small> calls</small></div><div>📬<br>${G.paperwork.length}<small> papers</small></div><div>🔧<br>${P().issues.length}<small> issues</small></div></div>${m.events.filter(e=>!e.done).slice(0,5).map((e,i)=>`<div class=log><b>${e.time}</b> ${e.text}<br><button onclick="handleDayEvent(${m.events.indexOf(e)})">${e.action||"Handle"}</button></div>`).join("")}<button onclick=advanceManagementTime()>Advance 30 Minutes</button> <button onclick=endManagementDay()>Leave for the Day</button></div>`}
function fmtDayTime(){let m=G.managementMode,h=m.hour,min=String(m.minute).padStart(2,"0"),ap=h>=12?"PM":"AM",hh=h%12||12;return`${hh}:${min} ${ap}`}
function startManagementDay(){generatePMTasks();updateParkingDemand();let m=G.managementMode;m.active=true;m.hour=7;m.minute=52;m.day=rand(["Monday","Tuesday","Wednesday","Thursday","Friday"]);generateDayEvents();G.phone.push({from:"Office",text:`You arrived at Lakeview Plaza for ${m.day}'s workday.`});render()}
function generateDayEvents(){let m=G.managementMode,events=[{time:"8:20 AM",at:500,text:"Earl stops by for the morning maintenance check-in.",type:"earl",action:"Meet Earl"},{time:"9:15 AM",at:555,text:"Review overnight calls, mail and invoices.",type:"desk",action:"Go to Desk"},{time:"10:30 AM",at:630,text:P().stores.some(x=>!x)?"A prospective tenant is scheduled to tour a vacant suite.":"Walk the property with your manager.",type:"tour",action:"Handle Appointment"},{time:"11:40 AM",at:700,text:"A tenant wants a few minutes in your office.",type:"tenant",action:"Meet Tenant"},{time:"1:30 PM",at:810,text:"Review vendor estimates and open work orders.",type:"vendor",action:"Review"},{time:"3:45 PM",at:945,text:"Afternoon property walk.",type:"walk",action:"Walk Property"}];if(P().issues.length)events.push({time:"2:15 PM",at:855,text:`Vendor follow-up needed for ${P().issues[0].text}.`,type:"vendor",action:"Review Issue"});m.events=events;m.completed=[]}
function advanceManagementTime(){let m=G.managementMode;m.minute+=30;if(m.minute>=60){m.hour++;m.minute-=60}let now=m.hour*60+m.minute;m.events.filter(e=>!e.done&&e.at<=now).forEach(e=>{if(!e.notified){G.phone.push({from:"Office",text:`${e.time}: ${e.text}`});e.notified=true}});if(Math.random()<.12)randomWorkdayInterruption();if(m.hour>=17)endManagementDay();render()}
function handleDayEvent(i){let e=G.managementMode.events[i];if(!e||e.done)return;e.done=true;G.managementMode.completed.push(e.text);if(e.type==="earl"){if(Math.random()<.45){createMaintenanceFinding();goSeeFinding(G.maintenanceFindings.length-1)}else{modal.style.display="flex";modalbox.innerHTML=`<h2>🔧 Morning Check-In</h2><p>Earl: "Nothing major overnight. I'll work through the open maintenance list and let you know if I find anything."</p><button onclick=closeModal()>Thanks, Earl</button>`}}else if(e.type==="desk")openCallCenter();else if(e.type==="tenant"){let ts=P().stores.filter(Boolean),t=rand(ts);let i=P().stores.indexOf(t);ownerInteraction(i)}else if(e.type==="walk")walkProperty();else if(e.type==="tour"){if(P().stores.some(x=>!x))incomingInquiry();tab="leasing";render()}else if(e.type==="vendor"){tab="ops";render()}}
function randomWorkdayInterruption(){let events=[()=>customerComplaint(),()=>{let ts=P().stores.filter(Boolean);if(ts.length){let t=rand(ts);G.phone.push({from:t.owner,text:"Can you stop by when you get a minute? I have a property question.",tenant:t.name,topic:"general"})}},()=>{G.paperwork.push({type:"Invoice",from:rand(G.vendors).name,amount:800+~~(Math.random()*4200),text:"Service invoice awaiting approval",status:"Open"})},()=>{G.phone.push({from:"Delivery Driver",text:"I'm at the rear service area and need access to the building."})}];rand(events)()}
function endManagementDay(){let m=G.managementMode,done=m.completed.length,open=m.events.filter(e=>!e.done).length;G.lastDaySummary=`${m.day}: ${done} scheduled items handled, ${open} left for follow-up, ${P().issues.length} open property issues.`;m.active=false;G.paperwork.push({type:"Daily Summary",from:"Office",amount:0,text:G.lastDaySummary,status:"Filed"});render()}
function weeklyStaffMeeting(){let pm=G.managers.property,lm=G.managers.leasing,earl=G.staff.find(e=>e.role&&e.role.toLowerCase().includes("maintenance"));modal.style.display="flex";modalbox.innerHTML=`<h2>👥 Weekly Staff Meeting</h2><div class=staffMeeting><b>${pm?pm.name:"You"} — Property Operations</b><br>${P().issues.length?`${P().issues.length} open issue(s); priority is ${P().issues[0].text}.`:"No major open property issues."}</div><div class=staffMeeting><b>${lm?lm.name:"You"} — Leasing</b><br>${P().stores.filter(x=>!x).length} vacant suite(s), ${P().leads.length} active lead(s).</div><div class=staffMeeting><b>${earl?earl.name:"Maintenance"} — Maintenance</b><br>${G.maintenanceFindings.filter(x=>!x.resolved).length} unresolved field finding(s). Inventory: ${G.inventory.filters} filters, ${G.inventory.bulbs} bulbs.</div><button onclick="meetingPriority('maintenance')">Prioritize Maintenance</button><button onclick="meetingPriority('leasing')">Prioritize Leasing</button><button onclick="meetingPriority('appearance')">Prioritize Appearance</button><button onclick=closeModal()>End Meeting</button>`}
function meetingPriority(x){if(x==="maintenance"){G.staff.forEach(e=>{if(e.role.toLowerCase().includes("maintenance"))e.morale=Math.min(100,e.morale+2)});G.managerLog.push(`${stamp()}: Staff meeting priority set to maintenance.`)}if(x==="leasing"&&G.managers.leasing)G.managers.leasing.initiative=Math.min(100,G.managers.leasing.initiative+2);if(x==="appearance")G.appearance.cleanliness=Math.min(100,G.appearance.cleanliness+3);closeModal();render()}
function paperworkHTML(){if(!G.paperwork.length)seedPaperwork();return`<p>${G.paperwork.filter(x=>x.status==="Open").length} item(s) awaiting action.</p>${G.paperwork.slice(-8).reverse().map((p,i)=>`<div class=paper><b>${p.type}</b> — ${p.from}<br>${p.text}${p.amount?`<br><b>${money(p.amount)}</b>`:""}<br>${p.status==="Open"?`<button onclick="paperAction(${G.paperwork.indexOf(p)},'approve')">Approve / Pay</button> <button onclick="paperAction(${G.paperwork.indexOf(p)},'question')">Question It</button> <button onclick="paperAction(${G.paperwork.indexOf(p)},'file')">File / Acknowledge</button>`:`<small>${p.status}</small>`}</div>`).join("")}` }
function seedPaperwork(){G.paperwork.push({type:"Utility Bill",from:"Electric Company",amount:1850,text:"Monthly electric bill",status:"Open"},{type:"Insurance Letter",from:"Property Insurer",amount:0,text:"Annual property condition questionnaire",status:"Open"},{type:"Vendor Invoice",from:"Summit Mechanical",amount:1240,text:"HVAC service invoice",status:"Open"})}
function paperAction(i,a){let p=G.paperwork[i];if(!p||p.status!=="Open")return;if(a==="approve"){if(p.amount&&G.cash<p.amount)return alert("Not enough cash.");if(p.amount){G.cash-=p.amount;addLedger(`${p.type} — ${p.from}`,-p.amount);if(G.vendorRelations[p.from]!=null)G.vendorRelations[p.from]=Math.min(100,G.vendorRelations[p.from]+3)}p.status="Paid / Approved"}else if(a==="question"){p.status="Questioned";if(G.vendorRelations[p.from]!=null)G.vendorRelations[p.from]=Math.max(0,G.vendorRelations[p.from]-1);G.phone.push({from:p.from,text:"We received your question about the invoice and will review it."})}else p.status="Filed";render()}

function billsDashboardHTML(){let open=G.paperwork.filter(x=>x.status==="Open"&&x.amount),paid=G.paperwork.filter(x=>x.amount&&/Paid|Approved/.test(x.status)).slice(-8).reverse();let payroll=G.staff.reduce((n,e)=>n+(e.pay||0),0)+(G.managers.property?.pay||0)+(G.managers.leasing?.pay||0);let fixed=[["Mortgage / debt service",Math.round(G.debt*.0065)],["Staff & manager payroll",payroll],["Estimated utilities",Math.round((G.utilities?.electric||0)+(G.utilities?.gas||0)+(G.utilities?.water||0))]];return`<p><b>Known recurring monthly outflow</b></p>${fixed.map(x=>`<div class=budgetRow><b>${x[0]}</b><span></span><span>${money(x[1])}</span></div>`).join("")}<h4>Awaiting Payment / Approval</h4>${open.map(p=>`<div class=paper><b>${p.type}</b> — ${p.from}<br>${p.text}<br><b>${money(p.amount)}</b></div>`).join("")||"<small>No unpaid paperwork currently on your desk.</small>"}<h4>Recently Approved / Paid</h4>${paid.map(p=>`<div class=log>${p.from} — ${money(p.amount)} · ${p.status}</div>`).join("")||"<small>No recent paid-paperwork history.</small>"}` }
function budgetHTML(){return Object.keys(G.budget).map(k=>`<div class=budgetRow><b>${k}</b><span>Budget ${money(G.budget[k])}</span><span>Actual ${money(G.budgetActual[k]||0)}</span></div>`).join("")+`<button onclick=setBudget()>Set Annual Budget</button>`}

function inventoryHTML(){return`<p>HVAC filters <b>${G.inventory.filters}</b> · Bulbs <b>${G.inventory.bulbs}</b> · Salt <b>${G.inventory.salt}</b> · Paint <b>${G.inventory.paint}</b> · Plumbing parts <b>${G.inventory.plumbing}</b></p><button onclick=orderSupplies()>Order Supplies</button><h4>Keys & Access</h4><p>Master ${G.keys.master?"✓":"—"} · Roof ${G.keys.roof?"✓":"—"} · Vacant suites ${G.keys.vacant?"✓":"—"} · Contractor keys ${G.keys.contractor}</p><button onclick=contractorAccess()>Issue Contractor Access</button>`}
function orderSupplies(){let cost=1800;if(G.cash<cost)return alert("Need $1,800");G.cash-=cost;Object.assign(G.inventory,{filters:G.inventory.filters+12,bulbs:G.inventory.bulbs+24,salt:G.inventory.salt+15,paint:G.inventory.paint+6,plumbing:G.inventory.plumbing+8});addLedger("Maintenance supplies",-cost);G.paperwork.push({type:"Purchase Order",from:"Building Supply Co.",amount:cost,text:"Maintenance inventory replenishment",status:"Paid / Approved"});render()}
function contractorAccess(){if(G.keys.contractor<=0)return alert("No contractor access keys available.");G.keys.contractor--;G.phone.push({from:"Office",text:"Contractor access key issued. Remember to get it back after the job."});render()}
function seasonOpsHTML(){let season=[12,1,2].includes(G.month)?"Winter":[3,4,5].includes(G.month)?"Spring":[6,7,8].includes(G.month)?"Summer":"Fall",c=G.snowContract,valid=c&&c.year===G.year&&c.status==="Active";let advice=season==="Winter"?"Snow contractor, salt inventory and accessible spaces need attention.":season==="Spring"?"Mulch, flowers, cleanup and roof-drain inspection season.":season==="Summer"?"HVAC load, mowing and irrigation are priorities.":"Leaves, drainage, roof prep and winter planning are priorities.";return`<div class=seasonOps><b>${season}</b><p>${advice}</p><div class="snowContract ${c&&!valid?'snowExpired':''}">${valid?`❄️ <b>Snow Contract Active — ${c.vendor}</b><br>${c.plan} · ${money(c.annual)} annual${c.perPush?` + ${money(c.perPush)}/push`:""}<br>Salt ${c.saltIncluded?"included":money(c.saltRate)+"/application"} · response target ${c.response} hr<br><button onclick=openSnowContract()>Manage Contract</button>`:`<b>${c?"Snow contract expired":"No snow contractor under contract"}</b><br>${c?`Previous vendor: ${c.vendor} (${c.year})<br>`:""}<button onclick=requestSnowBids()>Request Snow Bids</button>`}</div>${season==="Winter"?`<p>Salt inventory ${G.inventory.salt} · OT ${G.snowPlan.overtime?"authorized":"not authorized"}</p><button onclick=prepareSnow()>Prepare for Snow</button>`:""}<button onclick=seasonalService()>Schedule Seasonal Service</button></div>`}

function requestSnowBids(){G.snowBids=G.snowVendors.map(v=>{let variance=.94+Math.random()*.13;let annual=Math.round(v.base*variance/100)*100;return{vendor:v.name,quality:v.quality,reliability:v.reliability,annual,perPush:Math.round(v.perPush*variance/25)*25,salt:Math.round(v.salt*variance/10)*10,response:v.response,plan:Math.random()<.5?"Seasonal + per-push":"Full Seasonal",saltIncluded:Math.random()<.35}});modal.style.display="flex";modalbox.innerHTML=`<h2>❄️ Snow & Ice Control Bids — ${G.year}</h2><p>Compare price with reliability, response time and service structure. The cheapest contractor may not be the best during a heavy winter.</p>${G.snowBids.map((b,i)=>`<div class=snowBid><b>${b.vendor}</b><div class=snowScore><div>Quality<br><b>${b.quality}</b></div><div>Reliability<br><b>${b.reliability}</b></div><div>Response<br><b>${b.response} hr</b></div></div><b>${b.plan}</b><br>Season price: ${money(b.annual)}${b.plan.includes("per-push")?`<br>Plowing: ${money(b.perPush)}/push`:""}<br>Salt: ${b.saltIncluded?"Included":money(b.salt)+"/application"}<br><button onclick="awardSnowContract(${i})">Award Contract</button></div>`).join("")}<button onclick=closeModal()>Decide Later</button>`}
function awardSnowContract(i){let b=G.snowBids[i];if(!b)return;let deposit=Math.round(b.annual*.25);if(G.cash<deposit)return alert(`Need ${money(deposit)} for the contract deposit.`);G.cash-=deposit;addLedger(`${b.vendor} snow contract deposit`,-deposit);G.snowContract={...b,year:G.year,status:"Active",paid:deposit,events:0,misses:0};G.snowPlan.contractor=true;G.snowHistory.push(`${stamp()}: Awarded ${G.year} snow contract to ${b.vendor} — ${b.plan}, ${money(b.annual)} season price.`);G.vendorRelations[b.vendor]=G.vendorRelations[b.vendor]??b.reliability;G.paperwork.push({type:"Snow Contract",from:b.vendor,amount:deposit,text:`25% deposit for ${G.year} snow & ice agreement`,status:"Paid / Approved"});closeModal();render()}
function openSnowContract(){let c=G.snowContract;if(!c)return requestSnowBids();modal.style.display="flex";modalbox.innerHTML=`<h2>❄️ Snow Contract — ${c.vendor}</h2><p><b>${c.plan}</b><br>Contract year ${c.year}<br>Season price ${money(c.annual)}<br>${c.perPush?`Plow charge ${money(c.perPush)}/push<br>`:""}Salt ${c.saltIncluded?"included":money(c.salt)+"/application"}<br>Response target ${c.response} hours<br>Storms serviced ${c.events||0} · Service misses ${c.misses||0}</p><button onclick=snowVendorConversation()>Call Vendor</button> <button onclick=requestSnowBids()>Get Competing Bids</button><button onclick=closeModal()>Close</button>`}
function snowVendorConversation(){let c=G.snowContract,line=c.misses?`"I know we missed the response target on ${c.misses} event(s). We need to improve that."`:`"We're set for the season. We'll monitor storms and prioritize entrances, fire lanes and accessible parking."`;modalbox.innerHTML=`<h2>☎️ ${c.vendor}</h2><p>${line}</p><button onclick=openSnowContract()>Back</button>`}
function annualSnowRenewal(){let c=G.snowContract;if(c&&c.year<G.year&&c.status==="Active"){c.status="Expired";G.snowPlan.contractor=false;G.phone.push({from:c.vendor,text:`Our snow agreement expired after the ${c.year} season. Would you like a renewal proposal for ${G.year}?`,topic:"snow"});G.paperwork.push({type:"Contract Renewal",from:c.vendor,amount:0,text:`Snow & ice agreement renewal needed for ${G.year}`,status:"Open"});G.snowHistory.push(`${stamp()}: ${c.vendor} snow agreement expired; renewal required.`)}}
function serviceSnowEvent(){let c=G.snowContract,depth=G.snowDepth||0;if(depth<=0)return;if(!c||c.status!=="Active"||c.year!==G.year){G.appearance.snowClearing=Math.max(0,G.appearance.snowClearing-18);G.phone.push({from:"Property Manager",text:"We have accumulating snow and no active snow contract. We need to call someone for emergency service."});return}c.events=(c.events||0)+1;let v=G.snowVendors.find(x=>x.name===c.vendor),success=Math.random()*100<(v?.reliability||c.reliability);if(success){G.appearance.snowClearing=Math.min(100,G.appearance.snowClearing+22);let charge=c.plan.includes("per-push")?c.perPush:0;if(!c.saltIncluded&&depth>2)charge+=c.salt;if(charge){G.cash-=charge;G.budgetActual.snow+=charge;addLedger(`${c.vendor} snow event service`,-charge);G.paperwork.push({type:"Snow Service",from:c.vendor,amount:charge,text:`Plowing/salt service for snow event`,status:"Paid / Approved"})}G.snowHistory.push(`${stamp()}: ${c.vendor} serviced a ${depth.toFixed?depth.toFixed(1):depth}" snow event.`)}else{c.misses=(c.misses||0)+1;G.appearance.snowClearing=Math.max(0,G.appearance.snowClearing-12);G.vendorRelations[c.vendor]=Math.max(0,(G.vendorRelations[c.vendor]||60)-5);G.phone.push({from:G.managers.property?.name||"Property Manager",text:`${c.vendor} missed the response target during this snow event. The lot is not ready.`});G.snowHistory.push(`${stamp()}: ${c.vendor} missed its response target during a snow event.`)}}
function prepareSnow(){let c=G.snowContract,active=c&&c.status==="Active"&&c.year===G.year;G.snowPlan={ready:active,salt:G.inventory.salt>5||!!c?.saltIncluded,contractor:active,overtime:true};if(active)G.phone.push({from:c.vendor,text:"We're confirmed for the next event. We'll prioritize entrances, fire lanes and accessible parking."});else G.phone.push({from:"Property Manager",text:"We don't have an active snow contract. I recommend getting bids before the next storm."});render()}
function seasonalService(){let cost=1800;if(G.cash<cost)return alert("Need $1,800");G.cash-=cost;G.appearance.landscape=Math.min(100,G.appearance.landscape+10);G.appearance.cleanliness=Math.min(100,G.appearance.cleanliness+6);addLedger("Seasonal grounds service",-cost);render()}
function leaseCalendarHTML(){let ts=P().stores.filter(Boolean).sort((a,b)=>a.leaseEnd-b.leaseEnd);return ts.slice(0,6).map(t=>{let yrs=t.leaseEnd-G.year;return`<div class=log><b>${t.name}</b> — lease ends ${t.leaseEnd}${yrs<=1?" <span class=bad>RENEWAL WINDOW</span>":""}</div>`}).join("")}
function promiseHTML(){return`<h4>Promises to Tenants</h4>${G.promises.filter(x=>!x.done).map((p,i)=>`<div class=promise><b>${p.tenant}</b>: ${p.text}<br>Due ${p.due}<button onclick="fulfillPromise(${G.promises.indexOf(p)})">Mark Kept</button></div>`).join("")||"<small>No open promises.</small>"}<button onclick=addPromise()>Make Promise</button>`}
function addPromise(){let ts=P().stores.filter(Boolean),name=prompt("Tenant/business name:",ts[0]?.name||"");let t=ts.find(x=>x.name.toLowerCase()===String(name).toLowerCase());if(!t)return alert("Tenant not found.");let text=prompt("What did you promise?","Repair the sidewalk this month");if(!text)return;G.promises.push({tenant:t.name,text,due:`${G.month}/${G.year}`,done:false});rememberOwner(t,`You promised: ${text}`);render()}

function vendorRelationsHTML(){let all=[...G.vendors.slice(0,10),...G.snowVendors];return all.map(v=>`<div class=vendorRel><span>${v.name}${G.snowVendors.includes(v)?" ❄️":""}</span><b>${G.vendorRelations[v.name]||v.reliability||60}%</b></div>`).join("")}
function communityHTML(){return`<p>Owner reputation: <b>${G.ownerReputation.toFixed(0)}%</b></p><button onclick=communityEvent()>Community / Town Meeting</button>${G.communityLog.slice(-4).reverse().map(x=>`<div class=log>${x}</div>`).join("")}`}

function renameCompany(){let n=prompt("Ownership company name:",G.company.name);if(n)G.company.name=n;render()}
function growCompany(){let roles=[["controller","Controller"],["regional","Regional Property Manager"],["maintenanceDirector","Maintenance Director"],["leasingDirector","Leasing Director"]],r=roles.find(x=>!G.company[x[0]]);if(!r)return alert("Corporate leadership team is already staffed.");if(G.cash<10000)return alert("Need $10,000 recruiting/startup cost.");G.cash-=10000;G.company[r[0]]=rand(["Alex Morgan","Jamie Turner","Robin Ellis","Casey Wallace"]);G.company.reputation=Math.min(100,G.company.reputation+3);G.phone.push({from:G.company[r[0]],text:`I've joined ${G.company.name} as ${r[1]}.`});render()}

function planCenterAddition(count,cost,type="wing"){let e=P().expansion;if(P().stores.length+count>e.maxSuites)return alert("Not enough remaining land for that addition.");let parking=type==="anchor"?36:count*9,design=Math.round(cost*.06),permit=Math.round(cost*.025);modalbox.innerHTML=`<h2>📐 Addition Feasibility</h2><p><b>${type==="anchor"?"Anchor Addition":count+"-Suite Wing"}</b></p><p>Construction: ${money(cost)}<br>Architecture/engineering: ${money(design)}<br>Permits/site approvals: ${money(permit)}<br>Estimated parking demand: +${parking} spaces<br><b>Total project: ${money(cost+design+permit)}</b></p><p>This project will proceed through design/permits, site work, construction and opening. Existing tenants remain open, but construction can temporarily hurt appearance and parking.</p><button onclick="startCenterAddition(${count},${cost+design+permit},'${type}',${parking})">Approve Project</button> <button onclick=openCenterExpansion()>Back</button>`}

function workOrderKey(w){let n=normalizeWorkOrder(w,0),tenant=w?.tenantName||w?.tenant||"",asset=w?.asset||"",suite=w?.suite??"";return `${n.cat}|${asset}|${tenant}|${suite}|${n.title}`.toLowerCase().replace(/\s+/g," ").trim()}
function similarWorkOrder(a,b){let A=normalizeWorkOrder(a,0),B=normalizeWorkOrder(b,0);let ac=A.cat.toLowerCase(),bc=B.cat.toLowerCase();if(ac!==bc)return false;let at=(a.tenantName||a.tenant||""),bt=(b.tenantName||b.tenant||"");if(at&&bt&&String(at)!==String(bt))return false;let aa=a.asset||"",ba=b.asset||"";if(aa&&ba&&aa!==ba)return false;let as=(A.title+" "+A.detail).toLowerCase(),bs=(B.title+" "+B.detail).toLowerCase();let words=as.split(/\W+/).filter(x=>x.length>4),hits=words.filter(x=>bs.includes(x)).length;return hits>=Math.min(2,words.length)||A.title===B.title}
function findExistingWorkOrder(candidate){return (G.workJobs||[]).findIndex(w=>(w.status||"Open")!=="Completed"&&(workOrderKey(w)===workOrderKey(candidate)||similarWorkOrder(w,candidate)))}
function workOrderDuration(w){let cat=(w.cat||w.category||"general").toLowerCase(),cost=Number(w.cost||0);let base={electrical:2,plumbing:2,hvac:3,roof:5,paving:4,signage:3,cleaning:1,general:2}[cat]||3;if(cost>5000)base+=2;if(cost>15000)base+=3;return base}
function woProgress(w){let total=w.durationWeeks||workOrderDuration(w),left=w.weeksRemaining??total,status=w.status||"Open";if(status==="Completed")return 100;if(!["Assigned","Scheduled","In Progress"].includes(status))return 0;return Math.max(5,Math.min(95,Math.round((total-left)/total*100)))}
function woStatusLabel(w){if(w.status==="Completed")return"Completed";if(w.status==="In Progress")return`In Progress · ${Math.max(1,w.weeksRemaining||1)} wk`;if(w.status==="Assigned"||w.status==="Scheduled")return`Scheduled · ${Math.max(1,w.weeksRemaining||w.durationWeeks||1)} wk`;return"Needs Assignment"}
function addWorkOrder(candidate){candidate={...candidate,status:candidate.status||"Open",created:candidate.created||stamp()};let existing=findExistingWorkOrder(candidate);if(existing>=0){let w=G.workJobs[existing];w.repeatReports=(w.repeatReports||0)+1;w.lastReported=stamp();w.detail=w.detail||candidate.detail;G.maintenanceHistory.push(`${stamp()}: Duplicate report linked to existing work order — ${normalizeWorkOrder(w,existing).title}.`);return{index:existing,duplicate:true}}candidate.durationWeeks=candidate.durationWeeks||workOrderDuration(candidate);candidate.weeksRemaining=candidate.weeksRemaining??candidate.durationWeeks;candidate.repeatReports=0;G.workJobs.push(candidate);return{index:G.workJobs.length-1,duplicate:false}}
function progressWorkOrders(){(G.workJobs||[]).forEach((w,i)=>{if(!["Assigned","Scheduled","In Progress"].includes(w.status))return;w.durationWeeks=w.durationWeeks||workOrderDuration(w);w.weeksRemaining=w.weeksRemaining??w.durationWeeks;if(w.status==="Assigned"||w.status==="Scheduled")w.status="In Progress";w.weeksRemaining=Math.max(0,w.weeksRemaining-4);if(w.weeksRemaining<=0){w.status="Completed";w.completed=stamp();G.maintenanceHistory.push(`${stamp()}: ${normalizeWorkOrder(w,i).title} completed by ${w.assigned||"maintenance team"}.`);let issue=(P().issues||[]).find(x=>similarWorkOrder(x,w));if(issue)issue.status="Completed"}})}
function allOpenWorkOrders(){let out=[];(G.workJobs||[]).forEach((w,i)=>{if((w.status||"Open")!=="Completed")out.push({...normalizeWorkOrder(w,i),...w,_source:"jobs",_index:i})});(P().issues||[]).forEach((w,i)=>{if((w.status||"Open")==="Completed")return;let n={...normalizeWorkOrder(w,i),...w,_source:"issues",_index:i};if(!out.some(x=>workOrderKey(x)===workOrderKey(n)||similarWorkOrder(x,n)))out.push(n)});return out}

function openWorkOrder(i,source="jobs"){let raw=getWorkOrder(source,i);if(!raw)return alert("That work order is no longer open.");let w=normalizeWorkOrder(raw,i);setWorkOrder(source,i,{...raw,...w});modal.style.display="flex";modalbox.innerHTML=`<h2>🔧 Work Order</h2><p><b>${w.title}</b></p><p>${w.detail}</p><p><b>Category:</b> ${w.cat}<br><b>Estimate:</b> ${money(w.cost)}<br><b>Status:</b> ${woStatusLabel({...raw,...w})}${w.assigned?`<br><b>Assigned:</b> ${w.assigned}`:""}${raw.repeatReports?`<br><b>Duplicate reports linked:</b> ${raw.repeatReports}`:""}</p><div class=woProgress><span style="width:${woProgress({...raw,...w})}%"></span></div><button onclick="assignWorkOrderVendor(${i},'${source}')">Assign Vendor</button> <button onclick="assignWorkOrderStaff(${i},'${source}')">Assign Maintenance Staff</button> <button onclick="completeWorkOrder(${i},'${source}')">Mark Complete</button> <button onclick=closeModal()>Close</button>`}
function assignWorkOrderVendor(i,source="jobs"){let raw=getWorkOrder(source,i);if(!raw)return;let w=normalizeWorkOrder(raw,i),v=(G.vendors||[]).find(x=>(x.cat||x.category)===w.cat)||(G.vendors||[])[0];if(!v)return alert("No vendor is available.");raw={...raw,title:w.title,summary:w.title,detail:w.detail,cat:w.cat,category:w.cat,cost:w.cost,assigned:v.name,status:"Assigned",durationWeeks:raw.durationWeeks||workOrderDuration(w),weeksRemaining:raw.weeksRemaining??workOrderDuration(w)};setWorkOrder(source,i,raw);G.vendorRelations[v.name]=Math.min(100,(G.vendorRelations[v.name]||v.reliability||60)+1);G.maintenanceHistory.push(`${stamp()}: ${w.title} assigned to ${v.name}.`);if(!G.vendorVisits.some(x=>x.job===w.title&&x.status!=="Done"))G.vendorVisits.push({vendor:v.name,job:w.title,status:"Scheduled",eta:"this week",quote:w.cost});openWorkOrder(i,source)}

function normalizeIssueText(x){if(!x)return{title:"Maintenance issue",summary:"A maintenance issue needs review.",category:"general"};let category=x.cat||x.category||x.type||x.asset||"general",title=x.title||x.name||x.issue||x.area||`${category.charAt(0).toUpperCase()+category.slice(1)} issue`,summary=x.summary||x.detail||x.text||x.description||x.problem||`${title} requires inspection and follow-up.`;return{title,summary,category}}
function syncMaintenanceBoard(){G.maintenanceBoard=G.maintenanceBoard||[];let issues=(P().issues||G.issues||[]);issues.forEach((x,ix)=>{let n=normalizeIssueText(x),key=`issue:${ix}:${n.title}`;if(!G.maintenanceBoard.some(t=>t.key===key&&t.status!=="Completed"))G.maintenanceBoard.push({key,source:"issue",sourceIndex:ix,title:n.title,summary:n.summary,category:n.category,priority:/electrical|plumbing/i.test(n.category)?"Urgent":"Normal",estimate:x.cost||x.estimate||0,status:"Needs Review",assigned:null,created:stamp()})});(G.maintenanceFindings||[]).filter(f=>!f.resolved).forEach((f,ix)=>{let n=normalizeIssueText(f),key=`finding:${ix}:${n.title}`;if(!G.maintenanceBoard.some(t=>t.key===key&&t.status!=="Completed"))G.maintenanceBoard.push({key,source:"finding",sourceIndex:ix,title:n.title,summary:n.summary,category:n.category,priority:/electrical/i.test(n.category)?"Urgent":"Normal",estimate:f.cost||0,status:"Needs Inspection",assigned:null,created:f.date||stamp()})})}
function renderMaintenance(){syncMaintenanceBoard();let pm=G.managers.property,open=G.maintenanceBoard.filter(w=>w.status!=="Completed"),needs=open.filter(w=>["Needs Review","Needs Inspection","Waiting Approval"].includes(w.status)),scheduled=open.filter(w=>["Assigned","Scheduled"].includes(w.status)),working=open.filter(w=>w.status==="In Progress"),done=G.maintenanceBoard.filter(w=>w.status==="Completed").slice(-10);app.innerHTML=`<div class=card>${propertyManagerHTML()}</div><div class=card><h2>🔧 Maintenance Center</h2><p><b>${open.length}</b> open items · <b>${working.length}</b> in progress · <b>${done.length}</b> recently completed</p><button onclick=maintenanceWalk()>Property Walk</button> <button onclick=preventiveMaintenance()>Preventive Maintenance</button> <button onclick=orderSupplies()>Order Supplies</button><div class=maintBoard>${maintColumn("Needs Attention",needs)}${maintColumn("Assigned / Scheduled",scheduled)}${maintColumn("In Progress",working)}${maintColumn("Recently Completed",done,true)}</div></div><div class=card><h3>🧰 Staff & Vendors</h3>${maintenanceResourcesHTML()}</div><div class=card><h3>📅 Preventive Maintenance / Asset Condition</h3>${maintenanceAssetsHTML()}</div><div class=card><h3>📜 Maintenance History</h3>${G.maintenanceHistory.slice(-12).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"No completed maintenance history yet."}</div>`}
function maintColumn(name,arr,done=false){return`<div class=maintCol><h3>${name}</h3>${arr.map(w=>maintTicket(w,done)).join("")||"<small>Nothing here.</small>"}</div>`}
function maintTicket(w,done=false){let i=G.maintenanceBoard.indexOf(w);return`<div class="maintTicket ${done?'done':''} ${w.priority==="Urgent"?'urgent':''} ${w.assigned&&G.managers.property&&w.assigned===G.managers.property.name?'pmHandled':''}"><b>${w.title}</b><br><span class=maintSmall>${w.category} · ${w.priority} · ${w.created}</span><br>${w.cost?`Estimate ${money(w.cost)}<br>`:""}${w.assigned?`Assigned: <b>${w.assigned}</b><br>`:""}${w.status}<br>${!done?`<button onclick="openMaintenanceTicket(${i})">Open / Manage</button>`:""}</div>`}
function openMaintenanceTicket(i){let w=G.maintenanceBoard[i],pm=G.managers.property,techs=G.staff.filter(e=>e.role&&e.role.toLowerCase().includes("maintenance"));modal.style.display="flex";modalbox.innerHTML=`<h2>🔧 ${w.title}</h2><p><b>Status:</b> ${w.status}<br><b>Priority:</b> ${w.priority}<br><b>Category:</b> ${w.category}<br><b>Estimate:</b> ${money(w.cost||0)}<br><b>Assigned:</b> ${w.assigned||"Nobody yet"}</p>${w.finding!==undefined?`<button onclick="goSeeFinding(${w.finding})">Go See It</button>`:""}${pm?`<button onclick="discussStorefrontSign(${i})">Give to ${pm.name}</button>`:""}${techs.map((e,j)=>`<button onclick="discussStorefrontSign(${i})">Assign ${e.name}</button>`).join("")}<button onclick="discussStorefrontSign(${i})">Send to Vendor</button><button onclick="maintenanceApproval(${i})">Approve / Start Work</button><button onclick="completeMaintenance(${i})">Mark Complete</button><button onclick=closeModal()>Close</button>`}
function assignMaintenance(i,to){let w=G.maintenanceBoard[i];if(to==="pm"){let pm=G.managers.property;w.assigned=pm.name;w.status=w.cost<=G.approvalLimits.property?"Assigned":"Waiting Approval";G.pmAssignments.push(w.key);G.managerLog.push(`${stamp()}: ${pm.name} took ownership of maintenance item: ${w.title}.`)}else if(to==="vendor"){let matches=G.vendors.filter(v=>v.category===w.category),v=matches[0]||G.vendors[0];w.assigned=v.name;w.status="Scheduled";G.vendorRelations[v.name]=Math.min(100,(G.vendorRelations[v.name]||60)+1)}else{let si=+to.split(":")[1],e=G.staff[si];w.assigned=e.name;w.status="Assigned"}openMaintenanceTicket(i);render()}
function maintenanceApproval(i){let w=G.maintenanceBoard[i];if(w.cost&&G.cash<w.cost)return alert(`Need ${money(w.cost)}`);if(w.cost){G.cash-=w.cost;G.budgetActual.repairs+=w.cost;addLedger(`Maintenance: ${w.title}`,-w.cost)}w.status="In Progress";if(!w.assigned)w.assigned=G.managers.property?.name||G.staff.find(e=>e.role?.toLowerCase().includes("maintenance"))?.name||"Owner";G.maintenanceHistory.push(`${stamp()}: Work started — ${w.title} (${w.assigned}).`);openMaintenanceTicket(i);render()}
function completeMaintenance(i){let w=G.maintenanceBoard[i];w.status="Completed";w.completed=stamp();G.maintenanceHistory.push(`${stamp()}: Completed — ${w.title} by ${w.assigned||"management"}.`);let pi=P().issues.findIndex(x=>w.title.includes(x.text)||x.text.includes(w.title));if(pi>=0)P().issues.splice(pi,1);if(w.finding!==undefined&&G.maintenanceFindings[w.finding])G.maintenanceFindings[w.finding].resolved=true;P().condition=Math.min(100,P().condition+1);closeModal();render()}
function maintenanceResourcesHTML(){let pm=G.managers.property,techs=G.staff.filter(e=>e.role&&e.role.toLowerCase().includes("maintenance"));return`${pm?`<div class=log><b>${pm.name}</b> — Property Manager<br>Can approve routine repairs up to ${money(G.approvalLimits.property)}.</div>`:""}${techs.map(e=>`<div class=log><b>${e.name}</b> — ${e.role}<br>Skill ${Math.round(e.skill||e.quality||70)} · Reliability ${Math.round(e.reliability||70)} · ${e.status||"Working"}</div>`).join("")}<p>Vendor relationships:</p>${vendorRelationsHTML()}`}
function maintenanceAssetsHTML(){let assets=Object.entries(G.assets||{});return assets.map(([k,a])=>`<div class=log><b>${k.toUpperCase()}</b> — condition ${Math.round(a.condition||0)}% · age ${a.age||0} yrs${(a.condition||0)<45?' <span class=bad>PLAN REPAIR/REPLACEMENT</span>':""}</div>`).join("")+`<p>Supplies: ${G.inventory.filters} filters · ${G.inventory.bulbs} bulbs · ${G.inventory.salt} salt · ${G.inventory.paint} paint · ${G.inventory.plumbing} plumbing parts</p>`}
function maintenanceWalk(){walkProperty()}
function preventiveMaintenanceMenuLegacy(){let jobs=[["HVAC filter / RTU inspection","hvac",450],["Roof drain & membrane inspection","roof",600],["Parking lot / lighting inspection","paving",350],["Electrical panel inspection","electrical",500],["Plumbing / backflow inspection","plumbing",450]];modal.style.display="flex";modalbox.innerHTML=`<h2>📅 Preventive Maintenance</h2>${jobs.map((j,n)=>`<button onclick="schedulePM(${n})">${j[0]} — ${money(j[2])}</button>`).join("")}<button onclick=closeModal()>Close</button>`;G._pmJobs=jobs}
function schedulePM(n){let j=G._pmJobs[n];G.maintenanceBoard.push({key:`pm:${Date.now()}:${n}`,title:j[0],category:j[1],cost:j[2],status:"Scheduled",priority:"Preventive",source:"PM Program",assigned:G.managers.property?.name||null,created:stamp(),property:P().name||"Lakeview Plaza"});G.maintenanceHistory.push(`${stamp()}: Scheduled preventive maintenance — ${j[0]}.`);closeModal();tab="maintenance";render()}
function propertyManagerMaintenanceTick(){syncMaintenanceBoard();let pm=G.managers.property;if(!pm)return;G.maintenanceBoard.filter(w=>w.status!=="Completed").forEach(w=>{if(!w.assigned&&Math.random()<pm.initiative/120){w.assigned=pm.name;if(w.cost<=G.approvalLimits.property&&G.cash>=w.cost){w.status="In Progress";G.cash-=w.cost;G.budgetActual.repairs+=w.cost;addLedger(`${pm.name} approved maintenance: ${w.title}`,-w.cost);pm.handled++;G.managerLog.push(`${stamp()}: ${pm.name} approved and started ${w.title} for ${money(w.cost)}.`)}else{w.status="Waiting Approval";G.phone.push({from:pm.name,text:`I reviewed ${w.title}. It's about ${money(w.cost)}, above my ${money(G.approvalLimits.property)} limit. I need your approval.`})}}else if(w.assigned===pm.name&&w.status==="In Progress"&&Math.random()<.35){w.status="Completed";w.completed=stamp();G.maintenanceHistory.push(`${stamp()}: ${pm.name} completed/coordinated ${w.title}.`);pm.handled++;let pi=P().issues.findIndex(x=>w.title.includes(x.text)||x.text.includes(w.title));if(pi>=0)P().issues.splice(pi,1)}})}
function managerTeamHTML(){return managerCard("property")+managerCard("leasing")+`<button onclick="tab='maintenance';render()">🔧 Maintenance Center</button><h4>Recent Manager Activity</h4>${G.managerLog.slice(-6).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"<small>You are personally handling everything.</small>"}`}
function managerCard(type){let m=G.managers[type];let title=type==="property"?"Property Manager":"Leasing Manager";if(!m)return`<div class=managerCard><b>${title}</b><br>Position vacant — you handle these duties.<br><button onclick="hireManager('${type}')">Hire ${title}</button></div>`;return`<div class=managerCard><b>${m.name} — ${title}</b><br>Skill ${m.skill} · Judgment ${m.judgment} · Initiative ${m.initiative} · Salary ${money(m.pay)}/mo<br>${type==="property"?`Repair authority: ${money(G.approvalLimits.property)}`:`Rent authority: ±${G.approvalLimits.leasingRentPct}% · TI authority: ${money(G.approvalLimits.leasingTI)}`}<br><button onclick="managerSettings('${type}')">Manage / Authority</button> <button onclick="managerReport('${type}')">Performance Report</button></div>`}
function hireManager(type){let names=type==="property"?["Sarah Mitchell","David Lawson","Karen Brooks","Mike Reynolds"]:["Jennifer Cole","Brian Foster","Melissa Grant","Chris Bennett"],m={name:rand(names),skill:62+~~(Math.random()*25),judgment:58+~~(Math.random()*30),initiative:55+~~(Math.random()*35),pay:type==="property"?5200:4800,handled:0,mistakes:0,tours:0,deals:0};G.managers[type]=m;G.phone.push({from:m.name,text:`I'm ready to take over as ${type==="property"?"property":"leasing"} manager. Set my authority level and I'll start handling routine work.`});render()}
function managerSettings(type){let m=G.managers[type];if(!m)return;if(type==="property"){let v=+prompt(`Maximum repair amount ${m.name} may approve without calling you:`,G.approvalLimits.property);if(v>=0)G.approvalLimits.property=v}else{let r=+prompt("Maximum % from asking rent the leasing manager may negotiate:",G.approvalLimits.leasingRentPct);let ti=+prompt("Maximum tenant-improvement allowance without your approval:",G.approvalLimits.leasingTI);if(r>=0)G.approvalLimits.leasingRentPct=r;if(ti>=0)G.approvalLimits.leasingTI=ti}render()}
function managerReport(type){let m=G.managers[type];modal.style.display="flex";if(type==="property"){let unresolved=P().issues.length+G.maintenanceFindings.filter(x=>!x.resolved).length;modalbox.innerHTML=`<h2>🏢 ${m.name} — Property Manager Report</h2><p>Property condition: ${P().condition.toFixed(0)}%<br>Appearance: ${overallAppearance().toFixed(0)}%<br>Open issues: ${unresolved}<br>Repairs handled: ${m.handled}<br>Manager mistakes/delays: ${m.mistakes}</p><p>${m.skill>78?"Strong operational follow-through.":m.skill>65?"Generally dependable, but still needs oversight.":"Needs close supervision on property operations."}</p><button onclick=closeModal()>Close</button>`}else{let occ=P().stores.filter(Boolean).length/P().stores.length*100;modalbox.innerHTML=`<h2>🤝 ${m.name} — Leasing Report</h2><p>Occupancy: ${occ.toFixed(0)}%<br>Current leads: ${P().leads.length}<br>Tours handled: ${m.tours}<br>Deals assisted: ${m.deals}<br>Manager mistakes/delays: ${m.mistakes}</p><p>${m.skill>78?"Strong prospect follow-up and negotiation.":m.skill>65?"Solid leasing activity with occasional follow-up needed.":"You may need to stay involved in important prospects."}</p><button onclick=closeModal()>Close</button>`}}
function propertyManagerHTML(){let m=G.managers.property;return m?`<div class=pmBanner><b>✓ PROPERTY MANAGER ACTIVE</b><br><strong>${m.name}</strong> is assigned to ${P().name||"this property"}.<br>Repair authority: ${money(G.approvalLimits.property)} · Handled ${m.handled||0} item(s) · Mistakes/delays ${m.mistakes||0}<br><small>${m.name} automatically reviews routine maintenance, tenant concerns and property appearance. Items above authority come to you.</small><br><button onclick="managerRound('property')">Ask for Update</button> <button onclick="managerSettings('property')">Change Authority</button> <button onclick="tab='maintenance';render()">Open Maintenance Center</button></div>`:`<div class=pmBanner><b>PROPERTY MANAGER POSITION VACANT</b><br>You are personally responsible for approvals and follow-up.<br><button onclick="hireManager('property')">Hire Property Manager</button></div>`}
function leasingManagerHTML(){let m=G.managers.leasing;return m?`<p>${m.name} markets vacancies, follows leads, schedules tours and can negotiate within ±${G.approvalLimits.leasingRentPct}% of asking rent and ${money(G.approvalLimits.leasingTI)} TI.</p><button onclick="managerRound('leasing')">Ask for Leasing Update</button>`:`<p>No leasing manager. All prospect calls and tours come directly to you.</p>`}
function managerRound(type){let m=G.managers[type];if(!m)return;if(type==="property"){let txt=P().issues.length?`We have ${P().issues.length} open work order issue(s). The biggest concern is ${P().issues[0].text}.`:`Property is stable today. Appearance is ${overallAppearance().toFixed(0)}% and I don't have a major repair to escalate.`;G.phone.push({from:m.name,text:txt})}else{let txt=P().leads.length?`We have ${P().leads.length} active prospect(s). I'll keep following them and schedule tours.`:`No active prospects right now. I'm continuing vacancy marketing.`;G.phone.push({from:m.name,text:txt})}render()}
function proactiveLeaseManagement(){let lm=G.managers.leasing;if(!lm)return;P().stores.filter(Boolean).forEach(t=>{if(t.leaseEnd-G.year<=1&&Math.random()<.12&&!t.pendingTopic){t.pendingTopic="lease";G.phone.push({from:lm.name,text:`${t.name}'s lease expires in ${t.leaseEnd}. I started renewal outreach and ${t.owner} wants to talk terms.`,tenant:t.name,topic:"lease"})}})}
function managerMonthly(){proactiveLeaseManagement();propertyManagerMaintenanceTick();let pm=G.managers.property,lm=G.managers.leasing;if(pm){G.cash-=pm.pay;G.budgetActual.payroll+=pm.pay;addLedger(`${pm.name} property manager salary`,-pm.pay);let issue=P().issues[0];if(issue&&Math.random()<.25)G.managerLog.push(`${stamp()}: ${pm.name} reviewed open maintenance: ${issue.text}.`)}
if(lm){G.cash-=lm.pay;G.budgetActual.payroll+=lm.pay;addLedger(`${lm.name} leasing manager salary`,-lm.pay);if(P().stores.some(x=>!x)&&Math.random()<.55){if(!P().leads.length||Math.random()<.45){incomingInquiry();G.managerLog.push(`${stamp()}: ${lm.name} generated/followed a leasing inquiry.`)}else{let lead=P().leads[0];lm.tours++;if(lead.ti<=G.approvalLimits.leasingTI&&Math.abs((lead.rent-(P().askingRent||lead.rent))/Math.max(1,(P().askingRent||lead.rent))*100)<=G.approvalLimits.leasingRentPct&&Math.random()<lm.skill/110){G.phone.push({from:lm.name,text:`I toured ${lead.name}. Terms are within my authority and they're ready for your final lease approval.`});lm.deals++}else G.phone.push({from:lm.name,text:`I toured ${lead.name}. They want terms outside my authority, so I need you to review the LOI.`})}}}}
function overallAppearance(){let a=G.appearance;return (a.facade+a.paint+a.landscape+a.cleanliness+a.sidewalks+a.snowClearing+G.assets.sign.condition+G.assets.parking.condition)/8}
function appearanceHTML(){let a=G.appearance;return [["Facade",a.facade],["Paint",a.paint],["Landscaping",a.landscape],["Cleanliness",a.cleanliness],["Sidewalks",a.sidewalks],["Sign",G.assets.sign.condition],["Parking",G.assets.parking.condition],["Snow clearing",a.snowClearing]].map(([n,v])=>`<div class=appearanceMeter><span>${n}</span><div class=bar><i style="width:${v}%"></i></div><b>${v.toFixed(0)}</b></div>`).join("")+`<p><b>Overall curb appeal: ${overallAppearance().toFixed(0)}%</b></p><button onclick=appearanceProjects()>Improve Appearance</button>`}
function appearanceProjects(){modal.style.display="flex";modalbox.innerHTML=`<h2>🌳 Appearance Projects</h2><button onclick="appearanceAction('landscape',4500,22)">Refresh Landscaping — $4,500</button><button onclick="appearanceAction('paint',14000,35)">Repaint Building — $14,000</button><button onclick="appearanceAction('facade',42000,45)">Facade Renovation — $42,000</button><button onclick="appearanceAction('cleanliness',1800,20)">Pressure Wash / Deep Clean — $1,800</button><button onclick="appearanceAction('sidewalks',7500,28)">Repair Sidewalks — $7,500</button><button onclick="appearanceAction('snowClearing',2200,35)">Extra Snow Cleanup — $2,200</button><button onclick=closeModal()>Close</button>`}
function appearanceAction(k,cost,gain){if(G.cash<cost)return alert("Need "+money(cost));G.cash-=cost;addLedger(`Appearance project — ${k}`,-cost);G.appearance[k]=Math.min(100,G.appearance[k]+gain);if(k==="facade"||k==="paint")startProject(`${k} improvement`,3+~~(Math.random()*4));P().rep=Math.min(100,P().rep+2);closeModal();render()}
function ageAppearance(){let a=G.appearance;a.facade=Math.max(15,a.facade-(1+Math.random()*2));a.paint=Math.max(10,a.paint-(2+Math.random()*3));a.landscape=Math.max(15,a.landscape-(2+Math.random()*4));a.cleanliness=Math.max(25,a.cleanliness-(1+Math.random()*3));a.sidewalks=Math.max(20,a.sidewalks-(1+Math.random()*2));if(G.snowDepth>0)a.snowClearing=Math.max(10,a.snowClearing-(4+Math.random()*8));else a.snowClearing=Math.min(100,a.snowClearing+10);P().condition=(P().condition*3+overallAppearance())/4}
function visualAppearanceHTML(){let a=G.appearance,html="";let trees=Math.max(1,Math.round(a.landscape/22));html+=`<div class="landscapeStrip ${a.landscape<40?'deadGrass':''}">`;for(let i=0;i<trees;i++)html+=`<span class=tree style="left:${8+i*(80/Math.max(1,trees-1))}%">${a.landscape<35?"🌾":"🌳"}</span>`;if(a.landscape>65)html+=`<span class=flowerBed style="left:38%">🌷🌼🌷🌼🌷</span>`;html+="</div>";if(a.facade<55)html+=`<span class=facadeCrack style="left:23%;top:38%">〽</span><span class=facadeCrack style="left:72%;top:42%">〽</span>`;if(a.paint<45)html+=`<span class=rustMark style="left:58%;top:35%">▧ ▧</span>`;if(G.snowDepth>0){html+=`<span class=snowPile style="left:7%;top:70%">❄️</span><span class=snowPile style="right:8%;top:69%">❄️</span><div class=snowBank style="left:16%;right:16%;top:75%"></div>`}return html}
function facadeVisualClass(){return G.appearance.facade<35||G.appearance.paint<30?"veryWornFacade":G.appearance.facade<60||G.appearance.paint<55?"wornFacade":""}


function normalizePhoneItem(x){if(!x)return x;if(!x.id)x.id=G.nextPhoneId++;let txt=(x.text||"").toLowerCase(),from=x.from||"";if(x.finding===undefined&&(txt.includes("should look")||txt.includes("come take a look")||txt.includes("you should see"))){let fi=G.maintenanceFindings.findIndex(f=>!f.resolved&&(f.from===from||from.toLowerCase().includes("earl")));if(fi<0){let f=createMaintenanceFinding();fi=G.maintenanceFindings.length-1}x.finding=fi}if(!x.tenant){let ti=P().stores.findIndex(t=>t&&((t.owner===from)||from.includes(t.owner.split(" ")[0])));if(ti>=0)x.tenant=P().stores[ti].name}if(!x.topic){if(txt.includes("late")&&txt.includes("rent"))x.topic="relief";else if(txt.includes("lease")||txt.includes("renew"))x.topic="lease";else if(txt.includes("sign"))x.topic="signage";else if(txt.includes("parking"))x.topic="parking";else if(txt.includes("hvac")||txt.includes("heat")||txt.includes("cool"))x.topic="hvac";else if(txt.includes("maintenance"))x.topic="maintenance";else if(txt.includes("expand"))x.topic="expansion";else if(txt.includes("trash")||txt.includes("dumpster"))x.topic="trash";else x.topic="general"}return x}
function phoneActionLabel(x){normalizePhoneItem(x);if(x.finding!==undefined)return"🔦 Go see maintenance finding";if(x.topic==="relief")return"💵 Discuss late rent";if(x.topic==="lease")return"📄 Discuss lease / renewal";if(x.topic==="signage")return"🪧 Discuss storefront sign";if(x.topic==="parking")return"🚗 Discuss parking";if(x.topic==="hvac"||x.topic==="maintenance")return"🔧 Discuss maintenance concern";if(x.topic==="expansion")return"🏗 Discuss expansion";if(x.topic==="trash")return"🗑 Discuss property concern";if(x.tenant)return"💬 Talk to owner";return"☎️ Open request"}
function phoneRowHTML(x){normalizePhoneItem(x);return`<button class="phoneItem ${x.resolved?'resolvedPhone':''}" onclick="openPhoneRequest(${x.id})"><b>${x.from}</b><span>${x.text}</span><div class=phoneAction>${phoneActionLabel(x)} →</div></button>`}
function openPhoneRequest(id){let x=G.phone.find(p=>p.id===id);if(!x)return;normalizePhoneItem(x);if(x.finding!==undefined&&G.maintenanceFindings[x.finding]&&!G.maintenanceFindings[x.finding].resolved){goSeeFinding(x.finding);return}let i=x.tenant?P().stores.findIndex(t=>t&&t.name===x.tenant):-1;if(i>=0){P().stores[i].pendingTopic=x.topic;if(x.topic==="relief"){rentAccount(i);return}if(x.topic==="maintenance"){tenantMaintenanceConversation(i,x);return}if(x.topic==="trash"){ownerInteraction(i);return}if(x.topic==="signage"){discussStorefrontSign(i);return}ownerInteraction(i);return}modal.style.display="flex";modalbox.innerHTML=`<h2>☎️ ${x.from}</h2><p>${x.text}</p><button onclick="markPhoneResolved(${x.id})">Mark Handled</button> <button onclick=closeModal()>Close</button>`}

function createMaintenanceFinding(){let p=P(),vacant=[];p.stores.forEach((t,i)=>{if(!t)vacant.push(i)});let occupied=[];p.stores.forEach((t,i)=>{if(t)occupied.push(i)});let choices=[

function goSeeFinding(i){paused=true;if(typeof updateRunButton==="function")updateRunButton();let f=G.maintenanceFindings[i];if(!f||f.resolved)return;modal.style.display="flex";modalbox.innerHTML=`<h2>🔦 Property Walk — ${f.area}</h2><div class=inspectScene><div class=inspectBuilding><div class=inspectIssue>${f.icon}</div><b>${f.area}</b><p>${f.detail}</p></div></div><div class=inspectTalk><b>${f.from}:</b> "${maintenanceAdvice(f)}"</div><h3>What do you want to do?</h3><button class=walkChoice onclick="findingAction(${i},'work')">Create Work Order</button><button class=walkChoice onclick="findingAction(${i},'vendor')">Get Vendor Opinion / Quote</button><button class=walkChoice onclick="findingAction(${i},'temp')">Temporary Fix</button><button class=walkChoice onclick="findingAction(${i},'watch')">Monitor It</button><button onclick=closeModal()>Leave Area</button>`}
function maintenanceAdvice(f){if(f.cat==="roof")return "We can patch it, but with the age of this roof I'd keep replacement in mind.";if(f.cat==="hvac")return "I wouldn't let this one go too long. If that motor fails, the tenant could lose cooling.";if(f.cat==="electrical")return "I don't want to mess around with a hot panel. I'd get BrightLine out here.";if(f.cat==="paving")return "I can cold-patch it, but that's not a permanent repair.";if(f.cat==="plumbing")return "We need to figure out where that water is coming from before it becomes mold or wall damage.";return "I wanted you to see it before I did anything expensive."}

function rentResolve(i,x){let t=P().stores[i],a=ensureRentAccount(t),b=a.balance,n="";if(!b)return rentAccount(i);if(x==="pay"){G.cash+=b;addLedger(`${t.name} past-due rent`,b);a.balance=0;n=`${money(b)} paid in full.`}else if(x==="plan"){a.promise=`3-month plan: ${money(Math.ceil(b/3))}/month plus current rent`;a.status="Payment Plan";t.rel+=5;n=`Payment plan approved for ${money(b)}.`}else if(x==="partial"){let q=Math.round(b/2);G.cash+=q;a.balance-=q;addLedger(`${t.name} partial rent`,q);n=`Accepted ${money(q)}; ${money(a.balance)} remains.`}else if(x==="reduce"){let q=Math.round(t.rent*.15);a.balance=Math.max(0,a.balance-q);t.rel+=7;n=`Granted ${money(q)} rent credit.`}else if(x==="deposit"){let q=Math.min(t.deposit,a.balance);t.deposit-=q;a.balance-=q;n=`Applied ${money(q)} security deposit.`}else if(x==="notice"){a.status="Formal Notice";t.rel-=7;n=`Formal late notice issued.`}else{a.status="Default / Legal";t.rel-=15;n=`Default process started.`}if(a.balance<=0){a.balance=0;a.daysLate=0;a.status="Current";a.promise=null;t.pendingTopic=null}a.history.push(`${stamp()}: ${n}`);rememberOwner(t,n);rentAccount(i);render()}
