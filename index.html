function calculateUtilities(){let occ=P().stores.filter(Boolean).length,season=[12,1,2].includes(G.month)?1.35:[6,7,8].includes(G.month)?1.25:1;G.utilities.lastWater=G.utilities.water||0;G.utilities.electric=Math.round((1400+occ*240)*season*(1+(100-G.assets.electrical.condition)/250));G.utilities.gas=Math.round((500+occ*95)*([12,1,2].includes(G.month)?1.8:.7));G.utilities.water=Math.round((380+occ*75)*(Math.random()<.04?1.8:1));let total=G.utilities.electric+G.utilities.gas+G.utilities.water;G.budgetActual.utilities+=total;G.cash-=total;addLedger("Electric utility",-G.utilities.electric);addLedger("Gas utility",-G.utilities.gas);addLedger("Water utility",-G.utilities.water);if(G.utilities.lastWater&&G.utilities.water>G.utilities.lastWater*1.45)P().issues.push({text:"Investigate unusually high water usage",cost:1200,category:"plumbing"})}
function bankCapitalHTML(){let future=Object.entries(G.assets).sort((a,b)=>a[1].condition-b[1].condition).slice(0,4);return`<p><b>Capital reserves:</b> ${money(G.reserves)} <button onclick="moveReserve()">Transfer to Reserves</button></p><p><b>Banker:</b> ${G.banker.name} · Relationship ${G.banker.rel}% <button onclick=bankMeeting()>Call Banker</button></p><h4>5-Year Capital Outlook</h4>${future.map(([k,a])=>`<div class=reserveBox><b>${k}</b> — ${a.condition.toFixed(0)}%, age ${a.age}/${a.life}<br>${a.condition<45?"Likely near-term capital need":a.age>a.life-4?"Plan replacement within 1–4 years":"Monitor / maintain"}</div>`).join("")}<p>Tax assessment: ${money(G.taxAssessment)} <button onclick=appealTax()>Appeal Assessment</button></p>`}
function moveReserve(){let v=+prompt("Amount to transfer from operating cash to capital reserves:","10000");if(!v||v<0||G.cash<v)return;G.cash-=v;G.reserves+=v;addLedger("Transfer to capital reserves",-v);render()}
function bankMeeting(){modal.style.display="flex";modalbox.innerHTML=`<h2>🏦 ${G.banker.name}</h2><p>"Your operating history matters when we look at future loans. Keep occupancy, cash flow and property condition healthy."</p><p>Bank relationship: ${G.banker.rel}%</p><button onclick="bankRequest('line')">Request $50k Credit Line</button> <button onclick="bankRequest('capex')">Discuss Capital Loan</button> <button onclick=closeModal()>End Meeting</button>`}
function bankRequest(type){let ok=(P().stores.filter(Boolean).length/P().stores.length*.4)+(P().condition/100*.3)+(G.banker.rel/100*.3)>.58;if(ok){let amt=type==="line"?50000:100000;G.cash+=amt;G.debt+=amt;G.banker.rel+=2;addLedger(`${type==="line"?"Credit line":"Capital loan"} proceeds`,amt);alert("Approved.")}else{G.banker.rel-=2;alert("Bank declined based on current property performance.")}closeModal();render()}
function appealTax(){if(G.taxAppealYear===G.year)return alert("Already appealed this year.");G.taxAppealYear=G.year;let win=Math.random()<.48;if(win){G.taxAssessment=Math.round(G.taxAssessment*.92);G.phone.push({from:"Tax Consultant",text:"Assessment appeal succeeded. The taxable value was reduced."})}else G.phone.push({from:"Tax Consultant",text:"Assessment appeal was denied this year."});render()}
function claimsHTML(){return G.claims.length?G.claims.slice(-6).reverse().map(c=>`<div class=claim><b>${c.type}</b> · ${c.status}<br>Damage ${money(c.damage)} · Deductible ${money(c.deductible)}${c.status==="Open"?`<br><button onclick="processClaim(${G.claims.indexOf(c)})">Meet Adjuster</button>`:""}</div>`).join(""):"No insurance claims."}
function createClaim(type,damage){G.claims.push({type,damage,deductible:5000,status:"Open"});G.phone.push({from:"Insurance Carrier",text:`Claim opened for ${type}. An adjuster needs to inspect the property.`})}
function processClaim(i){let c=G.claims[i],covered=Math.random()<.82;if(covered){let pay=Math.max(0,c.damage-c.deductible);G.cash+=pay;addLedger(`Insurance claim payment — ${c.type}`,pay);c.status="Paid"}else c.status="Denied / excluded";render()}
function contractorBids(project,base,cat){let vendors=G.vendors.filter(v=>v.cat===cat||v.cat==="general").slice(0,3);modal.style.display="flex";modalbox.innerHTML=`<h2>📋 Bids — ${project}</h2>${vendors.map(v=>{let price=Math.round(base*v.factor*(.92+Math.random()*.16));return`<div class=bid><b>${v.name}</b><br>${money(price)} · Quality ${v.quality} · Reliability ${v.reliability}<br><button onclick="awardBid('${project}','${v.name}',${price})">Award</button></div>`}).join("")}<button onclick=closeModal()>Cancel</button>`}
function awardBid(project,vendor,price){if(G.cash+G.reserves<price)return alert("Insufficient cash and reserves.");let fromRes=Math.min(G.reserves,price);G.reserves-=fromRes;G.cash-=price-fromRes;addLedger(`${project} — ${vendor}`,-price);startProject(project,5+~~(Math.random()*8));closeModal();render()}
function customerComplaint(){let list=["Potholes are rough near the entrance.","Parking lot is too dark at night.","Snow is blocking accessible parking.","Trash around the dumpster looks bad.","I couldn't tell which entrance to use.","Accessible parking markings are faded."],text=rand(list);G.customerComplaints.push({date:stamp(),text});G.phone.push({from:"Customer Complaint",text});if(text.includes("accessible"))G.ada-=4;if(text.includes("dark"))P().lights-=3}
function staffAnnualRealism(){G.staff.forEach(e=>{e.pay=Math.round(e.pay*1.03);if(Math.random()<.08){G.staffAbsences.push({name:e.name,date:stamp(),reason:rand(["sick day","vacation","family emergency"])});G.phone.push({from:e.name,text:`I need to be off today — ${G.staffAbsences.at(-1).reason}.`})}})}
function environmentalEvent(){if(G.environmentalChecked||G.year<1990)return;if(Math.random()<.025){G.environmentalChecked=true;let issue=rand(["Suspected asbestos flooring found during renovation","Old underground tank records discovered","Possible lead-containing paint identified"]);P().issues.push({text:issue,cost:12000+~~(Math.random()*28000),category:"general"});G.phone.push({from:"Environmental Consultant",text:issue})}}
function tenantConflict(){let ts=P().stores.filter(Boolean);if(ts.length<2)return;let a=rand(ts),b=rand(ts.filter(x=>x!==a)),reason=rand(["delivery trucks blocking storefront access","music/noise complaints","restaurant odors","shared dumpster problems","customers using the wrong reserved spaces"]);G.phone.push({from:a.owner,text:`I need you to deal with ${b.name}. We're having problems with ${reason}.`,tenant:a.name,topic:"general"});rememberOwner(a,`Conflict with ${b.name}: ${reason}.`)}
function salePropertyProcess(){if(!G.saleProcess){G.saleProcess={stage:"Broker opinion",offer:Math.round(propertyValue(P())*(.92+Math.random()*.16))};G.phone.push({from:"Investment Sales Broker",text:"I prepared a broker opinion of value and can market the center if you want."})}else{let stages=["Broker opinion","Listed","Buyer offers","Due diligence","Buyer inspection / retrade","Closing"];let i=stages.indexOf(G.saleProcess.stage);G.saleProcess.stage=stages[Math.min(stages.length-1,i+1)]}render()}
function assetHTML(){if(!G.assets)return"";return Object.entries(G.assets).map(([k,a])=>{let c=a.condition<35?"bad":a.condition<60?"warn":"";return`<div><b>${k.toUpperCase()}</b> · Age ${a.age} yrs / expected ${a.life} · ${a.condition.toFixed(0)}%<div class=assetbar><i class="${c}" style="width:${Math.max(0,a.condition)}%"></i></div><button onclick="assetOptions('${k}')">Inspect / Plan</button></div>`}).join("")}
function assetOptions(k){let a=G.assets[k],cat={roof:"roof",parking:"paving",hvac:"hvac",plumbing:"plumbing",electrical:"electrical",sign:"signage",lighting:"electrical",landscape:"landscape"}[k];let replace={roof:65000,parking:48000,hvac:12000,plumbing:18000,electrical:22000,sign:14000,lighting:16000,landscape:9000}[k];modal.style.display="flex";modalbox.innerHTML=`<h2>${k.toUpperCase()} Asset</h2><p>Condition <b>${a.condition.toFixed(0)}%</b> · Age <b>${a.age}</b> years · Typical useful life <b>${a.life}</b> years</p><p>${a.condition<30?"Failure risk is high. Replacement planning is urgent.":a.condition<55?"The asset is aging and repairs are becoming more likely.":"Asset is currently serviceable."}</p><button onclick="preventiveMaintenance('${k}','${cat}',${Math.round(replace*.08)})">Preventive Maintenance — ${money(Math.round(replace*.08))}</button> <button onclick="replaceAsset('${k}','${cat}',${replace})">Direct Replace — ${money(replace)}</button> <button onclick="contractorBids('${k} replacement',${replace},'${cat}')">Get 3 Bids</button> <button onclick=closeModal()>Close</button>`}
function preventiveMaintenance(k,cat,cost){if(G.cash<cost)return alert("Need "+money(cost));let a=G.assets[k];G.cash-=cost;addLedger(`${k} preventive maintenance`,-cost);a.condition=Math.min(100,a.condition+12);remember(`${k} Maintenance`,`${k} received preventive maintenance.`);closeModal();render()}
function replaceAsset(k,cat,cost){if(G.cash<cost)return alert("Need "+money(cost));let a=G.assets[k];G.cash-=cost;addLedger(`${k} replacement`,-cost);a.condition=100;a.age=0;if(k==="roof")v251CompleteRoofReplacement(cost);if(k==="parking")P().parking=100;if(k==="sign")P().sign=100;if(k==="lighting")P().lights=100;P().condition=Math.min(100,P().condition+4);remember(`${k} Replacement`,`A major ${k} replacement was completed.`);closeModal();render()}
function ageDetailedAssets(){G.rtus.forEach(r=>{r.age++;r.condition=Math.max(0,r.condition-(3+Math.random()*5+(r.age>r.life?5:0)));if(r.condition<35&&Math.random()<.35){r.repairs++;P().issues.push({text:`RTU #${r.id} failure serving ${r.tenant}`,cost:2200+~~(Math.random()*3500),category:"hvac"})}});G.roofSections.forEach(r=>{r.age++;r.condition=Math.max(0,r.condition-(2+Math.random()*4));if(r.condition<40&&Math.random()<.3)P().issues.push({text:`Roof leak — ${r.name}`,cost:3000+~~(Math.random()*5000),category:"roof"})});G.ada=Math.max(25,G.ada-(Math.random()*2));G.fireSafety=Math.max(30,G.fireSafety-(Math.random()*2))}
function ageAssets(){Object.entries(G.assets).forEach(([k,a])=>{a.age+=1;a.condition=Math.max(0,a.condition-(2+Math.random()*4+(a.age>a.life?4:0)));if(a.condition<45&&Math.random()<.38)assetFailure(k,a);});P().roof=G.assets.roof.condition;P().parking=G.assets.parking.condition;P().sign=G.assets.sign.condition;P().lights=G.assets.lighting.condition}
function assetFailure(k,a){let map={roof:["Roof leak from aging membrane",6500,"roof"],parking:["Parking lot cracking and pothole failure",4200,"paving"],hvac:["Aging rooftop HVAC unit failure",4800,"hvac"],plumbing:["Water line / drain failure",3600,"plumbing"],electrical:["Electrical panel / circuit issue",3900,"electrical"],sign:["Monument sign electrical/structure failure",2400,"signage"],lighting:["Parking lot light failure",1900,"electrical"],landscape:["Landscape irrigation / dead plantings",1400,"landscape"]},m=map[k];if(P().issues.some(x=>x.asset===k))return;P().issues.push({text:m[0],cost:m[1],category:m[2],asset:k});G.phone.push({from:"Property Alert",text:`${m[0]}. Asset condition is ${a.condition.toFixed(0)}%.`})}
function enterOffice(){let era=G.year<1995?"☎️ desk phone · 🗄️ metal file cabinets · 📒 paper ledger":G.year<2010?"☎️ phone · 🖥️ beige computer · 🗄️ tenant files":"📱 phone · 🖥️ dual monitors · ☁️ property software";modal.style.display="flex";modalbox.innerHTML=`<h2>🏢 Management Office — ${G.year}</h2><div class=officeRoom><p><b>${era}</b></p><div class=officeGrid><button class=officeObj onclick="officePhone()">☎️<br>Phone</button><button class=officeObj onclick="officeCalendar()">📅<br>Calendar</button><button class=officeObj onclick="officeFiles()">📁<br>Tenant Files</button><button class=officeObj onclick="officeWorkBoard()">🛠️<br>Work Board</button><button class=officeObj onclick="officeBooks()">💰<br>Accounting</button><button class=officeObj onclick="officeNews()">📰<br>Local News</button></div></div><p>Office level ${G.officeLevel}</p><button onclick=officeUpgrade()>Improve Office</button> <button onclick=closeModal()>Leave Office</button>`}
function officePhone(){modalbox.innerHTML=`<h2>☎️ Phone</h2><p>Click any call to handle it.</p>${G.phone.slice(-15).reverse().map(x=>phoneRowHTML(x)).join("")||"No recent calls."}<button onclick=enterOffice()>Back</button>`}
function officeCalendar(){modalbox.innerHTML=`<h2>📅 Calendar</h2>${appointmentHTML()}<button onclick=enterOffice()>Back</button>`}
function officeFiles(){modalbox.innerHTML=`<h2>📁 Tenant Files</h2>${P().stores.map((t,i)=>t?`<div class=log><b>${t.name}</b> · ${t.owner}<br>Lease ends ${t.leaseEnd} · Rent ${money(t.rent)}<br><button onclick="openTenant(${i})">Open File</button></div>`:"").join("")}<button onclick=enterOffice()>Back</button>`}
function officeWorkBoard(){modalbox.innerHTML=`<h2>🛠️ Work Board</h2>${G.workJobs.map(j=>`<div class=log><b>${j.vendor}</b> — ${j.text}<br>${j.status} · ${j.remaining} hr remaining<div class=woProgress><i style="width:${Math.max(5,100-j.remaining/j.total*100)}%"></i></div></div>`).join("")||"No active vendor jobs."}<button onclick=enterOffice()>Back</button>`}
function officeBooks(){modalbox.innerHTML=`<h2>💰 Accounting</h2>${ledgerHTML()}<button onclick=enterOffice()>Back</button>`}
function officeNews(){modalbox.innerHTML=`<h2>📰 Local Business News</h2>${G.townHistory.slice(-12).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"Nothing major in the local business news."}<button onclick=enterOffice()>Back</button>`}
function appointmentHTML(){return G.appointments.length?G.appointments.slice(0,8).map((a,i)=>`<div class=appointment><b>${a.when}</b> — ${a.title}<br>${a.detail||""}<br><button onclick="handleAppointment(${i})">Handle</button></div>`).join(""):"No scheduled appointments."}
function handleAppointment(i){let a=G.appointments[i];if(a.kind==="tour")tourProspect(a.lead);else alert(a.detail||a.title);G.appointments.splice(i,1);render()}
function scheduleTour(leadIndex){let l=P().leads[leadIndex];G.appointments.push({when:`${stamp()} · 10:30 AM`,title:`Property tour — ${l.name}`,detail:`${l.owner} will tour available space.`,kind:"tour",lead:leadIndex});G.phone.push({from:l.owner,text:"Great, I'll see you for the property tour."});render()}
function tourProspect(i){let l=P().leads[i];if(!l)return;let vacancy=P().stores.findIndex(x=>!x);modal.style.display="flex";modalbox.innerHTML=`<h2>🏢 Property Tour — ${l.name}</h2><p>${l.owner} arrives and walks Suite ${101+vacancy} with you.</p><p><b>Business:</b> ${l.type}<br><b>Proposed rent:</b> ${money(l.rent)}<br><b>TI request:</b> ${money(l.ti)}</p><p>"${l.type==="Restaurant"||l.type==="Pizza"?"Does this suite have enough power, plumbing and ventilation for my kitchen?":"How much work can I do to the suite and storefront?"}"</p><button onclick="interview(${i})">Discuss LOI / Economics</button> <button onclick=closeModal()>End Tour</button>`}
function rememberOwner(t,text){G.ownerMemories[t.name]=G.ownerMemories[t.name]||[];G.ownerMemories[t.name].push(`${stamp()}: ${text}`);if(G.ownerMemories[t.name].length>12)G.ownerMemories[t.name]=G.ownerMemories[t.name].slice(-12)}
function rentCollection(){syncLegacyRentV191()}
function reliefMeeting(i){rentAccount(i);return;let t=P().stores[i];modalbox.innerHTML=`<h2>💵 Rent Problem — ${t.name}</h2><p>${t.owner}: "I need some breathing room. I don't want to lose the business."</p><button onclick="reliefAction(${i},'plan')">3-Month Payment Plan</button> <button onclick="reliefAction(${i},'reduce')">Temporary 15% Reduction</button> <button onclick="reliefAction(${i},'deposit')">Apply Security Deposit</button> <button onclick="reliefAction(${i},'notice')">Formal Late Notice</button>`}
function reliefAction(i,a){let t=P().stores[i];if(a==="plan"){t.rel+=5;t.health+=3;rememberOwner(t,"You approved a payment plan.")}if(a==="reduce"){t.rel+=8;t.health+=6;G.cash-=Math.round(t.rent*.15);rememberOwner(t,"You granted temporary rent relief.")}if(a==="deposit"){G.cash+=t.deposit;t.deposit=0;t.rel-=2;rememberOwner(t,"Security deposit was applied to delinquent rent.")}if(a==="notice"){t.rel-=8;t.health-=4;rememberOwner(t,"You issued a formal late notice.")}t.pendingTopic=null;closeModal();render()}
function snowForecast(){if(G.snowDepth>0){serviceSnowEvent();G.snowPlan.ready=false;}if(![11,12,1,2,3].includes(G.month))return;if(Math.random()<.18){let inches=3+~~(Math.random()*8);G.snowDepth=inches;G.phone.push({from:"Weather Service",text:`Winter storm forecast: ${inches} inches expected. ${G.snowContract?"SnowForce is on contract.":"No snow contractor is currently pre-authorized."}`});if(!G.snowContract)G.appointments.push({when:stamp(),title:"Snow response decision",detail:`${inches} inches forecast. Consider arranging snow service.`})}}
function townEvolution(){let events=["A new subdivision opened near the center.","A regional employer announced an expansion.","A competing shopping center broke ground across town.","New apartments opened within the trade area.","A major road project changed traffic patterns.","A large retailer closed elsewhere in town.","A medical development opened nearby.","A new highway interchange improved regional access."];let e=rand(events);G.townHistory.push(`${G.year}: ${e}`);if(e.includes("apartments")||e.includes("subdivision")||e.includes("employer")){G.population+=300+~~(Math.random()*1000);G.traffic+=2}else if(e.includes("competing"))G.competition+=8;else if(e.includes("road"))G.traffic+=rand([-5,5]);}
function ownerLifeAnnual(){P().stores.filter(Boolean).forEach(t=>{if(Math.random()<.07){let e=rand(["A family member started helping with the business.","The owner is considering retirement.","The business added a manager.","The owner's child has expressed interest in taking over someday.","The owner mentioned possibly selling the business."]);rememberOwner(t,e);t.suiteHistory.push(`${G.year}: ${e}`)}if(t.ownerAge>67&&Math.random()<.12){t.pendingTopic="future";G.phone.push({from:t.owner,text:"I'd like to talk about my future with the business.",tenant:t.name,topic:"future"})}})}
function advanceVendorJobs(){G.workJobs.forEach(j=>{j.remaining-=speed;j.status=j.remaining<=2?"Finishing":"On site"});let done=G.workJobs.filter(j=>j.remaining<=0);done.forEach(j=>{let issue=P().issues[j.issue];if(issue){P().issues.splice(j.issue,1);if(issue.asset&&G.assets[issue.asset])G.assets[issue.asset].condition=Math.min(100,G.assets[issue.asset].condition+18)}G.phone.push({from:j.vendor,text:`Work completed: ${j.text}`})});G.workJobs=G.workJobs.filter(j=>j.remaining>0)}
function openOwnerByName(name){let i=P().stores.findIndex(t=>t&&t.name===name);if(i>=0)ownerInteraction(i);else{tab="desk";render()}}
function businessHours(type){if(type==="Grocery")return [7,21];if(["Pizza","Restaurant"].includes(type))return [11,22];if(type==="Hair Salon")return [9,18];if(["Insurance","Medical","Dental","Office"].includes(type))return [8,17];if(type==="Pharmacy")return [8,20];return [9,20]}
function isOpen(t){let h=t.hours||businessHours(t.type);return simHour>=h[0]&&simHour<h[1]}
function vacancyAge(pp,i){let logs=pp.history.filter(x=>x.includes(`Suite ${101+i}`)&&x.toLowerCase().includes("vacant"));return logs.length?Math.min(5,logs.length):0}
function addLedger(desc,amt){G.ledger.push({date:stamp(),desc,amt:Math.round(amt)});if(G.ledger.length>100)G.ledger=G.ledger.slice(-100)}
function ledgerHTML(){return G.ledger.length?G.ledger.slice(-18).reverse().map(x=>`<div class=ledgerRow><span>${x.date} · ${x.desc}</span><b class="${x.amt>=0?'good':'bad'}">${x.amt>=0?'+':''}${money(x.amt)}</b></div>`).join(""):"No transactions recorded yet."}
function toggleSnowContract(){G.snowContract=!G.snowContract;G.phone.push({from:"SnowForce",text:G.snowContract?"Snow service contract confirmed for the season.":"Snow service contract canceled."});render()}
function vendorHTML(){let cats=[...new Set(G.vendors.map(v=>v.cat))];return cats.map(c=>`<details><summary><b>${c.toUpperCase()}</b> (${G.vendors.filter(v=>v.cat===c).length})</summary>${G.vendors.filter(v=>v.cat===c).map(v=>`<div class=vendorCard><b>${v.name}</b><br>Quality ${v.quality} · Reliability ${v.reliability} · Price ${v.factor<.9?"$":v.factor>1.1?"$$$":"$$"}<br>Jobs completed: ${v.jobs||0}</div>`).join("")}</details>`).join("")}
function visitStore(i){let t=P().stores[i];if(!t)return;let open=isOpen(t),busy=Math.max(0,Math.round((t.sales/10000)*trafficByHour()));modal.style.display="flex";modalbox.innerHTML=`<h2>${t.name}</h2><div class=interior><div class=tenantSign>${t.name} · ${open?"OPEN":"CLOSED"}</div><p>${interiorDescription(t)}</p><div>${open?Array.from({length:Math.min(10,busy)},()=>`<span class=tableIcon>${t.type==="Grocery"?"🛒":"🧍"}</span>`).join(""):"🌙 The business is closed right now."}</div><p><b>${t.owner}</b> ${open?"is here today.":"is not currently in the store."}</p></div><p>${t.struggling?"The store feels noticeably quieter than it used to.":busy>5?"Business looks busy today.":"Traffic looks normal."}</p><button onclick="talk(${i})">Talk to ${t.owner.split(" ")[0]}</button> <button onclick="leaseManager(${i})">Discuss Lease</button> <button onclick=closeModal()>Leave Store</button>`}
function interiorDescription(t){if(t.type==="Pizza")return "🍕 Counter · 🍽️ dining tables · 🚪 kitchen · 📦 back room";if(t.type==="Grocery")return "🥫 Grocery aisles · 🥩 coolers · 🛒 carts · 📦 receiving area";if(t.type==="Hair Salon")return "💇 Styling chairs · 🪞 mirrors · 🧴 product shelves";if(t.type==="Pharmacy")return "💊 Pharmacy counter · 🧴 retail aisles · 🧾 checkout";return "🪑 Customer area · 🧾 counter · 📦 stock room"}
function suiteHistory(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>📚 Suite ${101+i} History</h2><div class=suiteHistory>${(t.suiteHistory||[]).map(x=>`<div class=log>${x}</div>`).join("")}${P().history.filter(x=>x.includes(`Suite ${101+i}`)).map(x=>`<div class=log>${x}</div>`).join("")}</div><button onclick=closeModal()>Close</button>`}
