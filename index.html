let payroll=G.staff.reduce((a,x)=>a+x.pay,0),interest=G.debt*G.rate/12,pay=Math.min(G.debt,3500+interest);G.cash-=payroll+G.insurance+pay+2300;G.debt=Math.max(0,G.debt-(pay-interest));G.month++;if(G.month>12){G.month=1;G.year++;G.population=Math.round(G.population*(.992+Math.random()*.025));G.traffic=Math.max(30,Math.min(100,G.traffic+~~(Math.random()*9)-4));G.economy=Math.max(30,Math.min(95,G.economy+~~(Math.random()*13)-6));G.competition=Math.max(10,Math.min(95,G.competition+~~(Math.random()*11)-4));annualReview();G.tax=Math.round(G.tax*1.025);G.staff.forEach((x,i)=>{x.age++;x.years++;x.morale=Math.max(30,x.morale-2);if(x.age>64&&Math.random()<.15){G.history.push(`${G.year} — ${x.name} retired after ${x.years} years.`);G.career.employeesRetired++;G.staff.splice(i,1)}});G.properties.forEach(pp=>pp.stores.filter(Boolean).forEach(t=>{t.age++;if(!t.temporary){t.rent=Math.round(t.rent*(1+t.escalator));t.cam=Math.round(t.rent*.18)}}));reviewsEra();historicalTypes();if(G.year%5===0)G.properties.forEach((_,i)=>{let a=G.active;G.active=i;snapshot();G.active=a});if(Math.random()<.2){G.roadwork=1;G.traffic=Math.max(25,G.traffic-8);G.inbox.push({from:"Town Hall",text:"Road construction will affect access this year."})}else G.roadwork=0}

function achievement(x){if(!G.achievements.includes(x))G.achievements.push(x)}
function achievements(){if(G.properties.length>=3)achievement("Three-property portfolio");if(G.debt<=0)achievement("Debt free");if(G.year-1985>=25)achievement("25-year owner");if(G.year-1985>=50)achievement("50-year legacy");if(G.properties.some(p=>p.stores.every(Boolean)))achievement("100% occupancy");if(G.properties.reduce((a,p)=>a+propValue(p),0)>=10000000)achievement("$10M portfolio")}



function businessHours(type){if(type==="Grocery")return [7,21];if(["Pizza","Restaurant"].includes(type))return [11,22];if(type==="Hair Salon")return [9,18];if(["Insurance","Medical","Dental","Office"].includes(type))return [8,17];if(type==="Pharmacy")return [8,20];return [9,20]}
function isOpen(t){let h=t.hours||businessHours(t.type);return simHour>=h[0]&&simHour<h[1]}
function vacancyAge(pp,i){let logs=pp.history.filter(x=>x.includes(`Suite ${101+i}`)&&x.toLowerCase().includes("vacant"));return logs.length?Math.min(5,logs.length):0}
function addLedger(desc,amt){G.ledger.push({date:stamp(),desc,amt:Math.round(amt)});if(G.ledger.length>100)G.ledger=G.ledger.slice(-100)}
function ledgerHTML(){return G.ledger.length?G.ledger.slice(-18).reverse().map(x=>`<div class=ledgerRow><span>${x.date} · ${x.desc}</span><b class="${x.amt>=0?'good':'bad'}">${x.amt>=0?'+':''}${money(x.amt)}</b></div>`).join(""):"No transactions recorded yet."}
function vendorHTML(){let cats=[...new Set(G.vendors.map(v=>v.cat))];return cats.map(c=>`<details><summary><b>${c.toUpperCase()}</b> (${G.vendors.filter(v=>v.cat===c).length})</summary>${G.vendors.filter(v=>v.cat===c).map(v=>`<div class=vendorCard><b>${v.name}</b><br>Quality ${v.quality} · Reliability ${v.reliability} · Price ${v.factor<.9?"$":v.factor>1.1?"$$$":"$$"}<br>Jobs completed: ${v.jobs||0}</div>`).join("")}</details>`).join("")}
function visitStore(i){let t=P().stores[i];if(!t)return;let open=isOpen(t),busy=Math.max(0,Math.round((t.sales/10000)*trafficByHour()));modal.style.display="flex";modalbox.innerHTML=`<h2>${t.name}</h2><div class=interior><div class=tenantSign>${t.name} · ${open?"OPEN":"CLOSED"}</div><p>${interiorDescription(t)}</p><div>${open?Array.from({length:Math.min(10,busy)},()=>`<span class=tableIcon>${t.type==="Grocery"?"🛒":"🧍"}</span>`).join(""):"🌙 The business is closed right now."}</div><p><b>${t.owner}</b> ${open?"is here today.":"is not currently in the store."}</p></div><p>${t.struggling?"The store feels noticeably quieter than it used to.":busy>5?"Business looks busy today.":"Traffic looks normal."}</p><button onclick="talk(${i})">Talk to ${t.owner.split(" ")[0]}</button> <button onclick="leaseManager(${i})">Discuss Lease</button> <button onclick=closeModal()>Leave Store</button>`}
function interiorDescription(t){if(t.type==="Pizza")return "🍕 Counter · 🍽️ dining tables · 🚪 kitchen · 📦 back room";if(t.type==="Grocery")return "🥫 Grocery aisles · 🥩 coolers · 🛒 carts · 📦 receiving area";if(t.type==="Hair Salon")return "💇 Styling chairs · 🪞 mirrors · 🧴 product shelves";if(t.type==="Pharmacy")return "💊 Pharmacy counter · 🧴 retail aisles · 🧾 checkout";return "🪑 Customer area · 🧾 counter · 📦 stock room"}
function suiteHistory(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>📚 Suite ${101+i} History</h2><div class=suiteHistory>${(t.suiteHistory||[]).map(x=>`<div class=log>${x}</div>`).join("")}${P().history.filter(x=>x.includes(`Suite ${101+i}`)).map(x=>`<div class=log>${x}</div>`).join("")}</div><button onclick=closeModal()>Close</button>`}
function assignIssue(i){let issue=P().issues[i],matches=G.vendors.filter(v=>v.cat===issue.category||v.cat==="general"||(issue.category==="maintenance"&&["general","painting","electrical","plumbing"].includes(v.cat)));modal.style.display="flex";modalbox.innerHTML=`<h2>Assign Work Order</h2><p>${issue.text}</p><h3>Employees</h3>${G.staff.map((e,j)=>`<button onclick="repairWithStaff(${i},${j})">${e.name} · ${e.role}</button>`).join(" ")||"No employees"}<h3>Vendors</h3>${matches.map(v=>`<div class=vendorCard><b>${v.name}</b> · Q${v.quality}/R${v.reliability}<br>Quote approx. ${money(issue.cost*v.factor)}<br><button onclick="repairWithVendor(${i},'${v.name.replaceAll("'","")}')">Hire Vendor</button></div>`).join("")||"No specialized vendor. Use general contractor."}<button onclick=closeModal()>Cancel</button>`}
function repairWithStaff(ii,si){let issue=P().issues[ii],e=G.staff[si],cost=Math.round(issue.cost*.4),chance=(e.quality+e.reliability)/200;if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;addLedger(`${e.name}: ${issue.text}`,-cost);if(Math.random()<chance){P().issues.splice(ii,1);P().condition=Math.min(100,P().condition+1);G.phone.push({from:e.name,text:"Work order completed."})}else{issue.cost=Math.round(issue.cost*1.2);G.phone.push({from:e.name,text:"I couldn't finish that repair. We may need a specialist."})}closeModal();render()}
function repairWithVendor(ii,name){let issue=P().issues[ii],v=G.vendors.find(x=>x.name===name);if(!v)return;let cost=Math.round(issue.cost*v.factor);if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;addLedger(`${v.name}: ${issue.text}`,-cost);v.jobs=(v.jobs||0)+1;let chance=(v.quality+v.reliability)/200;if(Math.random()<chance){P().issues.splice(ii,1);P().condition=Math.min(100,P().condition+1);G.phone.push({from:v.name,text:"The work order is complete. Invoice sent."})}else{issue.cost=Math.round(issue.cost*1.12);G.phone.push({from:v.name,text:"We ran into a complication and need a return visit."})}closeModal();render()}
function tenantRumor(){let tenants=P().stores.filter(Boolean);if(!tenants.length)return;let t=rand(tenants);if(t.health<55&&!G.rumors.includes(t.name)){G.rumors.push(t.name);G.phone.push({from:rand(tenants).owner,text:`I don't know if it's true, but I've heard ${t.owner} at ${t.name} has been having a rough year.`});t.struggling=true}}
function competitionEvent(){let names=["New Discount Center","Crossroads Shopping Center","Regional Supercenter","New Grocery Development","Lifestyle Shops"];let x={name:rand(names),year:G.year,impact:5+~~(Math.random()*10)};G.competitionSites.push(x);G.competition=Math.min(100,G.competition+x.impact);G.inbox.push({from:"Local Business News",text:`${x.name} has opened nearby. Expect increased retail competition.`})}
function businessPeriod(){return simHour<10?"Opening":simHour<12?"Morning":simHour<14?"Lunch rush":simHour<17?"Afternoon":simHour<20?"Evening":"Closed / closing"}
function trafficByHour(){if(simHour<7||simHour>21)return .08;if(simHour>=11&&simHour<=13)return 1.15;if(simHour>=16&&simHour<=19)return 1.05;return .68}
function toggleTime(){paused=!paused;pauseBtn.textContent=paused?"▶ Run":"⏸ Pause";restartTimer();render()}
function restartTimer(){if(simTimer)clearInterval(simTimer);if(!paused)simTimer=setInterval(simStep,Math.max(450,1800/speed))}
function simStep(){if(paused)return;simHour++;if(simHour>21){simHour=8;advanceWeek()}else{livingEvents();render()}}
function livingEvents(){
 let pp=P();
 if(Math.random()<.08&&pp.stores.some(x=>!x))incomingInquiry();
 if(Math.random()<.045&&pp.stores.filter(Boolean).length){let t=rand(pp.stores.filter(Boolean));G.phone.push({from:t.owner,text:rand([`Can you stop by ${t.name} when you get a chance?`,`I want to talk about my lease before renewal.`,`Customers are complaining about parking today.`,`Something doesn't seem right with the HVAC.`])});}
 if(Math.random()<.035&&G.staff.length){let e=rand(G.staff);G.phone.push({from:e.name,text:rand(["I finished my current work order.","I noticed something behind the building you should look at.","A tenant stopped me with a maintenance question."])})}
 if(Math.random()<.025)randomDecision();if(Math.random()<.025)tenantRumor();if(Math.random()<.004)competitionEvent();
 if(G.phone.length>20)G.phone=G.phone.slice(-20)
}
function renderLife(){
 if(!window.life)return;let pp=P(),people=Math.min(14,Math.round(pp.stores.filter(Boolean).length*trafficByHour()+G.traffic/20)),html="";
 for(let i=0;i<people;i++){let left=8+Math.random()*84,top=48+Math.random()*42;html+=`<span class=personDot style="left:${left}%;top:${top}%">${i%5===0?"🛒":i%7===0?"📦":"🚶"}</span>`}
 if(pp.parking<55){for(let p=0;p<Math.min(4,Math.floor((60-pp.parking)/8)+1);p++)html+=`<span class=pothole style="left:${18+p*19}%;top:${76+(p%2)*8}%"></span>`}if(pp.condition<55){for(let w=0;w<3;w++)html+=`<span class=weed style="left:${6+w*42}%;top:55%">🌿</span>`}if(pp.issues.length)html+=`<span class=worktruck style="right:9%;top:70%">🚚</span>`;if(G.phone.length){let x=G.phone[G.phone.length-1];html+=`<div class=bubble style="right:4%;top:18%" onclick="tab='desk';render()">☎️ <b>${x.from}</b><br>${x.text}</div>`}
 let issue=pp.issues[0];if(issue)html+=`<div class=bubble style="left:5%;top:44%" onclick="tab='ops';render()">🔧 ${issue.text}</div>`;
 life.innerHTML=html
}
function leadSource(){let sources=["FOR LEASE sign / drive-by","Tenant referral","Local business owner","Newspaper classified"];if(G.year>=1998)sources.push("Property website");if(G.year>=2008)sources.push("Online commercial listing");if(G.broker)sources.push("Broker referral","Broker cold call");return rand(sources)}
function incomingInquiry(){if(P().leads.length>5)return;generateLead();let x=P().leads[P().leads.length-1];G.phone.push({from:x.owner,text:`I'm calling about your available space. I'm considering ${x.name}. I found you through ${x.source}.`})}
function marketVacancies(){if(!P().stores.some(x=>!x))return alert("No vacant suites.");let cost=G.year<1995?650:G.year<2008?1200:1800;if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;P().marketing=Math.min(100,P().marketing+18);let channel=G.year<1995?"newspaper classified and roadside signage":G.year<2008?"newspaper, broker flyer and property website":"commercial listing sites, property website and signage";G.leasingSources=[...new Set([...G.leasingSources,channel])];G.phone.push({from:"Leasing",text:`Vacancies advertised through ${channel}. Inquiries will arrive over time.`});render()}
function setAskingRent(){let cur=P().askingRent||2400,v=prompt("Monthly asking rent for vacant suites:",cur);if(v===null)return;v=Math.max(500,Math.min(25000,Number(v)||cur));P().askingRent=Math.round(v);render();closeModal()}
function leaseManager(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>📑 ${t.name} — Lease</h2><div class=leaseBox><label>Current base rent <input id=rentEdit type=number min=500 value="${t.rent}"></label><label>CAM charge <input id=camEdit type=number min=0 value="${t.cam}"></label><label>Annual escalation % <input id=escEdit type=number min=0 max=15 step=.5 value="${(t.escalator*100).toFixed(1)}"></label><label>Lease expiration year <input id=endEdit type=number min="${G.year}" value="${t.leaseEnd}"></label></div><p><small>You can propose changes, but an existing tenant may reject an unreasonable mid-lease rent increase. Normal rent increases are best handled at renewal or through the lease's annual escalation.</small></p><button onclick="proposeLease(${i})">Propose Changes</button> <button onclick="renew(${i})">Negotiate Renewal</button> <button onclick=closeModal()>Cancel</button>`}
function proposeLease(i){let t=P().stores[i],nr=Math.max(500,+rentEdit.value||t.rent),nc=Math.max(0,+camEdit.value||t.cam),ne=Math.max(0,Math.min(.15,(+escEdit.value||0)/100)),ny=Math.max(G.year,+endEdit.value||t.leaseEnd),jump=(nr-t.rent)/t.rent;let allowed=jump<=t.escalator+.01||G.year>=t.leaseEnd;if(!allowed){t.rel=Math.max(0,t.rel-4);G.phone.push({from:t.owner,text:`That rent change isn't in my lease. We can discuss it at renewal.`});alert("Tenant rejected the mid-lease base-rent increase. Existing lease terms still control.");return leaseManager(i)}t.rent=Math.round(nr);t.cam=Math.round(nc);t.escalator=ne;t.leaseEnd=ny;t.history.push(`${stamp()}: Lease economics updated`);P().history.push(`${stamp()} — Lease terms updated for ${t.name}.`);closeModal();render()}

function remember(title,text){if(!G.memories.some(x=>x.title===title&&x.date===stamp()))G.memories.push({title,date:stamp(),text})}
function openingScenario(){if(G.opened)return;G.opened=true;modal.style.display="flex";modalbox.innerHTML=`<h2>🏬 January 1985 — Welcome to Lakeview Plaza</h2><p>You just bought an aging neighborhood strip center with existing leases, an old roof, a tired parking lot and several owners eager to meet the new landlord.</p><p><b>Mortgage:</b> ${money(G.debt)}<br><b>Starting cash:</b> ${money(G.cash)}<br><b>Condition:</b> ${P().condition}%<br><b>Existing tenants:</b> ${P().stores.filter(Boolean).length}</p><p>Collect rent, fill vacancies, keep the building alive, and try not to make Tony mad.</p><button onclick="remember('The Lakeview Purchase','You took ownership of Lakeview Plaza and inherited its original tenants.');closeModal();render()">Take the Keys 🔑</button>`}
function randomDecision(){
 let qs=[
  {id:"tony",title:"Tony's Sidewalk Tables",text:"Tony wants six tables outside the pizza shop.",a:"Allow the tables",b:"Require a patio fee"},
  {id:"parking",title:"The Parking War",text:"The grocery manager says restaurant customers are taking prime spaces.",a:"Create reserved spaces",b:"Tell them to work it out"},
  {id:"paint",title:"Unauthorized Paint Job",text:"A tenant painted its storefront without approval.",a:"Require repainting",b:"Let it stay"},
  {id:"kids",title:"Kids Behind the Center",text:"Teenagers are skateboarding behind the stores.",a:"Add lighting & signs",b:"Leave it alone"}
 ];
 let q=rand(qs);G.pendingDecision=q.id;
 modal.style.display="flex";
 modalbox.innerHTML=`<h2>📞 ${q.title}</h2><p>${q.text}</p><button onclick="decisionResult(0)">${q.a}</button> <button onclick="decisionResult(1)">${q.b}</button> <button onclick=closeModal()>Decide Later</button>`
}
function decisionResult(n){
 let id=G.pendingDecision;
 if(id==="tony"){
  let t=P().stores.find(x=>x&&x.name.includes("Tony"));
  if(t){if(n===0){P().reputation+=2;t.health+=4;remember("Tony's Patio Experiment","You let Tony add sidewalk tables.")}else{G.cash+=1500;t.rel-=4}}
 }else if(id==="parking"){
  if(n===0){G.cash-=1200;P().reputation+=1;remember("The Parking War","You intervened in a tenant parking dispute.")}else P().reputation-=2
 }else if(id==="paint"){
  let candidates=P().stores.map((t,i)=>t?i:-1).filter(i=>i>=0),i=rand(candidates),t=P().stores[i];
  if(n===0){t.storeColor=null;P().condition+=1;P().history.push(`${stamp()} — ${t.name} was required to repaint its unauthorized storefront.`)}
  else{let colors=["#e94b3c","#7b2cbf","#00a6a6","#f08c00","#e83e8c","#2f9e44","#1971c2"];t.storeColor=rand(colors);P().reputation+=1;P().condition-=1;remember("The Unauthorized Paint Job",`${t.name}'s unapproved storefront color became part of the center's look.`)}
 }else if(id==="kids"){
  if(n===0){G.cash-=2000;P().security+=4}else if(Math.random()<.4)addIssue("Skateboard damage behind the center.",1800,"maintenance")
 }
 G.pendingDecision=null;closeModal();autoSave();render()
}
function annualReview(){let pp=P(),occ=Math.round(pp.stores.filter(Boolean).length/pp.stores.length*100),arr=pp.stores.filter(Boolean).slice().sort((a,b)=>b.sales-a.sales),best=arr[0];G.lastAnnual=`<b>${G.year-1} Results</b><br>Occupancy ${occ}% · Value ${money(propValue(pp))}<br>Debt ${money(G.debt)}<br>Best tenant: ${best?best.name:"None"}<br>Open work orders: ${pp.issues.length}`;G.inbox.push({from:"Annual Review",text:`Your ${G.year-1} year-end report is ready.`})}
function hallOfFame(){let all=[];G.properties.forEach(pp=>pp.stores.filter(Boolean).forEach(t=>all.push(t)));all.sort((a,b)=>a.since-b.since);let longest=all[0];modal.style.display="flex";modalbox.innerHTML=`<h2>🎖️ Hall of Fame</h2><p>Career: ${G.year-1985} years<br>Properties: ${G.properties.length}<br>Portfolio value: ${money(G.properties.reduce((a,p)=>a+propValue(p),0))}<br>Career rent: ${money(G.career.rent)}<br>Debt: ${money(G.debt)}<br>Longest current tenant: ${longest?longest.name+" since "+longest.since:"None"}<br>Employees retired: ${G.career.employeesRetired}<br>Disasters survived: ${G.career.disasters}</p><h3>Memories</h3>${G.memories.slice(-12).map(x=>`<div class=log><b>${x.title}</b> — ${x.date}</div>`).join("")}<button onclick=closeModal()>Back</button>`}
function autoSave(){try{localStorage.setItem("stripMallTycoonV40",JSON.stringify(G))}catch(e){}}

function save(){localStorage.setItem("stripMallTycoonV40",JSON.stringify(G));localStorage.setItem("stripMallTycoonV3",JSON.stringify(G));localStorage.setItem("stripMallTycoonV2",JSON.stringify(G));alert("Saved.")}
function load(){let s=localStorage.getItem("stripMallTycoonV40")||localStorage.getItem("stripMallTycoonV321")||localStorage.getItem("stripMallTycoonV32")||localStorage.getItem("stripMallTycoonV31")||localStorage.getItem("stripMallTycoonV3")||localStorage.getItem("stripMallTycoonV2")||localStorage.getItem("stripMallTycoonV1");if(!s)return alert("No save found.");G=JSON.parse(s);migrate();render()}
function newGame(){if(!G||confirm("Start a new 1985 career?")){G=base();render();setTimeout(openingScenario,80)}}
function closeModal(){modal.style.display="none"}newGame();
</script></body></html>
