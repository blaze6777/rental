function seasonOpsHTML(){let season=[12,1,2].includes(G.month)?"Winter":[3,4,5].includes(G.month)?"Spring":[6,7,8].includes(G.month)?"Summer":"Fall",c=G.snowContract,valid=c&&c.year===G.year&&c.status==="Active";let advice=season==="Winter"?"Snow contractor, salt inventory and accessible spaces need attention.":season==="Spring"?"Mulch, flowers, cleanup and roof-drain inspection season.":season==="Summer"?"HVAC load, mowing and irrigation are priorities.":"Leaves, drainage, roof prep and winter planning are priorities.";return`<div class=seasonOps><b>${season}</b><p>${advice}</p><div class="snowContract ${c&&!valid?'snowExpired':''}">${valid?`❄️ <b>Snow Contract Active — ${c.vendor}</b><br>${c.plan} · ${money(c.annual)} annual${c.perPush?` + ${money(c.perPush)}/push`:""}<br>Salt ${c.saltIncluded?"included":money(c.saltRate)+"/application"} · response target ${c.response} hr<br><button onclick=openSnowContract()>Manage Contract</button>`:`<b>${c?"Snow contract expired":"No snow contractor under contract"}</b><br>${c?`Previous vendor: ${c.vendor} (${c.year})<br>`:""}<button onclick=requestSnowBids()>Request Snow Bids</button>`}</div>${season==="Winter"?`<p>Salt inventory ${G.inventory.salt} · OT ${G.snowPlan.overtime?"authorized":"not authorized"}</p><button onclick=prepareSnow()>Prepare for Snow</button>`:""}<button onclick=seasonalService()>Schedule Seasonal Service</button></div>`}

function awardSnowContract(i){let b=G.snowBids[i];if(!b)return;let deposit=Math.round(b.annual*.25);if(G.cash<deposit)return alert(`Need ${money(deposit)} for the contract deposit.`);G.cash-=deposit;addLedger(`${b.vendor} snow contract deposit`,-deposit);G.snowContract={...b,year:G.year,status:"Active",paid:deposit,events:0,misses:0};G.snowPlan.contractor=true;G.snowHistory.push(`${stamp()}: Awarded ${G.year} snow contract to ${b.vendor} — ${b.plan}, ${money(b.annual)} season price.`);G.vendorRelations[b.vendor]=G.vendorRelations[b.vendor]??b.reliability;G.paperwork.push({type:"Snow Contract",from:b.vendor,amount:deposit,text:`25% deposit for ${G.year} snow & ice agreement`,status:"Paid / Approved"});closeModal();render()}
function openSnowContract(){let c=G.snowContract;if(!c)return requestSnowBids();modal.style.display="flex";modalbox.innerHTML=`<h2>❄️ Snow Contract — ${c.vendor}</h2><p><b>${c.plan}</b><br>Contract year ${c.year}<br>Season price ${money(c.annual)}<br>${c.perPush?`Plow charge ${money(c.perPush)}/push<br>`:""}Salt ${c.saltIncluded?"included":money(c.salt)+"/application"}<br>Response target ${c.response} hours<br>Storms serviced ${c.events||0} · Service misses ${c.misses||0}</p><button onclick=snowVendorConversation()>Call Vendor</button> <button onclick=requestSnowBids()>Get Competing Bids</button><button onclick=closeModal()>Close</button>`}
function snowVendorConversation(){let c=G.snowContract,line=c.misses?`"I know we missed the response target on ${c.misses} event(s). We need to improve that."`:`"We're set for the season. We'll monitor storms and prioritize entrances, fire lanes and accessible parking."`;modalbox.innerHTML=`<h2>☎️ ${c.vendor}</h2><p>${line}</p><button onclick=openSnowContract()>Back</button>`}
function annualSnowRenewal(){let c=G.snowContract;if(c&&c.year<G.year&&c.status==="Active"){c.status="Expired";G.snowPlan.contractor=false;G.phone.push({from:c.vendor,text:`Our snow agreement expired after the ${c.year} season. Would you like a renewal proposal for ${G.year}?`,topic:"snow"});G.paperwork.push({type:"Contract Renewal",from:c.vendor,amount:0,text:`Snow & ice agreement renewal needed for ${G.year}`,status:"Open"});G.snowHistory.push(`${stamp()}: ${c.vendor} snow agreement expired; renewal required.`)}}
function serviceSnowEvent(){let c=G.snowContract,depth=G.snowDepth||0;if(depth<=0)return;if(!c||c.status!=="Active"||c.year!==G.year){G.appearance.snowClearing=Math.max(0,G.appearance.snowClearing-18);G.phone.push({from:"Property Manager",text:"We have accumulating snow and no active snow contract. We need to call someone for emergency service."});return}c.events=(c.events||0)+1;let v=G.snowVendors.find(x=>x.name===c.vendor),success=Math.random()*100<(v?.reliability||c.reliability);if(success){G.appearance.snowClearing=Math.min(100,G.appearance.snowClearing+22);let charge=c.plan.includes("per-push")?c.perPush:0;if(!c.saltIncluded&&depth>2)charge+=c.salt;if(charge){G.cash-=charge;G.budgetActual.snow+=charge;addLedger(`${c.vendor} snow event service`,-charge);G.paperwork.push({type:"Snow Service",from:c.vendor,amount:charge,text:`Plowing/salt service for snow event`,status:"Paid / Approved"})}G.snowHistory.push(`${stamp()}: ${c.vendor} serviced a ${depth.toFixed?depth.toFixed(1):depth}" snow event.`)}else{c.misses=(c.misses||0)+1;G.appearance.snowClearing=Math.max(0,G.appearance.snowClearing-12);G.vendorRelations[c.vendor]=Math.max(0,(G.vendorRelations[c.vendor]||60)-5);G.phone.push({from:G.managers.property?.name||"Property Manager",text:`${c.vendor} missed the response target during this snow event. The lot is not ready.`});G.snowHistory.push(`${stamp()}: ${c.vendor} missed its response target during a snow event.`)}}
function prepareSnow(){let c=G.snowContract,active=c&&c.status==="Active"&&c.year===G.year;G.snowPlan={ready:active,salt:G.inventory.salt>5||!!c?.saltIncluded,contractor:active,overtime:true};if(active)G.phone.push({from:c.vendor,text:"We're confirmed for the next event. We'll prioritize entrances, fire lanes and accessible parking."});else G.phone.push({from:"Property Manager",text:"We don't have an active snow contract. I recommend getting bids before the next storm."});render()}
function seasonalService(){let cost=1800;if(G.cash<cost)return alert("Need $1,800");G.cash-=cost;G.appearance.landscape=Math.min(100,G.appearance.landscape+10);G.appearance.cleanliness=Math.min(100,G.appearance.cleanliness+6);addLedger("Seasonal grounds service",-cost);render()}
function leaseCalendarHTML(){let ts=P().stores.filter(Boolean).sort((a,b)=>a.leaseEnd-b.leaseEnd);return ts.slice(0,6).map(t=>{let yrs=t.leaseEnd-G.year;return`<div class=log><b>${t.name}</b> — lease ends ${t.leaseEnd}${yrs<=1?" <span class=bad>RENEWAL WINDOW</span>":""}</div>`}).join("")}
function promiseHTML(){return`<h4>Promises to Tenants</h4>${G.promises.filter(x=>!x.done).map((p,i)=>`<div class=promise><b>${p.tenant}</b>: ${p.text}<br>Due ${p.due}<button onclick="fulfillPromise(${G.promises.indexOf(p)})">Mark Kept</button></div>`).join("")||"<small>No open promises.</small>"}<button onclick=addPromise()>Make Promise</button>`}
function addPromise(){let ts=P().stores.filter(Boolean),name=prompt("Tenant/business name:",ts[0]?.name||"");let t=ts.find(x=>x.name.toLowerCase()===String(name).toLowerCase());if(!t)return alert("Tenant not found.");let text=prompt("What did you promise?","Repair the sidewalk this month");if(!text)return;G.promises.push({tenant:t.name,text,due:`${G.month}/${G.year}`,done:false});rememberOwner(t,`You promised: ${text}`);render()}
function fulfillPromise(i){let p=G.promises[i];p.done=true;let t=P().stores.find(x=>x&&x.name===p.tenant);if(t){t.rel=Math.min(100,t.rel+7);let sat=G.tenantSatisfaction[t.name];if(sat)sat.communication=Math.min(100,sat.communication+8);rememberOwner(t,`Promise kept: ${p.text}`)}render()}
function tenantSatisfactionHTML(t){let x=G.tenantSatisfaction[t.name]||{maintenance:70,value:70,appearance:70,parking:70,communication:70};return`<h3>Tenant Satisfaction</h3>${Object.entries(x).map(([k,v])=>staffBar(k[0].toUpperCase()+k.slice(1),v)).join("")}`}
function vendorRelationsHTML(){let all=[...G.vendors.slice(0,10),...G.snowVendors];return all.map(v=>`<div class=vendorRel><span>${v.name}${G.snowVendors.includes(v)?" ❄️":""}</span><b>${G.vendorRelations[v.name]||v.reliability||60}%</b></div>`).join("")}
function communityHTML(){return`<p>Owner reputation: <b>${G.ownerReputation.toFixed(0)}%</b></p><button onclick=communityEvent()>Community / Town Meeting</button>${G.communityLog.slice(-4).reverse().map(x=>`<div class=log>${x}</div>`).join("")}`}
function communityEvent(){let e=rand(["Chamber of Commerce asks Lakeview to sponsor a community event.","Town engineer discusses upcoming road work near the center.","Police ask about lighting and camera coverage.","Fire department offers a pre-plan walk-through.","Neighboring owner wants to discuss drainage between properties."]);G.communityLog.push(`${stamp()}: ${e}`);G.ownerReputation=Math.min(100,G.ownerReputation+2);G.phone.push({from:"Community / Town",text:e});render()}
function companyHTML(){let c=G.company;return`<div class=companyBadge><b>${c.name}</b><br>Company reputation ${c.reputation}%<br>Controller: ${c.controller||"—"} · Regional PM: ${c.regional||"—"}<br>Maintenance Director: ${c.maintenanceDirector||"—"} · Leasing Director: ${c.leasingDirector||"—"}<br><button onclick=renameCompany()>Company Name</button> <button onclick=growCompany()>Hire Corporate Role</button></div>`}
function renameCompany(){let n=prompt("Ownership company name:",G.company.name);if(n)G.company.name=n;render()}
function growCompany(){let roles=[["controller","Controller"],["regional","Regional Property Manager"],["maintenanceDirector","Maintenance Director"],["leasingDirector","Leasing Director"]],r=roles.find(x=>!G.company[x[0]]);if(!r)return alert("Corporate leadership team is already staffed.");if(G.cash<10000)return alert("Need $10,000 recruiting/startup cost.");G.cash-=10000;G.company[r[0]]=rand(["Alex Morgan","Jamie Turner","Robin Ellis","Casey Wallace"]);G.company.reputation=Math.min(100,G.company.reputation+3);G.phone.push({from:G.company[r[0]],text:`I've joined ${G.company.name} as ${r[1]}.`});render()}
function parkingDemandHTML(){let open=P().stores.filter(t=>t&&isOpen(t)),demand=open.reduce((n,t)=>n+Math.max(2,Math.round((t.sales||30000)/7000*(t.type==="Grocery"?1.5:t.type==="Pizza"?1.4:1))),0),capacity=P().parkingSpaces||82,emp=Math.round(open.length*2*(G.parkingPolicy.employeeRear?.enabled?.5:1)),used=Math.min(capacity,demand+emp),pct=used/capacity*100;return`<p>Estimated spaces in use: <b>${used}/${capacity}</b> (${pct.toFixed(0)}%)</p><div class=parkingMeter><i style="width:${pct}%"></i></div><div class=trafficFlow>${open.map(t=>`${t.name}: ~${Math.max(2,Math.round((t.sales||30000)/7000))} customer cars`).join("<br>")}</div>`}
function dailyOperationsTick(){G.inventory.filters=Math.max(0,G.inventory.filters-(Math.random()<.08?1:0));if(G.inventory.filters===0&&Math.random()<.2)G.phone.push({from:"Earl Thompson",text:"We're out of HVAC filters. I can't finish the scheduled filter PM until we order more."});G.promises.filter(p=>!p.done).forEach(p=>{if(Math.random()<.015){let t=P().stores.find(x=>x&&x.name===p.tenant);if(t){t.rel=Math.max(0,t.rel-3);let sat=G.tenantSatisfaction[t.name];if(sat)sat.communication=Math.max(0,sat.communication-4)}}});}
function manageStaff(i){let e=G.staff[i];if(!e)return alert("Staff record not found.");e.morale=e.morale??75;e.skill=e.skill??e.quality??70;e.reliability=e.reliability??75;e.performanceNotes=e.performanceNotes||[];e.raiseHistory=e.raiseHistory||[];e.training=e.training||[];e.vacationDays=e.vacationDays??10;e.sickDays=e.sickDays??5;e.status=e.status||"Working";modal.style.display="flex";modalbox.innerHTML=`<h2>👤 ${e.name}</h2><p><b>${e.role}</b> · <span class=staffStatus>${e.status}</span><br>Age ${e.age||"—"} · ${e.years||1} year(s) with company<br>Pay: <b>${money(e.pay)}/month</b></p>${staffBar("Skill",e.skill)}${staffBar("Reliability",e.reliability)}${staffBar("Morale",e.morale)}<div class=staffActionGrid><button onclick="staffReview(${i})">Performance Review</button><button onclick="staffRaise(${i})">Pay / Raise</button><button onclick="staffTrain(${i})">Training</button><button onclick="staffTimeOff(${i})">Time Off</button><button onclick="staffAuthority(${i})">Authority / Duties</button><button onclick="staffConversation(${i})">Check In</button></div><h3>Employee History</h3><div class=staffHistory>${e.performanceNotes.slice(-8).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"<small>No notes yet.</small>"}</div><br><button onclick=closeModal()>Close</button>`}
function staffBar(label,v){return`<div class=staffStat><span>${label}</span><div class=bar><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div><b>${Math.round(v)}</b></div>`}
function staffReview(i){let e=G.staff[i],score=Math.round((e.skill+e.reliability+e.morale)/3);e.lastReview=stamp();let msg=score>=85?"Excellent performance. Consistently dependable and takes ownership.":score>=72?"Solid performance. Meeting expectations with some room to grow.":score>=60?"Mixed performance. Specific improvement goals are needed.":"Performance concerns require close follow-up.";e.performanceNotes.push(`${stamp()}: Performance review — ${score}/100. ${msg}`);e.morale=Math.min(100,e.morale+3);modalbox.innerHTML=`<h2>📋 Performance Review — ${e.name}</h2><p><b>Overall: ${score}/100</b></p><p>${msg}</p><p>Skill ${Math.round(e.skill)} · Reliability ${Math.round(e.reliability)} · Morale ${Math.round(e.morale)}</p><button onclick="manageStaff(${i})">Back to Employee</button>`}
function staffRaise(i){let e=G.staff[i];let pct=+prompt(`Raise percentage for ${e.name}:`,"3");if(!pct||pct<0)return;let old=e.pay;e.pay=Math.round(e.pay*(1+pct/100));e.morale=Math.min(100,e.morale+Math.min(10,pct));e.raiseHistory.push({date:stamp(),old,new:e.pay,pct});e.performanceNotes.push(`${stamp()}: Pay increased ${pct}% from ${money(old)} to ${money(e.pay)}/month.`);manageStaff(i);render()}
function staffTrain(i){let e=G.staff[i];modalbox.innerHTML=`<h2>🎓 Training — ${e.name}</h2><button onclick="buyTraining(${i},'Technical / Maintenance',900,8)">Technical / Maintenance — $900</button><button onclick="buyTraining(${i},'Customer & Tenant Service',500,5)">Customer & Tenant Service — $500</button><button onclick="buyTraining(${i},'Safety / Compliance',650,6)">Safety / Compliance — $650</button><button onclick="buyTraining(${i},'Leadership',1200,8)">Leadership — $1,200</button><br><button onclick="manageStaff(${i})">Back</button>`}
function buyTraining(i,name,cost,gain){let e=G.staff[i];if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;addLedger(`${e.name} training — ${name}`,-cost);e.skill=Math.min(100,e.skill+gain);e.morale=Math.min(100,e.morale+2);e.training.push(`${stamp()}: ${name}`);e.performanceNotes.push(`${stamp()}: Completed ${name} training.`);manageStaff(i);render()}
function staffTimeOff(i){let e=G.staff[i];modalbox.innerHTML=`<h2>🏖 Time Off — ${e.name}</h2><p>Vacation days available: <b>${e.vacationDays}</b><br>Sick days available: <b>${e.sickDays}</b></p><button onclick="approveTimeOff(${i},'Vacation')">Approve Vacation Day</button><button onclick="approveTimeOff(${i},'Sick')">Record Sick Day</button><button onclick="manageStaff(${i})">Back</button>`}
function approveTimeOff(i,type){let e=G.staff[i],key=type==="Vacation"?"vacationDays":"sickDays";if(e[key]<=0)return alert(`No ${type.toLowerCase()} days remaining.`);e[key]--;e.status=`${type} day`;e.morale=Math.min(100,e.morale+(type==="Vacation"?2:0));e.performanceNotes.push(`${stamp()}: ${type} day recorded.`);G.staffAbsences.push({name:e.name,date:stamp(),reason:type.toLowerCase()});setTimeout(()=>{e.status="Working"},0);manageStaff(i);render()}
function staffAuthority(i){let e=G.staff[i];let v=+prompt(`Maximum routine expense ${e.name} may handle without approval:`,e.authority||0);if(v<0||Number.isNaN(v))return;e.authority=v;e.performanceNotes.push(`${stamp()}: Authority limit set to ${money(v)}.`);manageStaff(i);render()}
function staffConversation(i){let e=G.staff[i],lines=e.morale>80?["Things are going well. I feel like I know what you expect from me.","I'm doing pretty well. Let me know if you want me to take on more."]:e.morale>60?["Overall I'm okay. There are a few busy days where I could use some help.","I'm doing alright, but the workload has been pretty steady."]:["I've been pretty frustrated lately. We should probably talk about workload and expectations.","Honestly, morale has been rough. I could use some support."];let line=rand(lines);e.morale=Math.min(100,e.morale+2);e.performanceNotes.push(`${stamp()}: Manager check-in — "${line}"`);modalbox.innerHTML=`<h2>💬 Check In — ${e.name}</h2><p><b>${e.name}:</b> "${line}"</p><button onclick="staffCheckinResponse(${i},'support')">Offer Support</button><button onclick="staffCheckinResponse(${i},'expectations')">Discuss Expectations</button><button onclick="staffCheckinResponse(${i},'growth')">Discuss Growth</button><button onclick="manageStaff(${i})">Back</button>`}
function staffCheckinResponse(i,a){let e=G.staff[i];if(a==="support"){e.morale=Math.min(100,e.morale+6);e.performanceNotes.push(`${stamp()}: You offered additional support/resources.`)}else if(a==="expectations"){e.reliability=Math.min(100,e.reliability+3);e.performanceNotes.push(`${stamp()}: You clarified performance expectations.`)}else{e.skill=Math.min(100,e.skill+2);e.morale=Math.min(100,e.morale+4);e.performanceNotes.push(`${stamp()}: You discussed future growth opportunities.`)}manageStaff(i);render()}


function centerExpansionHTML(compact=false){let e=P().expansion,added=P().stores.length-e.originalSuites,active=e.phases.find(x=>x.status==="Construction");return`<div class=centerExpansion><b>${P().name||"Lakeview Plaza"} — ${P().stores.length} suites</b><br>${added?`${added} suite(s) added since original construction.`:"Original footprint — no additions yet."}${active?`<div class=phaseCard>🚧 ${active.name}: ${active.weeks} weeks remaining</div>`:""}<br>${e.landAvailable&&P().stores.length<e.maxSuites?`<button onclick=openCenterExpansion()>Plan Addition</button>`:`<small>No practical expansion land remains.</small>`}${!compact?` <button onclick=expansionHistory()>Expansion History</button>`:""}</div>`}
function openCenterExpansion(){let e=P().expansion,remaining=e.maxSuites-P().stores.length;modal.style.display="flex";modalbox.innerHTML=`<h2>🏗 Expand ${P().name||"Lakeview Plaza"}</h2><p>You can physically add another wing to the existing shopping center. The addition creates real leasable suites and increases parking/utility demands.</p><div class=sitePlan><div><b>2-Suite Addition</b><br>~4,000 sq ft<br>${money(280000)}<br>5–7 months<br><button onclick="planCenterAddition(2,280000)">Plan</button></div><div><b>4-Suite Wing</b><br>~8,000 sq ft<br>${money(510000)}<br>7–10 months<br><button onclick="planCenterAddition(4,510000)">Plan</button></div><div><b>Anchor Addition</b><br>1 large + 2 small spaces<br>${money(780000)}<br>10–14 months<br><button onclick="planCenterAddition(3,780000,'anchor')">Plan</button></div></div><p>Land capacity remaining: approximately <b>${remaining}</b> additional suite positions.</p><button onclick=closeModal()>Close</button>`}
function planCenterAddition(count,cost,type="wing"){let e=P().expansion;if(P().stores.length+count>e.maxSuites)return alert("Not enough remaining land for that addition.");let parking=type==="anchor"?36:count*9,design=Math.round(cost*.06),permit=Math.round(cost*.025);modalbox.innerHTML=`<h2>📐 Addition Feasibility</h2><p><b>${type==="anchor"?"Anchor Addition":count+"-Suite Wing"}</b></p><p>Construction: ${money(cost)}<br>Architecture/engineering: ${money(design)}<br>Permits/site approvals: ${money(permit)}<br>Estimated parking demand: +${parking} spaces<br><b>Total project: ${money(cost+design+permit)}</b></p><p>This project will proceed through design/permits, site work, construction and opening. Existing tenants remain open, but construction can temporarily hurt appearance and parking.</p><button onclick="startCenterAddition(${count},${cost+design+permit},'${type}',${parking})">Approve Project</button> <button onclick=openCenterExpansion()>Back</button>`}
function startCenterAddition(count,total,type,parking){if(G.cash<total*.2)return alert(`You need at least ${money(total*.2)} cash for the project equity.`);let equity=Math.round(total*.2);G.cash-=equity;G.debt+=total-equity;addLedger(`${P().name} expansion project equity`,-equity);let weeks=type==="anchor"?52:count===4?36:26,phase={name:type==="anchor"?"Anchor Addition":`${count}-Suite Addition`,count,type,total,weeks,status:"Construction",parking,started:stamp()};P().expansion.phases.push(phase);P().condition=Math.max(0,P().condition-2);G.appearance.cleanliness=Math.max(0,G.appearance.cleanliness-5);G.appearance.landscape=Math.max(0,G.appearance.landscape-4);G.phone.push({from:G.managers.property?.name||"Project Manager",text:`Construction has started on the ${phase.name}. Expect temporary parking and access disruption.`});closeModal();render()}
function expansionConstructionTick(){let e=P().expansion,phase=e.phases.find(x=>x.status==="Construction");if(!phase)return;phase.weeks=Math.max(0,phase.weeks-4);if(Math.random()<.12){let over=Math.round(phase.total*(.01+Math.random()*.025));if(G.cash>=over){G.cash-=over;phase.total+=over;addLedger(`${phase.name} construction change order`,-over);G.phone.push({from:"General Contractor",text:`We hit an unexpected site condition on the ${phase.name}. Change order: ${money(over)}.`})}}if(phase.weeks<=0)completeCenterAddition(phase)}

function normalizePhoneItem(x){if(!x)return x;if(!x.id)x.id=G.nextPhoneId++;let txt=(x.text||"").toLowerCase(),from=x.from||"";if(x.finding===undefined&&(txt.includes("should look")||txt.includes("come take a look")||txt.includes("you should see"))){let fi=G.maintenanceFindings.findIndex(f=>!f.resolved&&(f.from===from||from.toLowerCase().includes("earl")));if(fi<0){let f=createMaintenanceFinding();fi=G.maintenanceFindings.length-1}x.finding=fi}if(!x.tenant){let ti=P().stores.findIndex(t=>t&&((t.owner===from)||from.includes(t.owner.split(" ")[0])));if(ti>=0)x.tenant=P().stores[ti].name}if(!x.topic){if(txt.includes("late")&&txt.includes("rent"))x.topic="relief";else if(txt.includes("lease")||txt.includes("renew"))x.topic="lease";else if(txt.includes("sign"))x.topic="signage";else if(txt.includes("parking"))x.topic="parking";else if(txt.includes("hvac")||txt.includes("heat")||txt.includes("cool"))x.topic="hvac";else if(txt.includes("maintenance"))x.topic="maintenance";else if(txt.includes("expand"))x.topic="expansion";else if(txt.includes("trash")||txt.includes("dumpster"))x.topic="trash";else x.topic="general"}return x}

function openPhoneRequest(id){let x=G.phone.find(p=>p.id===id);if(!x)return;normalizePhoneItem(x);if(x.finding!==undefined&&G.maintenanceFindings[x.finding]&&!G.maintenanceFindings[x.finding].resolved){goSeeFinding(x.finding);return}let i=x.tenant?P().stores.findIndex(t=>t&&t.name===x.tenant):-1;if(i>=0){P().stores[i].pendingTopic=x.topic;if(x.topic==="relief"){rentAccount(i);return}if(x.topic==="maintenance"){tenantMaintenanceConversation(i,x);return}ownerInteraction(i);return}modal.style.display="flex";modalbox.innerHTML=`<h2>☎️ ${x.from}</h2><p>${x.text}</p><button onclick="markPhoneResolved(${x.id})">Mark Handled</button> <button onclick=closeModal()>Close</button>`}
function markPhoneResolved(id){let x=G.phone.find(p=>p.id===id);if(x)x.resolved=true;closeModal();render()}

function signProposal(i,kind){let t=P().stores[i];ensureStorefrontSign(t,i);let sg=t.storefrontSign,cost={refresh:1800,channel:6500,modern:9800}[kind]||0;if(kind==="tenant"){t.rel=Math.min(100,(t.rel||60)+2);G.phone.push({from:t.owner,text:"Thanks. I'll send over a sign package for approval before we order anything."});sg.pending=true;closeModal();render();return}if(G.cash<cost)return alert(`Need ${money(cost)} cash.`);G.cash-=cost;addLedger(`${t.name} storefront sign`, -cost);if(kind==="refresh"){sg.condition=100;sg.year=G.year;sg.outdated=false}else{let palettes=kind==="modern"?[["#1f2937","#f9fafb"],["#e7e5e4","#111827"],["#25364a","#f5e9c8"]]:[["#6b1f1f","#fff7ed"],["#164e63","#ecfeff"],["#365314","#f7fee7"],["#3f3f46","#fafafa"]],p=rand(palettes);sg.style=kind==="modern"?"Modern illuminated":"Channel letters";sg.bg=p[0];sg.text=p[1];sg.font=kind==="modern"?"sans-serif":"serif";sg.condition=100;sg.year=G.year;sg.outdated=false;sg.logo=signIconFor(t.type)}t.rel=Math.min(100,(t.rel||60)+5);G.appearance.sign=Math.min(100,(G.appearance.sign||60)+3);rememberOwner(t,`Approved a ${sg.style.toLowerCase()} storefront sign in ${G.year}.`);closeModal();render()}
function storefrontSignHTML(t,i){ensureStorefrontSign(t,i);let sg=t.storefrontSign;return`<span class=tenantSign style="background:${sg.bg};color:${sg.text};font-family:${sg.font};opacity:${.55+.45*sg.condition/100}">${sg.logo||""} ${t.name}${sg.outdated?" <small>★</small>":""}</span>`}
function signIconFor(type=""){let x=type.toLowerCase();if(x.includes("pizza")||x.includes("restaurant"))return"🍕";if(x.includes("hair"))return"✂";if(x.includes("laund"))return"◉";if(x.includes("pharm"))return"✚";if(x.includes("grocery"))return"◆";if(x.includes("pet"))return"🐾";if(x.includes("insurance"))return"▣";return"●"}
function ensureStorefrontSign(t,i){if(t.storefrontSign)return;let palettes=[["#7c2d12","#fff7ed"],["#1e3a5f","#f8fafc"],["#3f6212","#f7fee7"],["#4c1d95","#faf5ff"],["#44403c","#f5f5f4"],["#991b1b","#fff"]],p=palettes[i%palettes.length];t.storefrontSign={style:G.year<1995?"Painted cabinet":G.year<2010?"Box sign":"Channel letters",bg:p[0],text:p[1],font:i%2?"serif":"sans-serif",condition:82,year:Math.max(1978,(t.since||G.year)),outdated:false,logo:signIconFor(t.type)}}
function ageStorefrontSigns(){P().stores.forEach((t,i)=>{if(!t)return;ensureStorefrontSign(t,i);let sg=t.storefrontSign;sg.condition=Math.max(20,sg.condition-(1+Math.random()*2));let age=G.year-sg.year;if(age>12)sg.outdated=true;if(age>20&&Math.random()<.18)G.phone.push({from:t.owner,text:`Our storefront sign is ${age} years old and really starting to look dated. Can we discuss replacing it?`,tenant:i,topic:"signage"})})}
function tenantMaintenanceConversation(i,x){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>🔧 ${t.name} — Maintenance Question</h2><p><b>${t.owner}:</b> "${x.text}"</p><p>What would you like to do?</p><button onclick="createTenantIssue(${i},'hvac')">Ask About HVAC / Temperature</button> <button onclick="createTenantIssue(${i},'trash')">Ask About Common Area / Trash</button> <button onclick="createTenantIssue(${i},'parking')">Ask About Parking / Exterior</button> <button onclick="ownerSubject(${i},'property')">Ask What They Noticed</button> <button onclick=closeModal()>Close</button>`}
function handleWorldBubble(){let x=G.phone[G.phone.length-1];if(!x)return;if(x.finding!==undefined&&G.maintenanceFindings[x.finding]&&!G.maintenanceFindings[x.finding].resolved){goSeeFinding(x.finding);return}if(x.tenant){let i=P().stores.findIndex(t=>t&&t.name===x.tenant);if(i>=0){if(x.topic==="relief"){rentAccount(i);return}ownerInteraction(i);return}}openCallCenter()}

function handlePhoneItem(i){let x=G.phone[i];if(!x)return;if(x.finding!==undefined){goSeeFinding(x.finding);return}if(x.tenant){let ti=P().stores.findIndex(t=>t&&t.name===x.tenant);if(ti>=0){if(x.topic==="relief")rentAccount(ti);else ownerInteraction(ti);return}}}
function maintenanceFindingsHTML(){let open=G.maintenanceFindings.filter(x=>!x.resolved);return open.length?open.map((f,i)=>`<div class=log><b>${f.from}</b> · ${f.area}<br>${f.summary}<br><button class=attentionPulse onclick="goSeeFinding(${G.maintenanceFindings.indexOf(f)})">Go See It</button></div>`).join(""):"No unresolved maintenance findings."}
function createMaintenanceFinding(){let p=P(),vacant=[];p.stores.forEach((t,i)=>{if(!t)vacant.push(i)});let occupied=[];p.stores.forEach((t,i)=>{if(t)occupied.push(i)});let choices=[
{area:"Roof behind Tony's",summary:"Earl found a soft-looking roof area and staining near a penetration.",cat:"roof",cost:1800},
{area:"Rear service alley",summary:"Dumpster pad is cracked and drainage is holding water.",cat:"paving",cost:1200},
{area:"Parking lot",summary:"A pothole is opening near the main drive aisle.",cat:"paving",cost:950},
{area:"Rooftop HVAC",summary:"One RTU is making an unusual bearing noise.",cat:"hvac",cost:1600},
{area:"Electrical room",summary:"Earl noticed heat discoloration near a panel connection.",cat:"electrical",cost:2200},
{area:"Monument sign",summary:"Water is getting into the lower sign cabinet.",cat:"electrical",cost:850}
];if(vacant.length){let vi=rand(vacant);choices.push({area:`Vacant Suite ${101+vi}`,summary:"Earl found signs of moisture along the rear wall while checking the vacant suite.",cat:"plumbing",cost:1400,suite:vi})}else if(occupied.length){let oi=rand(occupied),t=p.stores[oi];choices.push({area:`${t.name} — Suite ${101+oi}`,summary:`During a common-area check, Earl noticed moisture staining near the rear wall outside ${t.name}. He wants you to see it before it gets worse.`,cat:"plumbing",cost:1400,suite:oi,tenant:t.name})}
let f={...rand(choices),date:stamp(),resolved:false,status:"New",notes:[]};G.maintenanceFindings.push(f);let idx=G.maintenanceFindings.length-1;G.phone.push({from:"Earl Thompson",text:`I found something at ${f.area} you should look at.`,finding:idx,topic:"maintenance"});return idx}
function goSeeFinding(i){paused=true;if(typeof updateRunButton==="function")updateRunButton();let f=G.maintenanceFindings[i];if(!f||f.resolved)return;modal.style.display="flex";modalbox.innerHTML=`<h2>🔦 Property Walk — ${f.area}</h2><div class=inspectScene><div class=inspectBuilding><div class=inspectIssue>${f.icon}</div><b>${f.area}</b><p>${f.detail}</p></div></div><div class=inspectTalk><b>${f.from}:</b> "${maintenanceAdvice(f)}"</div><h3>What do you want to do?</h3><button class=walkChoice onclick="findingAction(${i},'work')">Create Work Order</button><button class=walkChoice onclick="findingAction(${i},'vendor')">Get Vendor Opinion / Quote</button><button class=walkChoice onclick="findingAction(${i},'temp')">Temporary Fix</button><button class=walkChoice onclick="findingAction(${i},'watch')">Monitor It</button><button onclick=closeModal()>Leave Area</button>`}
function maintenanceAdvice(f){if(f.cat==="roof")return "We can patch it, but with the age of this roof I'd keep replacement in mind.";if(f.cat==="hvac")return "I wouldn't let this one go too long. If that motor fails, the tenant could lose cooling.";if(f.cat==="electrical")return "I don't want to mess around with a hot panel. I'd get BrightLine out here.";if(f.cat==="paving")return "I can cold-patch it, but that's not a permanent repair.";if(f.cat==="plumbing")return "We need to figure out where that water is coming from before it becomes mold or wall damage.";return "I wanted you to see it before I did anything expensive."}
function findingAction(i,a){let f=G.maintenanceFindings[i];if(a==="work"){P().issues.push({text:f.detail,cost:f.cost,category:f.cat,asset:f.asset});f.resolved=true;G.phone.push({from:f.from,text:"I put it on the work-order list. You can assign staff or a vendor from Operations."})}else if(a==="vendor"){P().issues.push({text:`Vendor inspection: ${f.detail}`,cost:f.cost,category:f.cat,asset:f.asset});f.resolved=true;G.phone.push({from:f.from,text:"Okay. It's on the work board so you can choose a vendor."})}else if(a==="temp"){let cost=Math.round(f.cost*.22);if(G.cash<cost)return alert("Need "+money(cost));G.cash-=cost;addLedger(`Temporary repair — ${f.area}`,-cost);if(f.asset&&G.assets[f.asset])G.assets[f.asset].condition=Math.min(100,G.assets[f.asset].condition+5);f.resolved=true;G.phone.push({from:f.from,text:"I made a temporary repair. It'll buy us some time, but don't forget about it."})}else{f.resolved=true;if(f.asset&&G.assets[f.asset])G.assets[f.asset].condition=Math.max(0,G.assets[f.asset].condition-2);G.phone.push({from:f.from,text:"Okay, we'll keep an eye on it. I'll tell you if it gets worse."})}closeModal();render()}
function openFindingFromPhone(i){if(G.maintenanceFindings[i])goSeeFinding(i)}
function ensureRentAccount(t){if(!G.rentAccounts[t.name])G.rentAccounts[t.name]={status:"Current",balance:0,daysLate:0,lastPayment:null,promise:null,history:[]};return G.rentAccounts[t.name]}
function rentRollHTML(full=false){let ts=P().stores.filter(t=>t&&t.rent>0),late=ts.filter(t=>ensureRentAccount(t).balance>0),rows=full?ts:(late.length?late:ts.slice(0,5));return `<p><b>${late.length}</b> tenant${late.length===1?"":"s"} currently past due · Total A/R <b>${money(late.reduce((n,t)=>n+ensureRentAccount(t).balance,0))}</b></p>${rows.map(t=>{let a=ensureRentAccount(t),i=P().stores.indexOf(t);return`<div class=log><b>${t.name}</b> — <span class="${a.balance>0?'bad':'good'}">${a.balance>0?`${money(a.balance)} PAST DUE · ${a.daysLate} days`:"CURRENT ✓"}</span><br>Monthly rent/CAM: ${money(t.rent+t.cam)}${a.promise?`<br>Arrangement: ${a.promise}`:""}<br><button onclick="rentAccount(${i})">${a.balance>0?"Discuss / Collect":"View Account"}</button></div>`}).join("")}`}
function rentAccount(i){let t=P().stores[i],a=ensureRentAccount(t);modal.style.display="flex";modalbox.innerHTML=`<h2>💵 ${t.name} — Rent Account</h2><p><b>Owner:</b> ${t.owner}<br><b>Status:</b> ${a.balance>0?"PAST DUE":"CURRENT"}<br><b>Past-due balance:</b> ${money(a.balance)}<br><b>Days late:</b> ${a.daysLate}<br><b>Normal rent + CAM:</b> ${money(t.rent+t.cam)}${a.promise?`<br><b>Arrangement:</b> ${a.promise}`:""}</p>${a.balance>0?`<button onclick="rentResolve(${i},'pay')">Collect Full Payment</button> <button onclick="rentResolve(${i},'plan')">3-Month Payment Plan</button> <button onclick="rentResolve(${i},'partial')">Accept 50% Now</button> <button onclick="rentResolve(${i},'reduce')">15% Rent Relief</button> <button onclick="rentResolve(${i},'deposit')">Apply Security Deposit</button> <button onclick="rentResolve(${i},'notice')">Formal Late Notice</button> <button onclick="rentResolve(${i},'default')">Begin Default Process</button>`:`<p>This tenant is current.</p>`}<h3>History</h3>${a.history.slice(-8).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"No collection history yet."}<br><button onclick="ownerInteraction(${i})">Talk to Owner</button> <button onclick=closeModal()>Close</button>`}
function rentResolve(i,x){let t=P().stores[i],a=ensureRentAccount(t),b=a.balance,n="";if(!b)return rentAccount(i);if(x==="pay"){G.cash+=b;addLedger(`${t.name} past-due rent`,b);a.balance=0;n=`${money(b)} paid in full.`}else if(x==="plan"){a.promise=`3-month plan: ${money(Math.ceil(b/3))}/month plus current rent`;a.status="Payment Plan";t.rel+=5;n=`Payment plan approved for ${money(b)}.`}else if(x==="partial"){let q=Math.round(b/2);G.cash+=q;a.balance-=q;addLedger(`${t.name} partial rent`,q);n=`Accepted ${money(q)}; ${money(a.balance)} remains.`}else if(x==="reduce"){let q=Math.round(t.rent*.15);a.balance=Math.max(0,a.balance-q);t.rel+=7;n=`Granted ${money(q)} rent credit.`}else if(x==="deposit"){let q=Math.min(t.deposit,a.balance);t.deposit-=q;a.balance-=q;n=`Applied ${money(q)} security deposit.`}else if(x==="notice"){a.status="Formal Notice";t.rel-=7;n=`Formal late notice issued.`}else{a.status="Default / Legal";t.rel-=15;n=`Default process started.`}if(a.balance<=0){a.balance=0;a.daysLate=0;a.status="Current";a.promise=null;t.pendingTopic=null}a.history.push(`${stamp()}: ${n}`);rememberOwner(t,n);rentAccount(i);render()}
function ageReceivables(){P().stores.filter(t=>t&&t.rent>0).forEach(t=>{let a=ensureRentAccount(t);if(a.balance>0)a.daysLate+=30})}
function dailyScheduleHTML(){if(!G.dailySchedule.length)generateDailySchedule();return G.dailySchedule.map(x=>`<div class=appointment><span class=scheduleTime>${x.time}</span> ${x.text}${x.done?" ✓":""}</div>`).join("")}
function generateDailySchedule(){let pool=["Earl / maintenance check-in","Review overnight work orders","Walk parking lot","Tenant check-in","Review bank deposits","Vendor follow-up","Leasing inquiry follow-up","Review upcoming lease expirations"];G.dailySchedule=[{time:"8:05",text:"Arrive at property"},{time:"8:20",text:rand(pool)},{time:"9:30",text:rand(pool)},{time:"11:15",text:rand(pool)},{time:"1:30",text:rand(pool)},{time:"3:45",text:rand(pool)}]}

function performPM(i){let p=G.pmTasks[i],cost={hvac:1200,roof:900,fire:700,plumbing:650,paving:450,pest:350,restaurant:600}[p.cat]||500;if(G.cash<cost)return alert("Need "+money(cost));G.cash-=cost;addLedger(p.name,-cost);p.last=G.year*12+G.month;if(p.cat==="fire")G.fireSafety=Math.min(100,G.fireSafety+8);if(p.cat==="paving")G.assets.parking.condition=Math.min(100,G.assets.parking.condition+3);if(p.cat==="roof")G.assets.roof.condition=Math.min(100,G.assets.roof.condition+4);render()}

function calculateUtilities(){let occ=P().stores.filter(Boolean).length,season=[12,1,2].includes(G.month)?1.35:[6,7,8].includes(G.month)?1.25:1;G.utilities.lastWater=G.utilities.water||0;G.utilities.electric=Math.round((1400+occ*240)*season*(1+(100-G.assets.electrical.condition)/250));G.utilities.gas=Math.round((500+occ*95)*([12,1,2].includes(G.month)?1.8:.7));G.utilities.water=Math.round((380+occ*75)*(Math.random()<.04?1.8:1));let total=G.utilities.electric+G.utilities.gas+G.utilities.water;G.budgetActual.utilities+=total;G.cash-=total;addLedger("Electric utility",-G.utilities.electric);addLedger("Gas utility",-G.utilities.gas);addLedger("Water utility",-G.utilities.water);if(G.utilities.lastWater&&G.utilities.water>G.utilities.lastWater*1.45)P().issues.push({text:"Investigate unusually high water usage",cost:1200,category:"plumbing"})}
function bankCapitalHTML(){let future=Object.entries(G.assets).sort((a,b)=>a[1].condition-b[1].condition).slice(0,4);return`<p><b>Capital reserves:</b> ${money(G.reserves)} <button onclick="moveReserve()">Transfer to Reserves</button></p><p><b>Banker:</b> ${G.banker.name} · Relationship ${G.banker.rel}% <button onclick=bankMeeting()>Call Banker</button></p><h4>5-Year Capital Outlook</h4>${future.map(([k,a])=>`<div class=reserveBox><b>${k}</b> — ${a.condition.toFixed(0)}%, age ${a.age}/${a.life}<br>${a.condition<45?"Likely near-term capital need":a.age>a.life-4?"Plan replacement within 1–4 years":"Monitor / maintain"}</div>`).join("")}<p>Tax assessment: ${money(G.taxAssessment)} <button onclick=appealTax()>Appeal Assessment</button></p>`}
function moveReserve(){let v=+prompt("Amount to transfer from operating cash to capital reserves:","10000");if(!v||v<0||G.cash<v)return;G.cash-=v;G.reserves+=v;addLedger("Transfer to capital reserves",-v);render()}
function bankMeeting(){modal.style.display="flex";modalbox.innerHTML=`<h2>🏦 ${G.banker.name}</h2><p>"Your operating history matters when we look at future loans. Keep occupancy, cash flow and property condition healthy."</p><p>Bank relationship: ${G.banker.rel}%</p><button onclick="bankRequest('line')">Request $50k Credit Line</button> <button onclick="bankRequest('capex')">Discuss Capital Loan</button> <button onclick=closeModal()>End Meeting</button>`}
function bankRequest(type){let ok=(P().stores.filter(Boolean).length/P().stores.length*.4)+(P().condition/100*.3)+(G.banker.rel/100*.3)>.58;if(ok){let amt=type==="line"?50000:100000;G.cash+=amt;G.debt+=amt;G.banker.rel+=2;addLedger(`${type==="line"?"Credit line":"Capital loan"} proceeds`,amt);alert("Approved.")}else{G.banker.rel-=2;alert("Bank declined based on current property performance.")}closeModal();render()}
function appealTax(){if(G.taxAppealYear===G.year)return alert("Already appealed this year.");G.taxAppealYear=G.year;let win=Math.random()<.48;if(win){G.taxAssessment=Math.round(G.taxAssessment*.92);G.phone.push({from:"Tax Consultant",text:"Assessment appeal succeeded. The taxable value was reduced."})}else G.phone.push({from:"Tax Consultant",text:"Assessment appeal was denied this year."});render()}
function claimsHTML(){return G.claims.length?G.claims.slice(-6).reverse().map(c=>`<div class=claim><b>${c.type}</b> · ${c.status}<br>Damage ${money(c.damage)} · Deductible ${money(c.deductible)}${c.status==="Open"?`<br><button onclick="processClaim(${G.claims.indexOf(c)})">Meet Adjuster</button>`:""}</div>`).join(""):"No insurance claims."}
function createClaim(type,damage){G.claims.push({type,damage,deductible:5000,status:"Open"});G.phone.push({from:"Insurance Carrier",text:`Claim opened for ${type}. An adjuster needs to inspect the property.`})}
function processClaim(i){let c=G.claims[i],covered=Math.random()<.82;if(covered){let pay=Math.max(0,c.damage-c.deductible);G.cash+=pay;addLedger(`Insurance claim payment — ${c.type}`,pay);c.status="Paid"}else c.status="Denied / excluded";render()}
function contractorBids(project,base,cat){let vendors=G.vendors.filter(v=>v.cat===cat||v.cat==="general").slice(0,3);modal.style.display="flex";modalbox.innerHTML=`<h2>📋 Bids — ${project}</h2>${vendors.map(v=>{let price=Math.round(base*v.factor*(.92+Math.random()*.16));return`<div class=bid><b>${v.name}</b><br>${money(price)} · Quality ${v.quality} · Reliability ${v.reliability}<br><button onclick="awardBid('${project}','${v.name}',${price})">Award</button></div>`}).join("")}<button onclick=closeModal()>Cancel</button>`}
function awardBid(project,vendor,price){if(G.cash+G.reserves<price)return alert("Insufficient cash and reserves.");let fromRes=Math.min(G.reserves,price);G.reserves-=fromRes;G.cash-=price-fromRes;addLedger(`${project} — ${vendor}`,-price);startProject(project,5+~~(Math.random()*8));closeModal();render()}
function customerComplaint(){let list=["Potholes are rough near the entrance.","Parking lot is too dark at night.","Snow is blocking accessible parking.","Trash around the dumpster looks bad.","I couldn't tell which entrance to use.","Accessible parking markings are faded."],text=rand(list);G.customerComplaints.push({date:stamp(),text});G.phone.push({from:"Customer Complaint",text});if(text.includes("accessible"))G.ada-=4;if(text.includes("dark"))P().lights-=3}
function staffAnnualRealism(){G.staff.forEach(e=>{e.pay=Math.round(e.pay*1.03);if(Math.random()<.08){G.staffAbsences.push({name:e.name,date:stamp(),reason:rand(["sick day","vacation","family emergency"])});G.phone.push({from:e.name,text:`I need to be off today — ${G.staffAbsences.at(-1).reason}.`})}})}
function environmentalEvent(){if(G.environmentalChecked||G.year<1990)return;if(Math.random()<.025){G.environmentalChecked=true;let issue=rand(["Suspected asbestos flooring found during renovation","Old underground tank records discovered","Possible lead-containing paint identified"]);P().issues.push({text:issue,cost:12000+~~(Math.random()*28000),category:"general"});G.phone.push({from:"Environmental Consultant",text:issue})}}
function tenantConflict(){let ts=P().stores.filter(Boolean);if(ts.length<2)return;let a=rand(ts),b=rand(ts.filter(x=>x!==a)),reason=rand(["delivery trucks blocking storefront access","music/noise complaints","restaurant odors","shared dumpster problems","customers using the wrong reserved spaces"]);G.phone.push({from:a.owner,text:`I need you to deal with ${b.name}. We're having problems with ${reason}.`,tenant:a.name,topic:"general"});rememberOwner(a,`Conflict with ${b.name}: ${reason}.`)}
function salePropertyProcess(){if(!G.saleProcess){G.saleProcess={stage:"Broker opinion",offer:Math.round(propertyValue(P())*(.92+Math.random()*.16))};G.phone.push({from:"Investment Sales Broker",text:"I prepared a broker opinion of value and can market the center if you want."})}else{let stages=["Broker opinion","Listed","Buyer offers","Due diligence","Buyer inspection / retrade","Closing"];let i=stages.indexOf(G.saleProcess.stage);G.saleProcess.stage=stages[Math.min(stages.length-1,i+1)]}render()}
function assetHTML(){if(!G.assets)return"";return Object.entries(G.assets).map(([k,a])=>{let c=a.condition<35?"bad":a.condition<60?"warn":"";return`<div><b>${k.toUpperCase()}</b> · Age ${a.age} yrs / expected ${a.life} · ${a.condition.toFixed(0)}%<div class=assetbar><i class="${c}" style="width:${Math.max(0,a.condition)}%"></i></div><button onclick="assetOptions('${k}')">Inspect / Plan</button></div>`}).join("")}
function assetOptions(k){let a=G.assets[k],cat={roof:"roof",parking:"paving",hvac:"hvac",plumbing:"plumbing",electrical:"electrical",sign:"signage",lighting:"electrical",landscape:"landscape"}[k];let replace={roof:65000,parking:48000,hvac:12000,plumbing:18000,electrical:22000,sign:14000,lighting:16000,landscape:9000}[k];modal.style.display="flex";modalbox.innerHTML=`<h2>${k.toUpperCase()} Asset</h2><p>Condition <b>${a.condition.toFixed(0)}%</b> · Age <b>${a.age}</b> years · Typical useful life <b>${a.life}</b> years</p><p>${a.condition<30?"Failure risk is high. Replacement planning is urgent.":a.condition<55?"The asset is aging and repairs are becoming more likely.":"Asset is currently serviceable."}</p><button onclick="preventiveMaintenance('${k}','${cat}',${Math.round(replace*.08)})">Preventive Maintenance — ${money(Math.round(replace*.08))}</button> <button onclick="replaceAsset('${k}','${cat}',${replace})">Direct Replace — ${money(replace)}</button> <button onclick="contractorBids('${k} replacement',${replace},'${cat}')">Get 3 Bids</button> <button onclick=closeModal()>Close</button>`}
function preventiveMaintenance(k,cat,cost){if(G.cash<cost)return alert("Need "+money(cost));let a=G.assets[k];G.cash-=cost;addLedger(`${k} preventive maintenance`,-cost);a.condition=Math.min(100,a.condition+12);remember(`${k} Maintenance`,`${k} received preventive maintenance.`);closeModal();render()}
function replaceAsset(k,cat,cost){if(G.cash<cost)return alert("Need "+money(cost));let a=G.assets[k];G.cash-=cost;addLedger(`${k} replacement`,-cost);a.condition=100;a.age=0;if(k==="roof")P().roof=100;if(k==="parking")P().parking=100;if(k==="sign")P().sign=100;if(k==="lighting")P().lights=100;P().condition=Math.min(100,P().condition+4);remember(`${k} Replacement`,`A major ${k} replacement was completed.`);closeModal();render()}
function ageDetailedAssets(){G.rtus.forEach(r=>{r.age++;r.condition=Math.max(0,r.condition-(3+Math.random()*5+(r.age>r.life?5:0)));if(r.condition<35&&Math.random()<.35){r.repairs++;P().issues.push({text:`RTU #${r.id} failure serving ${r.tenant}`,cost:2200+~~(Math.random()*3500),category:"hvac"})}});G.roofSections.forEach(r=>{r.age++;r.condition=Math.max(0,r.condition-(2+Math.random()*4));if(r.condition<40&&Math.random()<.3)P().issues.push({text:`Roof leak — ${r.name}`,cost:3000+~~(Math.random()*5000),category:"roof"})});G.ada=Math.max(25,G.ada-(Math.random()*2));G.fireSafety=Math.max(30,G.fireSafety-(Math.random()*2))}
function ageAssets(){Object.entries(G.assets).forEach(([k,a])=>{a.age+=1;a.condition=Math.max(0,a.condition-(2+Math.random()*4+(a.age>a.life?4:0)));if(a.condition<45&&Math.random()<.38)assetFailure(k,a);});P().roof=G.assets.roof.condition;P().parking=G.assets.parking.condition;P().sign=G.assets.sign.condition;P().lights=G.assets.lighting.condition}
function assetFailure(k,a){let map={roof:["Roof leak from aging membrane",6500,"roof"],parking:["Parking lot cracking and pothole failure",4200,"paving"],hvac:["Aging rooftop HVAC unit failure",4800,"hvac"],plumbing:["Water line / drain failure",3600,"plumbing"],electrical:["Electrical panel / circuit issue",3900,"electrical"],sign:["Monument sign electrical/structure failure",2400,"signage"],lighting:["Parking lot light failure",1900,"electrical"],landscape:["Landscape irrigation / dead plantings",1400,"landscape"]},m=map[k];if(P().issues.some(x=>x.asset===k))return;P().issues.push({text:m[0],cost:m[1],category:m[2],asset:k});G.phone.push({from:"Property Alert",text:`${m[0]}. Asset condition is ${a.condition.toFixed(0)}%.`})}
function enterOffice(){let era=G.year<1995?"☎️ desk phone · 🗄️ metal file cabinets · 📒 paper ledger":G.year<2010?"☎️ phone · 🖥️ beige computer · 🗄️ tenant files":"📱 phone · 🖥️ dual monitors · ☁️ property software";modal.style.display="flex";modalbox.innerHTML=`<h2>🏢 Management Office — ${G.year}</h2><div class=officeRoom><p><b>${era}</b></p><div class=officeGrid><button class=officeObj onclick="officePhone()">☎️<br>Phone</button><button class=officeObj onclick="officeCalendar()">📅<br>Calendar</button><button class=officeObj onclick="officeFiles()">📁<br>Tenant Files</button><button class=officeObj onclick="officeWorkBoard()">🛠️<br>Work Board</button><button class=officeObj onclick="officeBooks()">💰<br>Accounting</button><button class=officeObj onclick="officeNews()">📰<br>Local News</button></div></div><p>Office level ${G.officeLevel}</p><button onclick=officeUpgrade()>Improve Office</button> <button onclick=closeModal()>Leave Office</button>`}
function officePhone(){modalbox.innerHTML=`<h2>☎️ Phone</h2><p>Click any call to handle it.</p>${G.phone.slice(-15).reverse().map(x=>phoneRowHTML(x)).join("")||"No recent calls."}<button onclick=enterOffice()>Back</button>`}
function officeCalendar(){modalbox.innerHTML=`<h2>📅 Calendar</h2>${appointmentHTML()}<button onclick=enterOffice()>Back</button>`}
function officeFiles(){modalbox.innerHTML=`<h2>📁 Tenant Files</h2>${P().stores.map((t,i)=>t?`<div class=log><b>${t.name}</b> · ${t.owner}<br>Lease ends ${t.leaseEnd} · Rent ${money(t.rent)}<br><button onclick="openTenant(${i})">Open File</button></div>`:"").join("")}<button onclick=enterOffice()>Back</button>`}
function officeWorkBoard(){modalbox.innerHTML=`<h2>🛠️ Work Board</h2>${G.workJobs.map(j=>`<div class=log><b>${j.vendor}</b> — ${j.text}<br>${j.status} · ${j.remaining} hr remaining<div class=woProgress><i style="width:${Math.max(5,100-j.remaining/j.total*100)}%"></i></div></div>`).join("")||"No active vendor jobs."}<button onclick=enterOffice()>Back</button>`}
function officeBooks(){modalbox.innerHTML=`<h2>💰 Accounting</h2>${ledgerHTML()}<button onclick=enterOffice()>Back</button>`}
function officeNews(){modalbox.innerHTML=`<h2>📰 Local Business News</h2>${G.townHistory.slice(-12).reverse().map(x=>`<div class=log>${x}</div>`).join("")||"Nothing major in the local business news."}<button onclick=enterOffice()>Back</button>`}
function appointmentHTML(){return G.appointments.length?G.appointments.slice(0,8).map((a,i)=>`<div class=appointment><b>${a.when}</b> — ${a.title}<br>${a.detail||""}<br><button onclick="handleAppointment(${i})">Handle</button></div>`).join(""):"No scheduled appointments."}
function handleAppointment(i){let a=G.appointments[i];if(a.kind==="tour")tourProspect(a.lead);else alert(a.detail||a.title);G.appointments.splice(i,1);render()}
function scheduleTour(leadIndex){let l=P().leads[leadIndex];G.appointments.push({when:`${stamp()} · 10:30 AM`,title:`Property tour — ${l.name}`,detail:`${l.owner} will tour available space.`,kind:"tour",lead:leadIndex});G.phone.push({from:l.owner,text:"Great, I'll see you for the property tour."});render()}
function tourProspect(i){let l=P().leads[i];if(!l)return;let vacancy=P().stores.findIndex(x=>!x);modal.style.display="flex";modalbox.innerHTML=`<h2>🏢 Property Tour — ${l.name}</h2><p>${l.owner} arrives and walks Suite ${101+vacancy} with you.</p><p><b>Business:</b> ${l.type}<br><b>Proposed rent:</b> ${money(l.rent)}<br><b>TI request:</b> ${money(l.ti)}</p><p>"${l.type==="Restaurant"||l.type==="Pizza"?"Does this suite have enough power, plumbing and ventilation for my kitchen?":"How much work can I do to the suite and storefront?"}"</p><button onclick="interview(${i})">Discuss LOI / Economics</button> <button onclick=closeModal()>End Tour</button>`}
function rememberOwner(t,text){G.ownerMemories[t.name]=G.ownerMemories[t.name]||[];G.ownerMemories[t.name].push(`${stamp()}: ${text}`);if(G.ownerMemories[t.name].length>12)G.ownerMemories[t.name]=G.ownerMemories[t.name].slice(-12)}
function rentCollection(){ageReceivables();P().stores.filter(Boolean).forEach(t=>{if(t.rent<=0)return;let a=ensureRentAccount(t),due=t.rent+t.cam,late=Math.random()>(t.health/130+.2);if(late){a.balance+=due;a.daysLate=Math.max(a.daysLate,1);a.status="Past Due";a.history.push(`${stamp()}: ${money(due)} became past due.`);G.phone.push({from:t.owner,text:`I'm going to be late on this month's rent. Can we talk?`,tenant:t.name,topic:"relief"});t.pendingTopic="relief"}else{G.cash+=due;addLedger(`${t.name} rent & CAM`,due);a.lastPayment=stamp();a.history.push(`${stamp()}: ${money(due)} paid.`)}})}
function reliefMeeting(i){rentAccount(i);return;let t=P().stores[i];modalbox.innerHTML=`<h2>💵 Rent Problem — ${t.name}</h2><p>${t.owner}: "I need some breathing room. I don't want to lose the business."</p><button onclick="reliefAction(${i},'plan')">3-Month Payment Plan</button> <button onclick="reliefAction(${i},'reduce')">Temporary 15% Reduction</button> <button onclick="reliefAction(${i},'deposit')">Apply Security Deposit</button> <button onclick="reliefAction(${i},'notice')">Formal Late Notice</button>`}
function reliefAction(i,a){let t=P().stores[i];if(a==="plan"){t.rel+=5;t.health+=3;rememberOwner(t,"You approved a payment plan.")}if(a==="reduce"){t.rel+=8;t.health+=6;G.cash-=Math.round(t.rent*.15);rememberOwner(t,"You granted temporary rent relief.")}if(a==="deposit"){G.cash+=t.deposit;t.deposit=0;t.rel-=2;rememberOwner(t,"Security deposit was applied to delinquent rent.")}if(a==="notice"){t.rel-=8;t.health-=4;rememberOwner(t,"You issued a formal late notice.")}t.pendingTopic=null;closeModal();render()}
function snowForecast(){if(G.snowDepth>0){serviceSnowEvent();G.snowPlan.ready=false;}if(![11,12,1,2,3].includes(G.month))return;if(Math.random()<.18){let inches=3+~~(Math.random()*8);G.snowDepth=inches;G.phone.push({from:"Weather Service",text:`Winter storm forecast: ${inches} inches expected. ${G.snowContract?"SnowForce is on contract.":"No snow contractor is currently pre-authorized."}`});if(!G.snowContract)G.appointments.push({when:stamp(),title:"Snow response decision",detail:`${inches} inches forecast. Consider arranging snow service.`})}}
function townEvolution(){let events=["A new subdivision opened near the center.","A regional employer announced an expansion.","A competing shopping center broke ground across town.","New apartments opened within the trade area.","A major road project changed traffic patterns.","A large retailer closed elsewhere in town.","A medical development opened nearby.","A new highway interchange improved regional access."];let e=rand(events);G.townHistory.push(`${G.year}: ${e}`);if(e.includes("apartments")||e.includes("subdivision")||e.includes("employer")){G.population+=300+~~(Math.random()*1000);G.traffic+=2}else if(e.includes("competing"))G.competition+=8;else if(e.includes("road"))G.traffic+=rand([-5,5]);}
function ownerLifeAnnual(){P().stores.filter(Boolean).forEach(t=>{if(Math.random()<.07){let e=rand(["A family member started helping with the business.","The owner is considering retirement.","The business added a manager.","The owner's child has expressed interest in taking over someday.","The owner mentioned possibly selling the business."]);rememberOwner(t,e);t.suiteHistory.push(`${G.year}: ${e}`)}if(t.ownerAge>67&&Math.random()<.12){t.pendingTopic="future";G.phone.push({from:t.owner,text:"I'd like to talk about my future with the business.",tenant:t.name,topic:"future"})}})}
function advanceVendorJobs(){G.workJobs.forEach(j=>{j.remaining-=speed;j.status=j.remaining<=2?"Finishing":"On site"});let done=G.workJobs.filter(j=>j.remaining<=0);done.forEach(j=>{let issue=P().issues[j.issue];if(issue){P().issues.splice(j.issue,1);if(issue.asset&&G.assets[issue.asset])G.assets[issue.asset].condition=Math.min(100,G.assets[issue.asset].condition+18)}G.phone.push({from:j.vendor,text:`Work completed: ${j.text}`})});G.workJobs=G.workJobs.filter(j=>j.remaining>0)}
function openOwnerByName(name){let i=P().stores.findIndex(t=>t&&t.name===name);if(i>=0)ownerInteraction(i);else{tab="desk";render()}}
function businessHours(type){if(type==="Grocery")return [7,21];if(["Pizza","Restaurant"].includes(type))return [11,22];if(type==="Hair Salon")return [9,18];if(["Insurance","Medical","Dental","Office"].includes(type))return [8,17];if(type==="Pharmacy")return [8,20];return [9,20]}
function isOpen(t){let h=t.hours||businessHours(t.type);return simHour>=h[0]&&simHour<h[1]}
function vacancyAge(pp,i){let logs=pp.history.filter(x=>x.includes(`Suite ${101+i}`)&&x.toLowerCase().includes("vacant"));return logs.length?Math.min(5,logs.length):0}
function addLedger(desc,amt){G.ledger.push({date:stamp(),desc,amt:Math.round(amt)});if(G.ledger.length>100)G.ledger=G.ledger.slice(-100)}
function ledgerHTML(){return G.ledger.length?G.ledger.slice(-18).reverse().map(x=>`<div class=ledgerRow><span>${x.date} · ${x.desc}</span><b class="${x.amt>=0?'good':'bad'}">${x.amt>=0?'+':''}${money(x.amt)}</b></div>`).join(""):"No transactions recorded yet."}
function toggleSnowContract(){G.snowContract=!G.snowContract;G.phone.push({from:"SnowForce",text:G.snowContract?"Snow service contract confirmed for the season.":"Snow service contract canceled."});render()}
function vendorHTML(){let cats=[...new Set(G.vendors.map(v=>v.cat))];return cats.map(c=>`<details><summary><b>${c.toUpperCase()}</b> (${G.vendors.filter(v=>v.cat===c).length})</summary>${G.vendors.filter(v=>v.cat===c).map(v=>`<div class=vendorCard><b>${v.name}</b><br>Quality ${v.quality} · Reliability ${v.reliability} · Price ${v.factor<.9?"$":v.factor>1.1?"$$$":"$$"}<br>Jobs completed: ${v.jobs||0}</div>`).join("")}</details>`).join("")}
function visitStore(i){let t=P().stores[i];if(!t)return;let open=isOpen(t),busy=Math.max(0,Math.round((t.sales/10000)*trafficByHour()));modal.style.display="flex";modalbox.innerHTML=`<h2>${t.name}</h2><div class=interior><div class=tenantSign>${t.name} · ${open?"OPEN":"CLOSED"}</div><p>${interiorDescription(t)}</p><div>${open?Array.from({length:Math.min(10,busy)},()=>`<span class=tableIcon>${t.type==="Grocery"?"🛒":"🧍"}</span>`).join(""):"🌙 The business is closed right now."}</div><p><b>${t.owner}</b> ${open?"is here today.":"is not currently in the store."}</p></div><p>${t.struggling?"The store feels noticeably quieter than it used to.":busy>5?"Business looks busy today.":"Traffic looks normal."}</p><button onclick="talk(${i})">Talk to ${t.owner.split(" ")[0]}</button> <button onclick="leaseManager(${i})">Discuss Lease</button> <button onclick=closeModal()>Leave Store</button>`}
function interiorDescription(t){if(t.type==="Pizza")return "🍕 Counter · 🍽️ dining tables · 🚪 kitchen · 📦 back room";if(t.type==="Grocery")return "🥫 Grocery aisles · 🥩 coolers · 🛒 carts · 📦 receiving area";if(t.type==="Hair Salon")return "💇 Styling chairs · 🪞 mirrors · 🧴 product shelves";if(t.type==="Pharmacy")return "💊 Pharmacy counter · 🧴 retail aisles · 🧾 checkout";return "🪑 Customer area · 🧾 counter · 📦 stock room"}
function suiteHistory(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>📚 Suite ${101+i} History</h2><div class=suiteHistory>${(t.suiteHistory||[]).map(x=>`<div class=log>${x}</div>`).join("")}${P().history.filter(x=>x.includes(`Suite ${101+i}`)).map(x=>`<div class=log>${x}</div>`).join("")}</div><button onclick=closeModal()>Close</button>`}
function assignIssue(i){let issue=P().issues[i],matches=G.vendors.filter(v=>v.cat===issue.category||v.cat==="general"||(issue.category==="maintenance"&&["general","painting","electrical","plumbing"].includes(v.cat)));modal.style.display="flex";modalbox.innerHTML=`<h2>Assign Work Order</h2><p>${issue.text}</p><h3>Employees</h3>${G.staff.map((e,j)=>`<button onclick="repairWithStaff(${i},${j})">${e.name} · ${e.role}</button>`).join(" ")||"No employees"}<h3>Vendors</h3>${matches.map(v=>`<div class=vendorCard><b>${v.name}</b> · Q${v.quality}/R${v.reliability}<br>Quote approx. ${money(issue.cost*v.factor)}<br><button onclick="repairWithVendor(${i},'${v.name.replaceAll("'","")}')">Hire Vendor</button></div>`).join("")||"No specialized vendor. Use general contractor."}<button onclick=closeModal()>Cancel</button>`}
function repairWithStaff(ii,si){let issue=P().issues[ii],e=G.staff[si],cost=Math.round(issue.cost*.4),chance=(e.quality+e.reliability)/200;if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;addLedger(`${e.name}: ${issue.text}`,-cost);if(Math.random()<chance){P().issues.splice(ii,1);P().condition=Math.min(100,P().condition+1);G.phone.push({from:e.name,text:"Work order completed."})}else{issue.cost=Math.round(issue.cost*1.2);G.phone.push({from:e.name,text:"I couldn't finish that repair. We may need a specialist."})}closeModal();render()}
function repairWithVendor(ii,name){let issue=P().issues[ii],v=G.vendors.find(x=>x.name===name);if(!v)return;let cost=Math.round(issue.cost*v.factor);if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;addLedger(`${v.name}: ${issue.text}`,-cost);v.jobs=(v.jobs||0)+1;let hrs=4+~~(Math.random()*13);G.workJobs.push({vendor:v.name,text:issue.text,issue:ii,total:hrs,remaining:hrs,status:"Dispatched",category:issue.category});G.phone.push({from:v.name,text:`We're dispatched for ${issue.text}. Estimated ${hrs} work hours.`});closeModal();render()}

function tenantRumor(){let tenants=P().stores.filter(Boolean);if(!tenants.length)return;let t=rand(tenants);if(t.health<55&&!G.rumors.includes(t.name)){G.rumors.push(t.name);G.phone.push({from:rand(tenants).owner,text:`I don't know if it's true, but I've heard ${t.owner} at ${t.name} has been having a rough year.`});t.struggling=true}}
function afterHoursEmergency(){let e=rand([{t:"Water leaking through a tenant ceiling after hours.",c:"plumbing",cost:4200},{t:"Restaurant reports no heat after closing.",c:"hvac",cost:3600},{t:"Rear door / glass damaged after hours.",c:"glass",cost:2800}]);P().issues.push({text:e.t,cost:e.cost,category:e.c});G.phone.push({from:"After-hours call",text:e.t})}
function competitionEvent(){let names=["New Discount Center","Crossroads Shopping Center","Regional Supercenter","New Grocery Development","Lifestyle Shops"];let x={name:rand(names),year:G.year,impact:5+~~(Math.random()*10)};G.competitionSites.push(x);G.competition=Math.min(100,G.competition+x.impact);G.inbox.push({from:"Local Business News",text:`${x.name} has opened nearby. Expect increased retail competition.`})}
function businessPeriod(){return simHour<10?"Opening":simHour<12?"Morning":simHour<14?"Lunch rush":simHour<17?"Afternoon":simHour<20?"Evening":"Closed / closing"}
function trafficByHour(){if(simHour<7||simHour>21)return .08;if(simHour>=11&&simHour<=13)return 1.15;if(simHour>=16&&simHour<=19)return 1.05;return .68}
function toggleTime(){paused=!paused;pauseBtn.textContent=paused?"▶ Run":"⏸ Pause";restartTimer();render()}
function restartTimer(){if(simTimer)clearInterval(simTimer);if(!paused)simTimer=setInterval(simStep,Math.max(450,1800/speed))}
function simStep(){if(paused)return;simHour++;advanceVendorJobs();if(simHour>21){simHour=8;advanceWeek()}else{livingEvents();render()}}
function livingEvents(){
 let pp=P();
 if(Math.random()<.08&&pp.stores.some(x=>!x))incomingInquiry();
 if(Math.random()<.045&&pp.stores.filter(Boolean).length){let t=rand(pp.stores.filter(Boolean)),topics=["general","lease","parking","hvac","signage","expansion","trash"],topic=rand(topics);t.pendingTopic=topic;let msg={general:`Can you stop by ${t.name} when you get a chance? I want to talk.`,lease:`I want to talk about my lease before renewal.`,parking:`My customers are complaining about parking today. Can we do something?`,hvac:`Something doesn't seem right with the HVAC. Can you come look?`,signage:`I want to talk about improving my storefront sign.`,expansion:`Business has been good. I want to talk about expanding.`,trash:`We need to talk about the dumpster area behind my store.`}[topic];G.phone.push({from:t.owner,text:msg,tenant:t.name,topic});}
 if(Math.random()<.035&&G.staff.length){let e=rand(G.staff);G.phone.push({from:e.name,text:rand(["I finished my current work order.","I noticed something behind the building you should look at.","A tenant stopped me with a maintenance question."])})}
 if(Math.random()<.025)randomDecision();if(Math.random()<.025)tenantRumor();if(Math.random()<.012&&!G.maintenanceFindings.some(x=>!x.resolved))createMaintenanceFinding();if(Math.random()<.004)competitionEvent();if(Math.random()<.004)requestInspection();if(Math.random()<.006&&simHour>=19)afterHoursEmergency();
 if(G.phone.length>20)G.phone=G.phone.slice(-20)
}
function renderLife(){
 if(!window.life)return;let pp=P(),people=Math.min(14,Math.round(pp.stores.filter(Boolean).length*trafficByHour()+G.traffic/20)),html="";
 for(let i=0;i<people;i++){let left=8+Math.random()*84,top=48+Math.random()*42;html+=`<span class=personDot style="left:${left}%;top:${top}%">${i%5===0?"🛒":i%7===0?"📦":"🚶"}</span>`}
 if(G.parkingPolicy.reserved)html+=`<div class=bubble style="left:38%;top:78%">🅿️ RESERVED CUSTOMER PARKING</div>`;pp.stores.forEach((t,i)=>{if(t&&t.patioTables){let col=i%4,row=Math.floor(i/4),left=4.5+col*23,top=row===0?51:66;html+=`<div class=patioTables data-suite="${101+i}" title="${t.name} patio — Suite ${101+i}" style="left:${left}%;top:${top}%">${Array.from({length:t.patioTables},()=>"<span>🪑</span>").join("")}<small style="position:absolute;white-space:nowrap;left:0;top:18px;font-size:8px">🍕 ${t.name}</small></div>`}});if(pp.parking<55){for(let p=0;p<Math.min(4,Math.floor((60-pp.parking)/8)+1);p++)html+=`<span class=pothole style="left:${18+p*19}%;top:${76+(p%2)*8}%"></span>`}if(pp.condition<55){for(let w=0;w<3;w++)html+=`<span class=weed style="left:${6+w*42}%;top:55%">🌿</span>`}if(G.snowDepth>0)html+=`<div class=snowCover></div>`;if(G.parkingPolicy.reserved||G.assets.parking.condition>85)html+=`<div class=freshStripe></div>`;if(G.projects.length)html+=`<div class=constructionBanner>🚧 ${G.projects[0].name} — ${G.projects[0].stage}</div>`;if(G.workJobs.length){html+=`<span class=worktruck style="right:9%;top:70%">🚚</span><span class=constructionCrew style="right:14%;top:62%">👷</span>`}else if(pp.issues.length)html+=`<span class=worktruck style="right:9%;top:70%">🚚</span>`;if(G.phone.length){let x=G.phone[G.phone.length-1];html+=`<div class=bubble style="right:4%;top:18%" onclick="${x.finding!==undefined?`openFindingFromPhone(${x.finding})`:(x.tenant?`openOwnerByName(\'${x.tenant.replaceAll("\'","")}\')`:`tab=\'desk\';render()`)}">☎️ <b>${x.from}</b><br>${x.text}</div>`}
 let issue=pp.issues[0];if(issue)html+=`<div class=bubble style="left:5%;top:44%" onclick="tab='ops';render()">🔧 ${issue.text}</div>`;
 life.innerHTML=html
}
function leadSource(){let sources=["FOR LEASE sign / drive-by","Tenant referral","Local business owner","Newspaper classified"];if(G.year>=1998)sources.push("Property website");if(G.year>=2008)sources.push("Online commercial listing");if(G.broker)sources.push("Broker referral","Broker cold call");return rand(sources)}
function incomingInquiry(){if(P().leads.length>5)return;generateLead();let x=P().leads[P().leads.length-1];G.phone.push({from:x.owner,text:`I'm calling about your available space. I'm considering ${x.name}. I found you through ${x.source}.`})}
function marketVacancies(){if(!P().stores.some(x=>!x))return alert("No vacant suites.");let cost=G.year<1995?650:G.year<2008?1200:1800;if(G.cash<cost)return alert("Not enough cash.");G.cash-=cost;P().marketing=Math.min(100,P().marketing+18);let channel=G.year<1995?"newspaper classified and roadside signage":G.year<2008?"newspaper, broker flyer and property website":"commercial listing sites, property website and signage";G.leasingSources=[...new Set([...G.leasingSources,channel])];G.phone.push({from:"Leasing",text:`Vacancies advertised through ${channel}. Inquiries will arrive over time.`});render()}
function setAskingRent(){let cur=P().askingRent||2400,v=prompt("Monthly asking rent for vacant suites:",cur);if(v===null)return;v=Math.max(500,Math.min(25000,Number(v)||cur));P().askingRent=Math.round(v);render();closeModal()}
function leaseManager(i){let t=P().stores[i];modal.style.display="flex";modalbox.innerHTML=`<h2>📑 ${t.name} — Lease</h2><div class=leaseBox><label>Current base rent <input id=rentEdit type=number min=500 value="${t.rent}"></label><label>CAM charge <input id=camEdit type=number min=0 value="${t.cam}"></label><label>Annual escalation % <input id=escEdit type=number min=0 max=15 step=.5 value="${(t.escalator*100).toFixed(1)}"></label><label>Lease expiration year <input id=endEdit type=number min="${G.year}" value="${t.leaseEnd}"></label></div><p><small>You can propose changes, but an existing tenant may reject an unreasonable mid-lease rent increase. Normal rent increases are best handled at renewal or through the lease's annual escalation.</small></p><button onclick="proposeLease(${i})">Propose Changes</button> <button onclick="renew(${i})">Negotiate Renewal</button> <button onclick=closeModal()>Cancel</button>`}
function proposeLease(i){let t=P().stores[i],nr=Math.max(500,+rentEdit.value||t.rent),nc=Math.max(0,+camEdit.value||t.cam),ne=Math.max(0,Math.min(.15,(+escEdit.value||0)/100)),ny=Math.max(G.year,+endEdit.value||t.leaseEnd),jump=(nr-t.rent)/t.rent;let allowed=jump<=t.escalator+.01||G.year>=t.leaseEnd;if(!allowed){t.rel=Math.max(0,t.rel-4);G.phone.push({from:t.owner,text:`That rent change isn't in my lease. We can discuss it at renewal.`});alert("Tenant rejected the mid-lease base-rent increase. Existing lease terms still control.");return leaseManager(i)}t.rent=Math.round(nr);t.cam=Math.round(nc);t.escalator=ne;t.leaseEnd=ny;t.history.push(`${stamp()}: Lease economics updated`);P().history.push(`${stamp()} — Lease terms updated for ${t.name}.`);closeModal();render()}

function remember(title,text){if(!G.memories.some(x=>x.title===title&&x.date===stamp()))G.memories.push({title,date:stamp(),text})}
function openingScenario(){if(G.opened)return;G.opened=true;modal.style.display="flex";modalbox.innerHTML=`<h2>🏬 January 1985 — Welcome to Lakeview Plaza</h2><p>You just bought an aging neighborhood strip center with existing leases, an old roof, a tired parking lot and several owners eager to meet the new landlord.</p><p><b>Mortgage:</b> ${money(G.debt)}<br><b>Starting cash:</b> ${money(G.cash)}<br><b>Condition:</b> ${P().condition}%<br><b>Existing tenants:</b> ${P().stores.filter(Boolean).length}</p><p>Collect rent, fill vacancies, keep the building alive, and try not to make Tony mad.</p><button onclick="remember('The Lakeview Purchase','You took ownership of Lakeview Plaza and inherited its original tenants.');closeModal();render()">Take the Keys 🔑</button>`}
function randomDecision(){
 let qs=[
  ...(G.eventFlags.tonyPatio?[]:[{id:"tony",title:"Tony's Sidewalk Tables",text:"Tony wants six tables outside the pizza shop.",a:"Allow the tables",b:"Require a patio fee"}]),
  {id:"parking",title:"The Parking War",text:"The grocery manager says restaurant customers are taking prime spaces.",a:"Create reserved spaces",b:"Tell them to work it out"},
  {id:"paint",title:"Unauthorized Paint Job",text:"A tenant painted its storefront without approval.",a:"Require repainting",b:"Let it stay"},
  {id:"kids",title:"Kids Behind the Center",text:"Teenagers are skateboarding behind the stores.",a:"Add lighting & signs",b:"Leave it alone"}
 ];
 if(!qs.length)return;let q=rand(qs);G.pendingDecision=q.id;
 modal.style.display="flex";
 modalbox.innerHTML=`<h2>📞 ${q.title}</h2><p>${q.text}</p><button onclick="decisionResult(0)">${q.a}</button> <button onclick="decisionResult(1)">${q.b}</button> <button onclick=closeModal()>Decide Later</button>`
}
function decisionResult(n){
 let id=G.pendingDecision;
 if(id==="tony"){
  let t=P().stores.find(x=>x&&x.name.includes("Tony"));
  if(t){if(n===0){P().reputation+=2;t.health+=4;t.patioTables=6;G.eventFlags.tonyPatio=true;remember("Tony's Patio Experiment","You let Tony add six sidewalk tables.")}else{G.cash+=1500;t.rel-=4;G.eventFlags.tonyPatio=true}}
 }else if(id==="parking"){
  if(n===0){G.cash-=1200;P().reputation+=1;remember("The Parking War","You intervened in a tenant parking dispute.")}else P().reputation-=2
 }else if(id==="paint"){
  let candidates=P().stores.map((t,i)=>t?i:-1).filter(i=>i>=0),i=rand(candidates),t=P().stores[i];
  if(n===0){t.storeColor=null;P().condition+=1;P().history.push(`${stamp()} — ${t.name} was required to repaint its unauthorized storefront.`)}
  else{let colors=["#e94b3c","#7b2cbf","#00a6a6","#f08c00","#e83e8c","#2f9e44","#1971c2"];t.storeColor=rand(colors);P().reputation+=1;P().condition-=1;remember("The Unauthorized Paint Job",`${t.name}'s unapproved storefront color became part of the center's look.`)}
 }else if(id==="kids"){
  if(n===0){G.cash-=2000;P().security+=4}else if(Math.random()<.4)addIssue("Skateboard damage behind the center.",1800,"maintenance")
 }
 G.pendingDecision=null;closeModal();autoSave();render()
}

function parkingMeeting(i){let t=P().stores[i],p=G.parkingPolicy;modalbox.innerHTML=`<h2>🅿️ Parking Meeting — ${t.name}</h2><p>${t.owner}: "I don't necessarily need a perfect solution, but customers need to be able to get in and out."</p><p><b>Current parking condition:</b> ${P().parking.toFixed(0)}<br><b>Town traffic:</b> ${G.traffic}<br><b>Center occupancy:</b> ${Math.round(P().stores.filter(Boolean).length/P().stores.length*100)}%</p><button onclick="parkingAction(${i},'reserved')">Reserve Customer Spaces — $1,200</button> <button onclick="parkingAction(${i},'rear')">Move Employee Parking to Rear — $500</button> <button onclick="parkingAction(${i},'signs')">Add Parking Signs — $900</button> <button onclick="parkingAction(${i},'enforce')">Hire Parking Enforcement — $1,800/mo setup</button> <button onclick="parkingAction(${i},'repave')">Re-stripe / Improve Lot — $8,500</button> <button onclick="parkingAction(${i},'ignore')">No Changes</button>`}
function parkingAction(i,a){let t=P().stores[i],cost=0,msg="";if(a==="reserved"){cost=1200;G.parkingPolicy.reserved=true;msg="Reserved customer spaces were marked near busy storefronts.";P().parking+=2}else if(a==="rear"){cost=500;G.parkingPolicy.employeeRear=true;msg="Tenants were asked to move employee vehicles behind the center.";P().parking+=3}else if(a==="signs"){cost=900;G.parkingPolicy.signage=true;msg="Parking and directional signs were installed.";P().parking+=2}else if(a==="enforce"){cost=1800;G.parkingPolicy.enforcement=true;msg="A parking enforcement service began patrols.";P().parking+=4}else if(a==="repave"){cost=8500;msg="The lot was re-striped and problem areas repaired.";P().parking=Math.min(100,P().parking+14);P().condition+=2}else{t.rel-=4;msg="You decided not to change the parking setup.";P().reputation-=1}if(G.cash<cost)return alert("Need "+money(cost));G.cash-=cost;if(cost)addLedger(msg,-cost);rememberOwner(t,msg);t.pendingTopic=null;if(a!=="ignore")t.rel=Math.min(100,t.rel+5);P().history.push(`${stamp()} — ${msg}`);closeModal();render()}
function annualReview(){ageAssets();ageDetailedAssets();ageAppearance();ownerLifeAnnual();staffAnnualRealism();if(Math.random()<.65)townEvolution();let pp=P(),occ=Math.round(pp.stores.filter(Boolean).length/pp.stores.length*100),arr=pp.stores.filter(Boolean).slice().sort((a,b)=>b.sales-a.sales),best=arr[0];G.lastAnnual=`<b>${G.year-1} Results</b><br>Occupancy ${occ}% · Value ${money(propValue(pp))}<br>Debt ${money(G.debt)}<br>Best tenant: ${best?best.name:"None"}<br>Open work orders: ${pp.issues.length}`;G.inbox.push({from:"Annual Review",text:`Your ${G.year-1} year-end report is ready.`})}
function hallOfFame(){let all=[];G.properties.forEach(pp=>pp.stores.filter(Boolean).forEach(t=>all.push(t)));all.sort((a,b)=>a.since-b.since);let longest=all[0];modal.style.display="flex";modalbox.innerHTML=`<h2>🎖️ Hall of Fame</h2><p>Career: ${G.year-1985} years<br>Properties: ${G.properties.length}<br>Portfolio value: ${money(G.properties.reduce((a,p)=>a+propValue(p),0))}<br>Career rent: ${money(G.career.rent)}<br>Debt: ${money(G.debt)}<br>Longest current tenant: ${longest?longest.name+" since "+longest.since:"None"}<br>Employees retired: ${G.career.employeesRetired}<br>Disasters survived: ${G.career.disasters}</p><h3>Memories</h3>${G.memories.slice(-12).map(x=>`<div class=log><b>${x.title}</b> — ${x.date}</div>`).join("")}<button onclick=closeModal()>Back</button>`}
function autoSave(){try{localStorage.setItem("stripMallTycoonV87",JSON.stringify(G))}catch(e){}}

function save(){localStorage.setItem("stripMallTycoonV87",JSON.stringify(G));localStorage.setItem("stripMallTycoonV3",JSON.stringify(G));localStorage.setItem("stripMallTycoonV2",JSON.stringify(G));alert("Saved.")}
function load(){let s=localStorage.getItem("stripMallTycoonV87")||localStorage.getItem("stripMallTycoonV86")||localStorage.getItem("stripMallTycoonV85")||localStorage.getItem("stripMallTycoonV84")||localStorage.getItem("stripMallTycoonV83")||localStorage.getItem("stripMallTycoonV82")||localStorage.getItem("stripMallTycoonV81")||localStorage.getItem("stripMallTycoonV80")||localStorage.getItem("stripMallTycoonV73")||localStorage.getItem("stripMallTycoonV72")||localStorage.getItem("stripMallTycoonV71")||localStorage.getItem("stripMallTycoonV70")||localStorage.getItem("stripMallTycoonV62")||localStorage.getItem("stripMallTycoonV61")||localStorage.getItem("stripMallTycoonV60")||localStorage.getItem("stripMallTycoonV50")||localStorage.getItem("stripMallTycoonV41")||localStorage.getItem("stripMallTycoonV40")||localStorage.getItem("stripMallTycoonV321")||localStorage.getItem("stripMallTycoonV32")||localStorage.getItem("stripMallTycoonV31")||localStorage.getItem("stripMallTycoonV3")||localStorage.getItem("stripMallTycoonV2")||localStorage.getItem("stripMallTycoonV1");if(!s)return alert("No save found.");G=JSON.parse(s);migrate();render()}
function newGame(){if(!G||confirm("Start a new 1985 career?")){G=base();render();setTimeout(openingScenario,80)}}
function closeModal(){modal.style.display="none"}newGame();
</script></body></html>
